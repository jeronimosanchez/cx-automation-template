<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CX Petal — Inventario de Artefactos</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --accent-indigo: #6366f1;
    --accent-emerald: #10b981;
    --accent-amber: #f59e0b;
    --accent-sky: #0ea5e9;
    --accent-violet: #8b5cf6;

    --bg: #ffffff;
    --bg-2: #f6f8fa;
    --bg-3: #eaeef2;
    --border: #d0d7de;
    --text: #1f2328;
    --text-2: #57606a;
    --text-3: #5c6872;

    --nav-bg: #0d1117;
    --nav-border: #21262d;

    /* Semantic tags */
    --tag-utterance-bg: rgba(14,165,233,0.10);
    --tag-utterance-fg: #0369a1;
    --tag-utterance-border: rgba(14,165,233,0.30);
    --tag-task-bg: rgba(99,102,241,0.10);
    --tag-task-fg: #4338ca;
    --tag-task-border: rgba(99,102,241,0.30);
    --tag-param-bg: rgba(16,185,129,0.10);
    --tag-param-fg: #047857;
    --tag-param-border: rgba(16,185,129,0.30);
    --tag-http-bg: rgba(245,158,11,0.10);
    --tag-http-fg: #92400e;
    --tag-http-border: rgba(245,158,11,0.30);
    --tag-llm-bg: rgba(139,92,246,0.10);
    --tag-llm-fg: #6d28d9;
    --tag-llm-border: rgba(139,92,246,0.30);
    --tag-ok-bg: rgba(16,185,129,0.10);
    --tag-ok-fg: #047857;
    --tag-ok-border: rgba(16,185,129,0.30);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117; --bg-2: #161b22; --bg-3: #21262d;
      --border: #30363d; --text: #e6edf3; --text-2: #8b949e; --text-3: #6e7681;
      --tag-utterance-fg: #38bdf8;
      --tag-task-fg: #818cf8;
      --tag-param-fg: #34d399;
      --tag-http-fg: #fcd34d;
      --tag-llm-fg: #c4b5fd;
      --tag-ok-fg: #34d399;
    }
  }
  :root[data-theme="light"] {
    --bg: #ffffff; --bg-2: #f6f8fa; --bg-3: #eaeef2;
    --border: #d0d7de; --text: #1f2328; --text-2: #57606a; --text-3: #5c6872;
    --tag-utterance-fg: #0369a1;
    --tag-task-fg: #4338ca;
    --tag-param-fg: #047857;
    --tag-http-fg: #92400e;
    --tag-llm-fg: #6d28d9;
    --tag-ok-fg: #047857;
  }
  :root[data-theme="dark"] {
    --bg: #0d1117; --bg-2: #161b22; --bg-3: #21262d;
    --border: #30363d; --text: #e6edf3; --text-2: #8b949e; --text-3: #6e7681;
    --tag-utterance-fg: #38bdf8;
    --tag-task-fg: #818cf8;
    --tag-param-fg: #34d399;
    --tag-http-fg: #fcd34d;
    --tag-llm-fg: #c4b5fd;
    --tag-ok-fg: #34d399;
  }

  html, body {
    height: 100%;
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  body {
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
  }

  /* ── TOP BAR ── */
  .topbar {
    background: var(--nav-bg);
    border-bottom: 1px solid var(--nav-border);
    flex-shrink: 0;
    padding: 0 24px;
    height: 50px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .topbar-brand {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #e6edf3;
    flex-shrink: 0;
  }
  .topbar-sep { color: #30363d; }
  .topbar-label {
    font-size: 12px;
    color: #8b949e;
  }
  .topbar-label strong { color: #e6edf3; font-weight: 600; }
  .topbar-time {
    font-size: 11px;
    color: #6e7681;
    margin-left: auto;
    flex-shrink: 0;
  }
  .topbar-refresh {
    flex-shrink: 0;
    padding: 5px 12px;
    border-radius: 5px;
    border: 1px solid #30363d;
    background: transparent;
    color: #8b949e;
    font-size: 11px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
    display: flex;
    align-items: center;
    gap: 5px;
    margin-left: 10px;
  }
  .topbar-refresh:hover { border-color: #818cf8; color: #818cf8; }
  .topbar-refresh:disabled { opacity: 0.5; cursor: default; }

  /* ── LAYOUT ── */
  .layout {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── RESOURCE GRID ── */
  .resource-grid-wrap {
    flex-shrink: 0;
    padding: 16px 24px 14px;
    background: var(--bg-2);
    border-bottom: 1px solid var(--border);
  }
  .resource-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 8px;
  }

  .resource-card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 10px 12px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
    display: flex;
    flex-direction: column;
    gap: 5px;
    text-align: left;
    font-family: inherit;
    appearance: none;
  }
  .resource-card:hover { border-color: var(--accent-indigo); }
  .resource-card.selected {
    border-color: var(--accent-indigo);
    background: rgba(99,102,241,0.06);
    box-shadow: 0 0 0 2px rgba(99,102,241,0.14);
  }
  .resource-card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .rc-icon { font-size: 15px; line-height: 1; }
  .rc-count {
    font-size: 17px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--text);
    line-height: 1;
  }
  .rc-label {
    font-size: 10.5px;
    font-weight: 600;
    color: var(--text-2);
    letter-spacing: 0.01em;
  }
  .resource-card.selected .rc-label { color: var(--tag-task-fg); }

  /* ── DETAIL ── */
  .detail-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .detail-header {
    flex-shrink: 0;
    padding: 11px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--bg);
  }
  .detail-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .detail-pill {
    display: inline-flex;
    align-items: center;
    padding: 1px 7px;
    border-radius: 10px;
    font-size: 10.5px;
    font-weight: 600;
    background: var(--tag-task-bg);
    color: var(--tag-task-fg);
    border: 1px solid var(--tag-task-border);
  }
  .detail-hint {
    margin-left: auto;
    font-size: 11px;
    color: var(--text-3);
  }
  .detail-body {
    flex: 1;
    overflow-y: auto;
    padding: 16px 24px 28px;
  }
  .detail-body::-webkit-scrollbar { width: 5px; }
  .detail-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* ── TAGS ── */
  .tag {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    padding: 2px 7px;
    border-radius: 10px;
    font-size: 10px;
    font-weight: 600;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .tag-utterance {
    background: var(--tag-utterance-bg);
    color: var(--tag-utterance-fg);
    border: 1px solid var(--tag-utterance-border);
  }
  .tag-task {
    background: var(--tag-task-bg);
    color: var(--tag-task-fg);
    border: 1px solid var(--tag-task-border);
  }
  .tag-param {
    background: var(--tag-param-bg);
    color: var(--tag-param-fg);
    border: 1px solid var(--tag-param-border);
  }
  .tag-http {
    background: var(--tag-http-bg);
    color: var(--tag-http-fg);
    border: 1px solid var(--tag-http-border);
  }
  .tag-llm {
    background: var(--tag-llm-bg);
    color: var(--tag-llm-fg);
    border: 1px solid var(--tag-llm-border);
  }
  .tag-ok {
    background: var(--tag-ok-bg);
    color: var(--tag-ok-fg);
    border: 1px solid var(--tag-ok-border);
  }
  .tag-neutral {
    background: var(--bg-3);
    color: var(--text-3);
    border: 1px solid var(--border);
  }

  /* ── EXPANDABLE ROW ── */
  .exp-row {
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
    margin-bottom: 8px;
  }
  .exp-row:last-child { margin-bottom: 0; }
  .exp-row-hdr {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 9px 13px;
    cursor: pointer;
    background: var(--bg-2);
    border: none;
    width: 100%;
    text-align: left;
    font-family: inherit;
    transition: background 0.12s;
  }
  .exp-row-hdr:hover { background: var(--bg-3); }
  .exp-row-name {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .exp-row-meta {
    display: flex;
    align-items: center;
    gap: 5px;
    flex-shrink: 0;
  }
  .exp-toggle {
    font-size: 9px;
    color: var(--text-3);
    transition: transform 0.18s;
    width: 12px;
    text-align: center;
    flex-shrink: 0;
  }
  .exp-row.open .exp-toggle { transform: rotate(90deg); }
  .exp-row-body {
    display: none;
    padding: 13px 14px;
    background: var(--bg);
    border-top: 1px solid var(--border);
  }
  .exp-row.open .exp-row-body { display: block; }

  /* ── SUB-SECTION ── */
  .sub-section { margin-top: 12px; }
  .sub-section:first-child { margin-top: 0; }
  .sub-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--text-3);
    margin-bottom: 7px;
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .sub-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* ── CHIPS ── */
  .chip-list { display: flex; flex-wrap: wrap; gap: 5px; }
  .chip {
    padding: 3px 9px;
    border-radius: 4px;
    font-size: 11.5px;
    color: var(--text-2);
    background: var(--bg-2);
    border: 1px solid var(--border);
    font-style: italic;
    line-height: 1.4;
  }

  /* ── ORDERED TASK LIST ── */
  .task-list {
    list-style: none;
    counter-reset: task-ctr;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .task-list li {
    counter-increment: task-ctr;
    font-size: 12.5px;
    color: var(--text-2);
    padding-left: 20px;
    position: relative;
    line-height: 1.5;
  }
  .task-list li::before {
    content: counter(task-ctr) '.';
    position: absolute;
    left: 0;
    font-size: 10px;
    font-weight: 700;
    color: var(--text-3);
    top: 2px;
    font-variant-numeric: tabular-nums;
  }

  /* ── TABLE ── */
  .inv-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
  }
  .inv-table th {
    text-align: left;
    padding: 6px 10px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--text-3);
    border-bottom: 2px solid var(--border);
    white-space: nowrap;
    background: var(--bg-2);
  }
  .inv-table td {
    padding: 8px 10px;
    color: var(--text-2);
    border-bottom: 1px solid var(--border);
    vertical-align: top;
  }
  .inv-table td.td-primary {
    font-weight: 500;
    color: var(--text);
  }
  .inv-table tr:last-child td { border-bottom: none; }
  .inv-table tr:hover td { background: var(--bg-2); }
  code {
    font-family: 'SF Mono', 'Fira Code', monospace;
    font-size: 10.5px;
    background: var(--bg-3);
    padding: 1px 5px;
    border-radius: 3px;
  }

  /* ── GROUP HEADER (examples / pages) ── */
  .group-hdr {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--text-3);
    margin-bottom: 8px;
    margin-top: 20px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .group-hdr:first-child { margin-top: 0; }
  .group-hdr::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }
  .group-pb-badge {
    font-size: 11px;
    font-weight: 500;
    color: var(--text-2);
    background: var(--bg-2);
    padding: 2px 9px;
    border-radius: 10px;
    border: 1px solid var(--border);
    text-transform: none;
    letter-spacing: 0;
  }

  /* ── CODE BLOCK ── */
  .code-block {
    font-family: 'SF Mono', 'Fira Code', monospace;
    font-size: 11px;
    color: var(--text-3);
    font-style: italic;
    padding: 8px 10px;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 4px;
    line-height: 1.5;
  }

  /* ── EMPTY ── */
  .empty {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 80px;
    color: var(--text-3);
    font-size: 13px;
  }

  /* ── FOCUS ── */
  :focus-visible {
    outline: 2px solid var(--accent-indigo);
    outline-offset: 2px;
  }
  .resource-card:focus-visible { outline-offset: 0; }
  .exp-row-hdr:focus-visible { outline-offset: -2px; }
</style>
</head>
<body>

<!-- ── TOP BAR ── -->
<header class="topbar">
  <div class="topbar-brand">ACT</div>
  <div class="topbar-sep">·</div>
  <div class="topbar-label">Inventario CX — <strong id="agentName">—</strong></div>

</div>

let selectedType = 'playbooks';

// ─────────────────────────────────────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────────────────────────────────────
function init() {
  document.getElementById('agentName').textContent = SNAPSHOT.agent;
  const t = new Date(SNAPSHOT.generated_at);
  const diffH = Math.round((Date.now() - t) / 3_600_000);
  document.getElementById('snapshotTime').textContent =
    diffH < 1 ? 'Snapshot: hace menos de 1 h'
    : diffH < 24 ? `Snapshot: hace ${diffH} h`
    : `Snapshot: ${SNAPSHOT.generated_at.slice(0, 10)}`;

  renderGrid();
  renderDetail('playbooks');
}

// ─────────────────────────────────────────────────────────────────────────────
// GRID
// ─────────────────────────────────────────────────────────────────────────────
function renderGrid() {
  const grid = document.getElementById('resourceGrid');
  grid.innerHTML = '';
  TYPES.forEach(rt => {
    const count = SNAPSHOT.totals[rt.key] ?? 0;
    const btn = document.createElement('button');
    btn.className = 'resource-card' + (rt.key === selectedType ? ' selected' : '');
    btn.setAttribute('role', 'listitem');
    btn.setAttribute('aria-pressed', rt.key === selectedType ? 'true' : 'false');
    btn.setAttribute('aria-label', `${rt.label}: ${count} recursos`);
    btn.innerHTML = `
      <div class="resource-card-top">
        <span class="rc-icon" aria-hidden="true">${rt.icon}</span>
        <span class="rc-count">${count}</span>
      </div>
      <div class="rc-label">${rt.label}</div>`;
    btn.addEventListener('click', () => {
      selectedType = rt.key;
      renderGrid();
      renderDetail(rt.key);
    });
    grid.appendChild(btn);
  });
}

// ─────────────────────────────────────────────────────────────────────────────
// DETAIL DISPATCHER
// ─────────────────────────────────────────────────────────────────────────────
function renderDetail(typeKey) {
  const rt = TYPES.find(r => r.key === typeKey);
  const resources = SNAPSHOT.resources[typeKey] || [];

  document.getElementById('detailIcon').textContent = rt.icon;
  document.getElementById('detailName').textContent = rt.label;
  document.getElementById('detailCount').textContent = resources.length;
  document.getElementById('detailHint').textContent = rt.hint;

  const body = document.getElementById('detailBody');
  const dispatchers = {
    playbooks:    renderPlaybooks,
    examples:     renderExamples,
    tools:        renderTools,
    intents:      renderIntents,
    entity_types: renderEntityTypes,
    webhooks:     renderWebhooks,
    generators:   renderGenerators,
    flows:        renderFlows,
    pages:        renderPages,
    agent_config: renderAgentConfig,
    environments: renderEnvironments,
    versions:     renderVersions
  };
  body.innerHTML = (dispatchers[typeKey] || (() => '<div class="empty">Sin datos.</div>'))(resources);

  // Bind expand toggles
  body.querySelectorAll('.exp-row-hdr').forEach(btn => {
    btn.addEventListener('click', () => {
      const row = btn.closest('.exp-row');
      row.classList.toggle('open');
      btn.setAttribute('aria-expanded', row.classList.contains('open') ? 'true' : 'false');
    });
  });
}

function renderExamples(resources) {
  // Agrupar por playbook
  const groups = {};
  const order = [];
  resources.forEach(ex => {
    if (!groups[ex.playbook]) { groups[ex.playbook] = []; order.push(ex.playbook); }
    groups[ex.playbook].push(ex);
  });

  return order.map(pbName => {
    const items = groups[pbName];
    const rows = items.map(ex => `
      <tr>
        <td class="td-primary">${esc(ex.displayName)}</td>
        <td style="text-align:center;font-variant-numeric:tabular-nums">${ex.turns}</td>
        <td style="font-size:11.5px;color:var(--text-3)">${esc(ex.summary)}</td>
      </tr>`).join('');
    return `
      <div class="group-hdr">
        <span>${items.length} example${items.length !== 1 ? 's' : ''}</span>
        <span class="group-pb-badge">📖 ${esc(pbName)}</span>
      </div>
      <div style="overflow-x:auto;margin-bottom:4px">
        <table class="inv-table">
          <thead><tr>
            <th>Nombre del example</th>
            <th style="width:65px;text-align:center">Turnos</th>
            <th>Descripción</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`;
  }).join('');
}

        <th>Flow</th>
        <th>Página inicial</th>
        <th style="width:70px;text-align:center">Páginas</th>
        <th>Descripción</th>
      </tr></thead>
      <tbody>
        ${resources.map(f => `<tr>
          <td class="td-primary"><span style="font-size:14px">🌊</span> ${esc(f.displayName)}</td>
          <td><code>${esc(f.startPage)}</code></td>
          <td style="text-align:center;font-variant-numeric:tabular-nums">${f.pages}</td>
          <td style="font-size:11.5px;color:var(--text-3)">${esc(f.description)}</td>
        </tr>`).join('')}
      </tbody>
    </table>
  </div>`;
}

function renderPages(resources) {
  // Agrupar por flow
  const groups = {};
  const order = [];
  resources.forEach(pg => {
    if (!groups[pg.flow]) { groups[pg.flow] = []; order.push(pg.flow); }
    groups[pg.flow].push(pg);
  });

  return order.map(flowName => {
    const items = groups[flowName];
    const rows = items.map(pg => `
      <tr>
        <td class="td-primary">${esc(pg.displayName)}</td>
        <td style="font-size:11.5px;color:var(--text-3)">${esc(pg.entryFulfillment)}</td>
        <td style="text-align:center;font-variant-numeric:tabular-nums">${pg.routes}</td>
      </tr>`).join('');
    return `
      <div class="group-hdr">
        <span>${items.length} página${items.length !== 1 ? 's' : ''}</span>
        <span class="group-pb-badge">🌊 ${esc(flowName)}</span>
      </div>
      <div style="overflow-x:auto;margin-bottom:4px">
        <table class="inv-table">
          <thead><tr>
            <th>Página</th>
            <th>Entry fulfillment</th>
            <th style="width:60px;text-align:center">Rutas</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`;
  }).join('');
}

function renderAgentConfig(resources) {
  const cfg = resources[0];
  if (!cfg) return '<div class="empty">Sin configuración disponible.</div>';
  const rows = [
    ['Nombre del agente', cfg.displayName],
    ['Idioma por defecto', cfg.defaultLanguage],
    ['Zona horaria', cfg.timeZone],
    ['Región', cfg.region],
    ['Stackdriver Logging', cfg.enableStackdriverLogging ? '✓ Activado' : '✗ Desactivado'],
    ['Spell Correction', cfg.enableSpellCorrection ? '✓ Activado' : '✗ Desactivado']
  ];
  return `<div style="overflow-x:auto;max-width:480px">
    <table class="inv-table">
      <thead><tr><th>Campo</th><th>Valor</th></tr></thead>
      <tbody>${rows.map(([k, v]) => `<tr><td class="td-primary">${k}</td><td>${esc(String(v))}</td></tr>`).join('')}</tbody>
    </table>
  </div>`;
}

function renderEnvironments(resources) {
  return resources.map((env, i) => `
    <div class="exp-row" id="env-${i}">
      <button class="exp-row-hdr" aria-expanded="false" aria-controls="env-body-${i}">
        <span class="rc-icon" aria-hidden="true">🌐</span>
        <span class="exp-row-name">${esc(env.displayName)}</span>
        <div class="exp-row-meta">
          <span class="tag tag-neutral">${relTime(env.updatedAt)}</span>
          ${Object.keys(env.webHookEnvs).length > 0 ? `<span class="tag tag-task">${Object.keys(env.webHookEnvs).length} webhook env</span>` : ''}
        </div>
        <span class="exp-toggle" aria-hidden="true">▶</span>
      </button>
      <div class="exp-row-body" id="env-body-${i}">
        <div class="sub-section">
          <div class="sub-label">Versiones activas por flow</div>
          <div style="display:flex;flex-direction:column;gap:4px">
            ${Object.entries(env.flowVersions).map(([flow, ver]) => `
              <div style="font-size:12px;color:var(--text-2);display:flex;align-items:center;gap:8px;padding:5px 9px;background:var(--bg-2);border-radius:4px;border:1px solid var(--border)">
                <span style="font-weight:500;color:var(--text)">${esc(flow)}</span>
                <code style="margin-left:auto;font-size:10px">${esc(ver)}</code>
              </div>`).join('')}
          </div>
        </div>
        ${Object.keys(env.webHookEnvs).length > 0 ? `
        <div class="sub-section">
          <div class="sub-label">
            <span class="tag tag-task">Variables de entorno webhook</span>
          </div>
          <div class="chip-list">
            ${Object.entries(env.webHookEnvs).map(([k, v]) => `<span class="tag tag-task">${esc(k)}: ${esc(v)}</span>`).join('')}
          </div>
        </div>` : ''}
      </div>
    </div>`).join('');
}

function renderVersions(resources) {
  return `<div style="overflow-x:auto">
    <table class="inv-table">
      <thead><tr>
        <th>Versión</th>
        <th>Flow</th>
        <th>Estado</th>
        <th style="white-space:nowrap">Fecha</th>
        <th>Descripción</th>
      </tr></thead>
      <tbody>
        ${resources.map(v => `<tr>
          <td class="td-primary" style="font-size:11.5px">${esc(v.displayName)}</td>
          <td style="font-size:11px"><code>${esc(v.flow)}</code></td>
          <td><span class="tag tag-ok">✓ ${esc(v.status)}</span></td>
          <td style="white-space:nowrap;font-variant-numeric:tabular-nums;font-size:11.5px">${v.createdAt.slice(0, 10)}</td>
          <td style="font-size:11.5px;color:var(--text-3)">${esc(v.description)}</td>
        </tr>`).join('')}
      </tbody>
    </table>
  </div>`;
}

// ─────────────────────────────────────────────────────────────────────────────
// HELPERS
// ─────────────────────────────────────────────────────────────────────────────
function esc(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function relTime(isoStr) {
  const diffH = Math.round((Date.now() - new Date(isoStr)) / 3_600_000);
  const diffD = Math.round(diffH / 24);
  if (diffH < 1) return 'hace < 1 h';
  if (diffH < 24) return `hace ${diffH} h`;
  return `hace ${diffD} d`;
}

function handleRefresh() {
  const btn = document.getElementById('refreshBtn');
  btn.textContent = '↻ Actualizando…';
  btn.disabled = true;
  setTimeout(() => {
    btn.innerHTML = '↻ Actualizar snapshot';
    btn.disabled = false;
  }, 1500);
}

// ─────────────────────────────────────────────────────────────────────────────
init();
</script>
</body>
</html>
