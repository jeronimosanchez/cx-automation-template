  for (let i = 0; i < 5; i++) {

      el.className = 'bc-item done';
      num.textContent = '✓';

      el.className = 'bc-item active';
      num.textContent = i + 1;
    } else {
      el.className = 'bc-item';
      num.textContent = i + 1;

  }
}

  <div class="status-row" style="padding:6px 0"><span>production</span><span class="status-val">sin cambios</span></div>
</div>
    `, `<div class="btn-row"><button class="btn" onclick="go(0)">reiniciar simulación</button></div>`);
  },

  '4b'() {
    bc(4);
    set(`
<div class="success-card">
  <div class="success-title">✓ Deploy completado</div>
  <div class="success-row">Snapshot "fix-orquestador-routing" reemplazado con la versión actual.</div>
  <div class="success-row">staging apuntaba a ese snapshot — sigue apuntando al mismo, ahora actualizado.</div>
</div>
<div class="card">
  <div class="card-label">Estado de entornos</div>
  <div class="status-row" style="padding:6px 0;border-bottom:1px solid var(--border)"><span>staging</span><span class="status-val active">fix-orquestador-routing ✓ actualizado</span></div>
  <div class="status-row" style="padding:6px 0"><span>production</span><span class="status-val">sin cambios</span></div>
</div>
    `, `<div class="btn-row"><button class="btn" onclick="go(0)">reiniciar simulación</button></div>`);
  },

  '4c'() {
    bc(4);
    set(`
<div class="success-card">
  <div class="success-title">✓ Snapshot creado</div>
  <div class="success-row">"nuevo-nombre-demo" listo en CX.</div>
</div>
<div class="card">
  <div class="card-label">Estado de entornos</div>
  <div class="status-row" style="padding:6px 0;border-bottom:1px solid var(--border)"><span>staging</span><span class="status-val active">fix-orquestador-routing (actual)</span></div>
  <div class="status-row" style="padding:6px 0"><span>production</span><span class="status-val">sin cambios</span></div>
</div>
<div class="prompt-plain">¿Apunto staging al nuevo snapshot "nuevo-nombre-demo"?</div>
    `, `<div class="btn-row">
      <button class="btn primary" onclick="doStaging()">sí, apuntar staging</button>
      <button class="btn ghost" onclick="skipStaging()">no, solo el snapshot</button>
    </div>`);
  },

  abort() {
    bc(0);
    set(`<div class="card" style="color:var(--red);font-family:system-ui,sans-serif">Deploy cancelado.</div>`,
      `<div class="btn-row"><button class="btn" onclick="go(0)">reiniciar</button></div>`);
  }
};

function toggleFile(id) {
  const body = document.getElementById(id);
  const chev = document.getElementById('fchev-' + id);
  if (!body) return;
  const hidden = body.style.display === 'none';
  body.style.display = hidden ? '' : 'none';
  if (chev) chev.textContent = hidden ? '▾' : '▸';
}

function toggleArtifact(id) {
  const body = document.getElementById(id);
  const chev = document.getElementById('chev-' + id);
  if (!body) return;
  const hidden = body.style.display === 'none';
  body.style.display = hidden ? '' : 'none';
  if (chev) chev.classList.toggle('collapsed', !hidden);
}

function go(s) { steps[s] && steps[s](); }

function onMsgInput() {
  const el = document.getElementById('cmsg');
  const lbl = document.getElementById('push-label');
  if (el && lbl) lbl.textContent = el.value || S.msg;
}

function doCommit() {
  const el = document.getElementById('cmsg');
  if (el) S.msg = el.value.trim() || S.msg;
  go(2);
}

function selSnap(n) {
  S.snapMode = n;
  document.querySelectorAll('.option').forEach(el => el.classList.remove('selected'));
  document.getElementById('o' + n).classList.add('selected');
  document.getElementById('snap-btn').style.display = 'flex';
}

function doSnap() {
  if (S.snapMode === 1) go('4a');
  else if (S.snapMode === 2) go('4b');
  else go('4c');
}

function doStaging() {
  document.getElementById('output').innerHTML += `
    <div class="success-card" style="margin-top:10px">
      <div class="success-title">✓ Deploy completado</div>
      <div class="success-row">staging → "nuevo-nombre-demo"</div>
    </div>
    <div class="status-card">
      <div class="status-row"><span>staging</span><span class="status-val active">nuevo-nombre-demo ✓</span></div>
      <div class="status-row"><span>production</span><span class="status-val">sin cambios</span></div>
    </div>`;
  document.getElementById('controls').innerHTML = `<div class="btn-row"><button class="btn" onclick="go(0)">reiniciar simulación</button></div>`;
}

function skipStaging() {
  document.getElementById('output').innerHTML += `
    <div class="success-card" style="margin-top:10px">
      <div class="success-title">✓ Deploy completado</div>
      <div class="success-row">Snapshot creado. staging sin modificar.</div>
    </div>
    <div class="status-card">
      <div class="status-row"><span>staging</span><span class="status-val">fix-orquestador-routing (sin cambios)</span></div>
      <div class="status-row"><span>production</span><span class="status-val">sin cambios</span></div>
    </div>`;
  document.getElementById('controls').innerHTML = `<div class="btn-row"><button class="btn" onclick="go(0)">reiniciar simulación</button></div>`;
}

function toggleTheme() {
  const r = document.documentElement;
  r.dataset.theme = r.dataset.theme === 'light' ? 'dark' : 'light';
}

go(0);
</script>
