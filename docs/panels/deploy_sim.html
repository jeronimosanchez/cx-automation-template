      num.textContent = i + 1;

function toggleArtifact(id) {
  const body = document.getElementById(id);
  const chev = document.getElementById('chev-' + id);
  if (!body) return;
  const hidden = body.style.display === 'none';
  body.style.display = hidden ? '' : 'none';
  if (chev) chev.classList.toggle('collapsed', !hidden);
}

function go(s) { steps[s] && steps[s](); }

function onMsgInput() {
  const el = document.getElementById('cmsg');
  const lbl = document.getElementById('push-label');
  if (el && lbl) lbl.textContent = el.value || S.msg;
}

function doCommit() {
  const el = document.getElementById('cmsg');
  if (el) S.msg = el.value.trim() || S.msg;
  go(2);
}

function selSnap(n) {
  S.snapMode = n;
  document.querySelectorAll('.option').forEach(el => el.classList.remove('selected'));
  document.getElementById('o' + n).classList.add('selected');
  document.getElementById('snap-btn').style.display = 'flex';
}

function doSnap() {
  if (S.snapMode === 1) go('4a');
  else if (S.snapMode === 2) go('4b');
  else go('4c');
}

function doStaging() {
  document.getElementById('output').innerHTML += `
    <div class="success-card" style="margin-top:10px">
      <div class="success-title">✓ Deploy completado</div>
      <div class="success-row">staging → "nuevo-nombre-demo"</div>
    </div>
    <div class="status-card">
      <div class="status-row"><span>staging</span><span class="status-val active">nuevo-nombre-demo ✓</span></div>
      <div class="status-row"><span>production</span><span class="status-val">sin cambios</span></div>
    </div>`;
  document.getElementById('controls').innerHTML = `<div class="btn-row"><button class="btn" onclick="go(0)">reiniciar simulación</button></div>`;
}

function skipStaging() {
  document.getElementById('output').innerHTML += `
    <div class="success-card" style="margin-top:10px">
      <div class="success-title">✓ Deploy completado</div>
      <div class="success-row">Snapshot creado. staging sin modificar.</div>
    </div>
    <div class="status-card">
      <div class="status-row"><span>staging</span><span class="status-val">fix-orquestador-routing (sin cambios)</span></div>
      <div class="status-row"><span>production</span><span class="status-val">sin cambios</span></div>
    </div>`;
  document.getElementById('controls').innerHTML = `<div class="btn-row"><button class="btn" onclick="go(0)">reiniciar simulación</button></div>`;
}

function toggleTheme() {
  const r = document.documentElement;
  r.dataset.theme = r.dataset.theme === 'light' ? 'dark' : 'light';
}

go(0);
</script>
