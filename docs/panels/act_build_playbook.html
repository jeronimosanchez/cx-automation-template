<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACT Build Playbook</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --accent-indigo: #6366f1;
    --accent-emerald: #10b981;
    --accent-amber: #f59e0b;

    --bg: #ffffff;
    --bg-2: #f6f8fa;
    --bg-3: #eaeef2;
    --border: #d0d7de;
    --text: #1f2328;
    --text-2: #57606a;
    --text-3: #5c6872;

    --nav-bg: #0d1117;
    --nav-border: #21262d;

    --llm-bg: #eff6ff;
    --llm-border: #bfdbfe;
    --llm-header: #1d4ed8;
    --val-bg: #fffbeb;
    --val-border: #fde68a;
    --val-header: #92400e;
    --ctx-bg: #f0fdf4;
    --ctx-border: #bbf7d0;
    --ctx-header: #166534;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117; --bg-2: #161b22; --bg-3: #21262d; --border: #30363d;
      --text: #e6edf3; --text-2: #8b949e; --text-3: #6e7681;
      --llm-bg: #0f172a; --llm-border: #1e3a5f; --llm-header: #93c5fd;
      --val-bg: #1c1400; --val-border: #78350f; --val-header: #fcd34d;
      --ctx-bg: #052e16; --ctx-border: #14532d; --ctx-header: #86efac;
    }
  }
  :root[data-theme="light"] {
    --bg: #ffffff; --bg-2: #f6f8fa; --bg-3: #eaeef2; --border: #d0d7de;
    --text: #1f2328; --text-2: #57606a; --text-3: #5c6872;
    --llm-bg: #eff6ff; --llm-border: #bfdbfe; --llm-header: #1d4ed8;
    --val-bg: #fffbeb; --val-border: #fde68a; --val-header: #92400e;
    --ctx-bg: #f0fdf4; --ctx-border: #bbf7d0; --ctx-header: #166534;
  }
  :root[data-theme="dark"] {
    --bg: #0d1117; --bg-2: #161b22; --bg-3: #21262d; --border: #30363d;
    --text: #e6edf3; --text-2: #8b949e; --text-3: #6e7681;
    --llm-bg: #0f172a; --llm-border: #1e3a5f; --llm-header: #93c5fd;
    --val-bg: #1c1400; --val-border: #78350f; --val-header: #fcd34d;
    --ctx-bg: #052e16; --ctx-border: #14532d; --ctx-header: #86efac;
  }

  html, body {
    height: 100%;
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  body {
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
  }

  /* ── TOP BAR ── */
  .topbar {
    background: var(--nav-bg);
    border-bottom: 1px solid var(--nav-border);
    flex-shrink: 0;
    padding: 0 20px;
    display: flex;
    flex-direction: column;
    gap: 0;
  }

  .topbar-header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 12px 0 10px;
    border-bottom: 1px solid var(--nav-border);
  }
  .topbar-title {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #e6edf3;
  }
  .topbar-sub {
    font-size: 11px;
    color: #8b949e;
  }
  .topbar-progress-wrap {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .topbar-progress-bar {
    width: 120px;
    height: 3px;
    background: #21262d;
    border-radius: 2px;
    overflow: hidden;
  }
  .topbar-progress-fill {
    height: 100%;
    background: var(--accent-emerald);
    border-radius: 2px;
    transition: width 0.4s ease;
    width: 0%;
  }
  .topbar-progress-label {
    font-size: 11px;
    color: #8b949e;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }

  /* ── PHASE TABS ── */
  .phase-tabs {
    display: flex;
    gap: 4px;
    padding: 10px 0;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .phase-tabs::-webkit-scrollbar { display: none; }

  .phase-tab {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 4px;
    padding: 8px 12px;
    border-radius: 6px;
    cursor: pointer;
    border: 1px solid transparent;
    flex-shrink: 0;
    min-width: 100px;
    max-width: 130px;
    transition: background 0.12s, border-color 0.12s;
    position: relative;
  }
  .phase-tab:hover { background: #161b22; border-color: #30363d; }
  .phase-tab.active {
    background: #1f2937;
    border-color: var(--accent-indigo);
  }
  .phase-tab.active::after {
    content: '';
    position: absolute;
    bottom: -11px;
    left: 50%;
    transform: translateX(-50%);
    width: 24px;
    height: 2px;
    background: var(--accent-indigo);
    border-radius: 1px;
  }

  .tab-top {
    display: flex;
    align-items: center;
    gap: 6px;
    width: 100%;
  }
  .tab-num {
    font-size: 13px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    color: #8b949e;   /* dark non-active: gris visible ~5:1 sobre #0d1117 */
  }
  .phase-tab.active .tab-num { color: #e6edf3; } /* dark active: blanco ~14:1 sobre #1f2937 */
  /* Pastillas sólidas — fondo + texto blanco. Ratios WCAG 2.0 AA (#fff sobre fondo):
     .tag-py  #2563eb ~5.9:1 ✓ | .tag-html #c2410c ~4.6:1 ✓ | .tag-ci #7c3aed ~4.7:1 ✓
     .tag-audit #4b5563 ~7.2:1 ✓ | .tag-goal #047857 ~5.5:1 ✓                         */
  .tab-tag {
    margin-left: auto;
    font-size: 9px; padding: 2px 6px; border-radius: 3px; font-weight: 600;
    color: #ffffff;
    letter-spacing: 0.03em;
  }
  .tag-py    { background: #2563eb; }
  .tag-html  { background: #c2410c; }
  .tag-ci    { background: #7c3aed; }
  .tag-discarded { background: #3d2b2b; color: #e57373; }
  .phase-tab.discarded-tab .tab-name { color: #7d8590; text-decoration: line-through; }
  .tag-audit { background: #4b5563; }
  .tag-goal  { background: #047857; }
  /* .tag-build #4f46e5 ~5.4:1 ✓ | .tag-validate #0f766e ~5.6:1 ✓ — etiqueta semántica del patrón Build→Validate del pipeline */
  .tag-build    { background: #4f46e5; }
  .tag-validate { background: #0f766e; }
  .tab-filetype {
    font-size: 8px; font-weight: 700; color: #6b7280; letter-spacing: 0.05em;
    text-transform: uppercase; margin-top: 1px;
  }

  .tab-name {
    font-size: 11px;
    font-weight: 500;
    color: #8b949e;
    line-height: 1.3;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    width: 100%;
  }
  .phase-tab.active .tab-name { color: #e6edf3; }
  .phase-tab.done-tab .tab-name { color: #7d8590; } /* #7d8590 on #0d1117 ≈ 5.1:1 */

  /* ── LIGHT MODE — tab cards presencia visual + contraste ── */
  @media (prefers-color-scheme: light) {
    .tab-num { color: #4b5563; } /* light non-active: ~7.7:1 sobre #f6f8fa ✓ */
    .phase-tab { background: #f6f8fa; border-color: #d0d7de; }
    .phase-tab:hover { background: #eaeef2; border-color: #d0d7de; }
    .phase-tab.active { background: #1f2937; border-color: var(--accent-indigo); }
    .phase-tab.active .tab-num { color: #e6edf3; } /* #1f2328 on #1f2937 = 1.08:1 ✗ → #e6edf3 on #1f2937 = 12.42:1 ✓ */
    .tab-name { color: #4b5563; }          /* ~7.7:1 sobre #f6f8fa ✓ */
    .phase-tab.active .tab-name { color: #e6edf3; }
    .phase-tab.done-tab .tab-name { color: #6b7280; }
  }
  :root[data-theme="light"] .tab-num { color: #4b5563; } /* light non-active: ~7.7:1 sobre #f6f8fa ✓ */
  :root[data-theme="light"] .phase-tab { background: #f6f8fa; border-color: #d0d7de; }
  :root[data-theme="light"] .phase-tab:hover { background: #eaeef2; border-color: #d0d7de; }
  :root[data-theme="light"] .phase-tab.active { background: #1f2937; border-color: var(--accent-indigo); }
  :root[data-theme="light"] .phase-tab.active .tab-num { color: #e6edf3; } /* idem — 12.42:1 ✓ */
  :root[data-theme="light"] .tab-name { color: #4b5563; }
  :root[data-theme="light"] .phase-tab.active .tab-name { color: #e6edf3; }
  :root[data-theme="light"] .phase-tab.done-tab .tab-name { color: #6b7280; }

  /* ── CONTENT ── */
  .content {
    flex: 1;
    overflow-y: auto;
    background: var(--bg);
  }
  .content::-webkit-scrollbar { width: 6px; }
  .content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .content-inner {
    max-width: 820px;
    padding: 28px 32px;
    margin: 0 auto;
  }

  .phase-header {
    margin-bottom: 22px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--border);
  }
  .phase-eyebrow {
    font-size: 11px; font-weight: 600; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--text-3); margin-bottom: 5px;
  }
  .phase-title { font-size: 21px; font-weight: 700; color: var(--text); line-height: 1.2; }
  .phase-subtitle { font-size: 13px; color: var(--text-2); margin-top: 4px; }

  /* ── BLOCKS ── */
  .block { border-radius: 6px; border: 1px solid; overflow: hidden; margin-bottom: 14px; }
  .block-header {
    display: flex; align-items: center; gap: 8px; padding: 10px 16px;
    font-size: 11px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase;
    cursor: pointer; user-select: none;
  }
  .block-header .bh-toggle { margin-left: auto; font-size: 10px; opacity: 0.6; transition: transform 0.2s; }
  .block-header.collapsed .bh-toggle { transform: rotate(-90deg); }

  .block.ctx { border-color: var(--ctx-border); }
  .block.ctx .block-header { background: var(--ctx-bg); color: var(--ctx-header); }
  .block.llm { border-color: var(--llm-border); }
  .block.llm .block-header { background: var(--llm-bg); color: var(--llm-header); }
  .block.val { border-color: var(--val-border); }
  .block.val .block-header { background: var(--val-bg); color: var(--val-header); }
  .block.proceso { border-color: #2d4a3e; }
  .block.proceso .block-header { background: #1a3329; color: #4caf87; }
  :root[data-theme="light"] .block.proceso { border-color: #a8d5bf; }
  :root[data-theme="light"] .block.proceso .block-header { background: #eaf7f0; color: #1a6641; }
  .block.criterios { border-color: #2d3a4a; }
  .block.criterios .block-header { background: #1a2535; color: #7eb8e8; }
  :root[data-theme="light"] .block.criterios { border-color: #b8d0e8; }
  :root[data-theme="light"] .block.criterios .block-header { background: #eaf2fb; color: #1a4a6e; }

  .paso-row { display:flex; align-items:flex-start; gap:10px; margin-bottom:8px; }
  .paso-chip { flex-shrink:0; font-size:11px; font-weight:600; padding:3px 8px; border-radius:4px; cursor:pointer; border:none; }
  .paso-chip.pending { background:#333; color:#888; }
  .paso-chip.running { background:#3d2f00; color:#f0a500; }
  .paso-chip.done    { background:#1a3329; color:#4caf87; }
  .paso-chip.error   { background:#3d0000; color:#f44; }
  .paso-text { flex:1; font-size:13px; color:var(--text-1); line-height:1.5; }
  .paso-expand-btn { flex-shrink:0; font-size:11px; color:var(--text-2); background:none; border:none; cursor:pointer; padding:2px 6px; }
  .paso-output { display:none; margin-top:6px; margin-left:80px; }
  .paso-output textarea { width:100%; min-height:60px; font-size:12px; padding:8px 10px; border:1px solid var(--border); border-radius:4px; background:var(--bg); color:var(--text); font-family:inherit; resize:vertical; }
  :root[data-theme="light"] .paso-chip.pending { background:#e8e8e8; color:#666; }
  :root[data-theme="light"] .paso-chip.running { background:#fff8e0; color:#8a6000; }
  :root[data-theme="light"] .paso-chip.done    { background:#eaf7f0; color:#1a6641; }
  :root[data-theme="light"] .paso-chip.error   { background:#fff0f0; color:#c00; }
  .proceso-section-label { font-size:11px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; color:var(--text-3); margin-bottom:8px; margin-top:4px; }
  .proceso-separator { border:none; border-top:1px solid var(--border); margin:16px 0 14px; }
  .validate-btn:disabled { opacity:0.45; cursor:not-allowed; }
  .validate-btn:disabled:hover { background:var(--accent-indigo); transform:none; }

  .block-body { padding: 20px; background: var(--bg); }
  .block-body.hidden { display: none; }

  /* LLM content */
  .llm-section { margin-bottom: 18px; }
  .llm-section:last-child { margin-bottom: 0; }
  .llm-section-title {
    font-size: 11px; font-weight: 700; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--text-3); margin-bottom: 8px;
  }
  .llm-section p { font-size: 13px; color: var(--text-2); line-height: 1.6; }

  .llm-list { list-style: none; display: flex; flex-direction: column; gap: 5px; }
  .llm-list li { font-size: 13px; color: var(--text-2); padding-left: 14px; position: relative; line-height: 1.5; }
  .llm-list li::before { content: '·'; position: absolute; left: 0; color: var(--text-3); font-weight: 700; }
  .llm-list.steps { counter-reset: steps; }
  .llm-list.steps li { padding-left: 22px; }
  .llm-list.steps li::before { counter-increment: steps; content: counter(steps) '.'; font-size: 11px; font-weight: 600; color: var(--text-3); top: 1px; }

  /* Context grid */
  .ctx-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .ctx-card { background: var(--bg-2); border: 1px solid var(--border); border-radius: 5px; padding: 12px 14px; }
  .ctx-card-title { font-size: 10px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: var(--text-3); margin-bottom: 6px; }
  .ctx-card p { font-size: 12px; color: var(--text-2); line-height: 1.5; }
  .ctx-card ul { list-style: none; display: flex; flex-direction: column; gap: 3px; }
  .ctx-card ul li { font-size: 12px; color: var(--text-2); padding-left: 10px; position: relative; }
  .ctx-card ul li::before { content: '·'; position: absolute; left: 0; color: var(--text-3); }

  code { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 11.5px; background: var(--bg-3); padding: 1px 5px; border-radius: 3px; }

  .code-block {
    background: var(--bg-3); border: 1px solid var(--border); border-radius: 4px;
    padding: 10px 12px; font-family: 'SF Mono', 'Fira Code', monospace;
    font-size: 11px; color: var(--text); line-height: 1.6;
    overflow-x: auto; margin-top: 8px; white-space: pre;
  }

  .output-path {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 10px 12px; background: var(--bg-2); border: 1px solid var(--border);
    border-radius: 4px; margin-bottom: 8px;
  }
  .output-path:last-child { margin-bottom: 0; }
  .op-icon { font-size: 14px; flex-shrink: 0; margin-top: 1px; }
  .op-path { font-family: 'SF Mono', monospace; font-size: 12px; color: var(--accent-indigo); font-weight: 500; }
  .op-desc { font-size: 12px; color: var(--text-3); margin-top: 2px; }

  .template-block { background: var(--bg-2); border: 1px solid var(--border); border-radius: 4px; overflow: hidden; margin-top: 8px; }
  .template-label { padding: 6px 12px; font-size: 10px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-3); border-bottom: 1px solid var(--border); background: var(--bg-3); }

  /* Checklist */
  .checklist-group { margin-bottom: 18px; }
  .checklist-group:last-child { margin-bottom: 0; }
  .checklist-group-title {
    font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--text-3); margin-bottom: 8px; display: flex; align-items: center; gap: 6px;
  }
  .checklist-group-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  .checklist-group-header {
    background: none; border: none; padding: 0; margin: 0 0 8px; text-align: left; font-family: inherit;
    cursor: pointer; width: 100%; display: flex; align-items: center; gap: 6px;
    font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-3);
  }
  .checklist-group-header::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  .checklist-group-header:hover { color: var(--text-2); }
  .checklist-group-header .cg-toggle { font-size: 16px; opacity: 0.85; transition: transform 0.2s; flex-shrink: 0; line-height: 1; }
  .checklist-group-header.collapsed .cg-toggle { transform: rotate(-90deg); }
  .cg-body.hidden { display: none; }

  .checklist { display: flex; flex-direction: column; gap: 7px; }
  .check-item {
    display: flex; align-items: flex-start; gap: 10px; padding: 9px 12px;
    border-radius: 4px; border: 1px solid var(--border); background: var(--bg-2);
    cursor: pointer; transition: border-color 0.15s, background 0.15s;
  }
  .check-item:hover { border-color: var(--accent-amber); }
  .check-item.checked { border-color: var(--accent-emerald); background: rgba(16,185,129,0.05); }
  .check-box {
    width: 15px; height: 15px; border-radius: 3px; border: 1.5px solid var(--border);
    flex-shrink: 0; margin-top: 1px; display: flex; align-items: center; justify-content: center;
    font-size: 9px; color: transparent; transition: all 0.15s;
  }
  .check-item.checked .check-box { background: var(--accent-emerald); border-color: var(--accent-emerald); color: #fff; }
  .check-text { font-size: 13px; color: var(--text-2); line-height: 1.5; flex: 1; }
  .check-item.checked .check-text { color: var(--text-3); text-decoration: line-through; text-decoration-color: var(--accent-emerald); }

  /* Decisions */
  .decisions { display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px; }
  .decision-item { padding: 12px 14px; border-radius: 4px; border: 1px solid var(--border); background: var(--bg-2); }
  .decision-q { font-size: 13px; font-weight: 500; color: var(--text); margin-bottom: 8px; }
  .decision-opts { display: flex; gap: 6px; flex-wrap: wrap; }
  .decision-opt {
    padding: 4px 12px; border-radius: 12px; font-size: 12px; font-weight: 500;
    border: 1px solid var(--border); cursor: pointer; color: var(--text-2);
    background: var(--bg); transition: all 0.15s;
  }
  .decision-opt:hover { border-color: var(--accent-indigo); color: var(--accent-indigo); }
  .decision-opt.selected { background: var(--accent-indigo); border-color: var(--accent-indigo); color: #fff; }

  .notes-label { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-3); margin-bottom: 6px; margin-top: 18px; }
  .notes-area {
    width: 100%; min-height: 68px; padding: 10px 12px;
    border: 1px solid var(--border); border-radius: 4px;
    background: var(--bg); color: var(--text); font-family: inherit; font-size: 13px;
    line-height: 1.5; resize: vertical; margin-bottom: 14px; transition: border-color 0.15s;
  }
  .notes-area:focus { outline: 2px solid var(--accent-indigo); outline-offset: 0; border-color: var(--accent-indigo); }
  .notes-area::placeholder { color: var(--text-3); }

  .validate-btn {
    display: inline-flex; align-items: center; gap: 8px; padding: 8px 18px;
    border-radius: 5px; border: none; cursor: pointer; font-size: 13px; font-weight: 600;
    font-family: inherit; background: var(--accent-indigo); color: #fff;
    transition: background 0.15s, transform 0.1s;
  }
  .validate-btn:hover { background: #5254cc; }
  .validate-btn:active { transform: scale(0.98); }
  .validate-btn.validated { background: var(--accent-emerald); cursor: default; }
  .validate-btn.validated:hover { background: var(--accent-emerald); }

  .empty-state {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 50vh; color: var(--text-3); text-align: center;
  }
  .empty-state .es-icon { font-size: 36px; margin-bottom: 10px; opacity: 0.35; }
  .empty-state p { font-size: 14px; }

  /* ── REF BLOCKS ── */
  .block.ref { border-color: #30363d; }
  .block.ref .block-header { background: #161b22; color: #8b949e; }
  :root[data-theme="light"] .block.ref { border-color: var(--border); }
  :root[data-theme="light"] .block.ref .block-header { background: var(--bg-2); color: var(--text-2); }
  /* ── MD BLOCK ── */
  .block.md { border-color: #30363d; }
  .block.md .block-header { background: #161b22; color: #8b949e; }
  :root[data-theme="light"] .block.md { border-color: var(--border); }
  :root[data-theme="light"] .block.md .block-header { background: var(--bg-2); color: var(--text-2); }
  @media (prefers-color-scheme: light) {
    .block.md { border-color: var(--border); }

    background: var(--bg-3); border: 1px solid var(--border); border-radius: 4px;

    font-size: 11px; color: var(--text-2); line-height: 1.7;

  .ref-block { margin-bottom: 24px; }
  .ref-title { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-3); margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }

  .st-table th { text-align: left; padding: 7px 10px; font-size: 10px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--text-3); border-bottom: 2px solid var(--border); white-space: nowrap; }
  .st-table td { padding: 7px 10px; color: var(--text-2); border-bottom: 1px solid var(--border); vertical-align: top; }

  .st-table tr:hover td { background: var(--bg-2); }

  .badge {

  .badge-new { background: rgba(99,102,241,0.12); color: var(--accent-indigo); }

  }

    .check-item.checked .check-box { background: #047857; border-color: #047857; }

  :root[data-theme="light"] .badge-ok   { color: #047857; }

  :root[data-theme="light"] .check-item.checked .check-box { background: #047857; border-color: #047857; }

  }

    outline-offset: 0;

    ] }], decisions: [] } },
  { id: 3, title: "act_cx_resources_deploy.py", subtitle: "Crear act/act_cx_resources_deploy.py — pipeline completo de 8 pasos desde cero", tag: "py", tagLabel: ".py", llm: { objetivo: "Crear <code>act/act_cx_resources_deploy.py</code> desde cero — el script que ejecuta el pipeline completo de 8 pasos. Lee <code>docs/panels/act_cx_resources_deploy.html</code> antes de escribir una línea: es la fuente de verdad. Importa desde <code>cx_client.py</code> y <code>cx_payloads.py</code> — no reimplementes lo que ya está ahí.", reglas: ['<strong>1. Inventario y diff.</strong> El Paso 1 escribe el inventario en <code>docs/data/act_cx_draft_resources_inventory_&lt;project&gt;_&lt;agent&gt;.json</code> — el nombre incluye el proyecto y el agente seleccionados, nunca una ruta fija. Sin esto, correr el pipeline para un agente y luego para otro sobrescribiría el inventario del primero, y el Paso 3 podría calcular el diff contra datos del agente equivocado sin ningún error visible. El Paso 3 lee ese mismo archivo (con el mismo project/agent de la sesión) para calcular el diff. Es un archivo generado — añade el patrón a <code>.gitignore</code>.', '<strong>2. Arquitectura en 3 capas.</strong> El pipeline se divide en <code>cx_client.py</code> (conexión), <code>cx_payloads.py</code> (adaptación) y <code>act_cx_resources_deploy.py</code> (orquestación). Los dos primeros ya existen en <code>act/utils/</code>. Dentro de <code>act_cx_resources_deploy.py</code>, organiza el código por función — una función por recurso, no un archivo por recurso. Los 8 pasos son la secuencia de la UI (definida en <code>act_cx_resources_deploy.html</code>); dentro de ese flujo, las operaciones que tocan recursos — como el diff del Paso 3 o el deploy del Paso 4 — se implementan como una función por cada uno de los 12 tipos de recurso (playbooks, examples, tools...). No hay una función por paso: cada paso llama a las funciones de recurso que le correspondan. Antes de empezar: valora si esta división te parece correcta. Si prefieres otra estructura, muéstrala y espera confirmación antes de construir. <code>cx_client.py</code> debe implementar los constraints ya validados en CLAUDE.md §3: autenticación con <code>gcloud auth print-access-token</code> (nunca <code>google.auth.default()</code>), los 3 headers obligatorios, y el polling de operaciones largas. <strong>Multi-proyecto/multi-agente:</strong> ninguna función de las 3 capas puede fijar <code>project</code> o <code>agent_id</code> como constante de módulo — cada función los recibe como parámetro explícito. <code>location</code> sigue siendo una constante fija (<code>europe-west1</code>) — eso no cambia. La implementación actual de <code>cx_client.py</code> en <code>act/utils/</code> calcula <code>project</code> y <code>agent_id</code> una sola vez al importar, leyendo <code>definitions/agent.yaml</code> — eso ya no vale para esos dos, fórmalo como parte de esta fase: quita esas dos constantes de módulo y pasa <code>project</code>/<code>agent_id</code> a <code>get_headers()</code> y a cada función de <code>api_*</code>.', '<strong>3. Dónde guardar un archivo nuevo.</strong> Si durante la construcción necesitas crear un archivo auxiliar no previsto, pregúntate primero: ¿lo importa <code>act_cx_resources_deploy.py</code>, o importa a él, en tiempo de ejecución? Si sí, va en <code>act/</code> (o en <code>act/utils/</code> si es un módulo de apoyo, como conexión o payloads) — forma parte del pipeline permanente. Si no, hay una segunda pregunta antes de mandarlo a <code>act/scaffolding/</code>: ¿es una herramienta de regresión que se va a volver a ejecutar cada vez que cambie el código que verifica (como los <code>validate_*.py</code>), o es un script de un solo uso que ya cumplió su función? Solo lo segundo va en <code>act/scaffolding/</code> — la primera va en <code>act/</code>, aunque no la importe nada. Ejemplos ya resueltos: <code>cx_client.py</code> y <code>cx_payloads.py</code> viven en <code>act/utils/</code> porque el pipeline los importa al arrancar. <code>validate_pipeline.py</code>, <code>validate_server.py</code> y <code>validate_html.py</code> viven en <code>act/</code> — nadie los importa, pero son regresión: se relanzan cada vez que se toca lo que verifican. <code>validate_api.py</code> vive en <code>act/scaffolding/</code> porque fue un script de comprobación de Sprint 1 sin ninguna relación de import y de un solo uso — una vez construido el pipeline, no se vuelve a usar.', '<strong>4. Idempotencia.</strong> Antes de subir cualquier recurso, sigue el patrón LIST → diff → PATCH/POST solo de lo que cambió. Nunca recrear un recurso que ya existe.', '<strong>5. Orden del pipeline.</strong> El orden exacto de los 8 pasos está definido en <code>act_cx_resources_deploy.html</code>. Léelo antes de escribir una sola línea de código, e implementa ese orden tal cual.', '<strong>6. Polling de operaciones largas.</strong> <code>POST /versions</code> responde 200 OK al instante, pero la versión sigue procesándose en segundo plano. Hay que consultar <code>GET /operations/{id}</code> en bucle hasta que la respuesta diga <code>done: true</code> — máximo 60 intentos con 5 segundos de espera entre cada uno (timeout total: 5 minutos, valor provisional sin medir contra un caso real — registra el tiempo real que tarda durante el Nivel 3 de la Fase 4 y avisa si hace falta ajustarlo). Si no llega <code>done: true</code> en ese tiempo, lanzar una excepción con el último estado de la operación. Nunca uses un <code>sleep()</code> fijo — no sabes cuánto va a tardar.', '<strong>7. displayName obligatorio.</strong> Si se omite en <code>POST /versions</code>, la API devuelve 200 OK pero la operación falla en silencio con <code>code: 3</code>. Inclúyelo siempre.', '<strong>8. UI y specs deben coincidir.</strong> Para cada paso, lee <code>act_cx_resources_deploy.html</code> completo: el diseño de interfaz y las especificaciones técnicas. Si encuentras una discrepancia entre ambas, para y pregunta — no decidas tú cuál tiene prioridad.', '<strong>9. Pages: fuera de alcance por ahora.</strong> CLAUDE.md dice que el bug de Full Update en europe-west1 afecta solo a Playbooks. El HTML de referencia dice que también afecta a Pages — nunca verificado contra la API real, y hoy no importa: <code>definitions/pages/</code> está vacío porque Petal usa el enfoque generativo (Playbooks), que sustituye la navegación clásica en vez de complementarla. No construyas nada para Pages ahora. Si en el futuro cambia la arquitectura, verifica el bug contra la API real antes de implementar <code>push_pages</code> y actualiza CLAUDE.md §3.8 con el resultado.', '<strong>10. Descubrimiento de proyecto y agente.</strong> El panel necesita 2 funciones nuevas que hoy no existen en ningún módulo: <code>list_gcp_projects()</code> — lista los proyectos GCP visibles con las credenciales actuales, vía la API de Cloud Resource Manager (<code>cloudresourcemanager.googleapis.com</code>, distinta de la API de Dialogflow CX, con su propio permiso IAM <code>resourcemanager.projects.list</code>) — y <code>list_cx_agents(project)</code> — lista los agentes CX de un proyecto, usando la constante fija <code>LOCATION</code> (<code>europe-west1</code>) internamente, vía la API de CX normal (<code>GET .../locations/europe-west1/agents</code>). Si <code>list_gcp_projects()</code> falla por falta del permiso IAM (403 de Resource Manager — una cuenta puede tener acceso a Dialogflow CX sin tener <code>resourcemanager.projects.list</code>), el endpoint <code>GET /projects</code> lo comunica con un error claro, y el panel ofrece una alternativa: un campo de texto para escribir el ID del proyecto a mano, en vez de dejar el selector vacío sin explicación.', '<strong>11. Manejo de agentes sin definiciones locales.</strong> Si el proyecto/agente seleccionado no es Petal, <code>definitions/</code> no tiene contenido para él — el diff del Paso 3 debe salir vacío (o con un aviso claro de "sin definiciones locales para este agente"), nunca fallar ni asumir por error las definiciones de Petal.', '<strong>12. CLI sin agente por defecto.</strong> El estándar de la Fase 1 exige que <code>act_cx_resources_deploy.py</code> funcione completo por CLI, sin <code>server.py</code>. Como ya no hay un agente fijo, la CLI necesita flags explícitos: <code>--project</code>, <code>--agent</code> (obligatorios, sin valor por defecto — si falta alguno, el script termina con un mensaje claro, no intenta adivinar). <code>--location</code> no hace falta — la región sigue fija en <code>europe-west1</code>.', '<strong>13. Tests unitarios de cx_payloads.py.</strong> El estándar de la Fase 1 ("Pruebas aisladas por pieza") pide tests unitarios de las funciones puras de <code>cx_payloads.py</code> — <code>build_full_update_body</code> — sin red, en <code>act/tests/test_cx_payloads.py</code>. Es parte del alcance de esta fase: constrúyelos aquí, no los dejes para ninguna fase posterior.'], leer: ['act/utils/cx_client.py', 'act/utils/cx_payloads.py', 'docs/panels/act_cx_resources_deploy.html — fuente de verdad del pipeline. Lee los 8 pasos completos: para cada paso, lee la columna SPECS (comportamiento técnico exacto, criterios de validación, casos de error — los TECH ▼ desplegables tienen las llamadas API concretas) y la columna UI (estados de la interfaz que el script debe producir en cada momento). No basta con el orden — cada paso tiene criterios de validación específicos que el script debe respetar.', 'definitions/ — YAMLs de los 12 tipos de recursos que se despliegan a CX: playbooks/, examples/, tools/, intents/, entity_types/, webhooks/, generators/, flows/, pages/, config/ (agent config), environments/, versions/. Son la fuente de verdad local contra la que se hace el diff en el Paso 3.'], outputs: [{ path: 'act/act_cx_resources_deploy.py', desc: 'Orquestador — pipeline completo de 8 pasos' }, { path: 'act/tests/test_cx_payloads.py', desc: 'Tests unitarios de build_full_update_body, sin red (Regla 13)' }], pasos: [] }, val: { grupos: [
      { title: "Construcción · Automático (LLM)", items: [
        { criterio: "El script se importa sin errores (python -c 'import act_cx_resources_deploy')", porQue: "Confirma que la sintaxis y los imports son correctos antes de pasar a la Fase 4, donde se prueba el comportamiento real." },
        { criterio: "Las 8 funciones del pipeline existen con la firma esperada (una por paso)", porQue: "La Fase 4 (validate_pipeline.py) y la Fase 5 (server.py) importan estas funciones directamente — si falta una o cambia su firma, ambas fases fallan silenciosamente al construirse." },
        { criterio: "cx_client.py no tiene ninguna constante de módulo PROJECT ni AGENT_ID — get_headers() y las funciones api_* reciben project/agent_id como parámetro", porQue: "Es la propiedad que hace posible el multi-proyecto/multi-agente — si sobrevive una constante fija, todo lo demás (selectores, descubrimiento) queda operando sobre un agente que en realidad no cambia." },
        { criterio: "python -m pytest act/tests/test_cx_payloads.py pasa en verde sin conexión a red", porQue: "Es la comprobación directa del estándar 'pruebas aisladas por pieza' de la Fase 1 — si necesita red para pasar, no está probando la función pura, está probando la API." }
      ]}
    ], decisions: [] } },
  { id: 4, title: "validate_pipeline", subtitle: "Smoke test del pipeline de despliegue en 3 niveles", tag: "py", tagLabel: ".py", llm: { objetivo: "Crear <code>act/validate_pipeline.py</code> — smoke test del pipeline de despliegue en 3 niveles (ver reglas). Valida que <code>act_cx_resources_deploy.py</code> (Fase 3) funciona correctamente por sí solo, antes de envolverlo en el servidor de la Fase 5.", reglas: [
        'Nivel 1 — Read-only (automático): verificar auth válido + sin 401/403, conectividad con CX (GET al agente responde), LIST completa para los 12 tipos sin errores, JSON de inventario con estructura correcta (totals == len para cada tipo), idempotencia del diff (definitions/ sin cambios → diff vacío), abortar ante LIST parcial o rate limit persistente. El script ejecuta estos checks y reporta PASS/FAIL por cada uno. Como <code>cx_client.py</code> ya no fija project/agent como constante (Fase 3 — location sigue fija en europe-west1, eso no cambia), este smoke test pasa explícitamente el proyecto y el agente de Petal (el agente de referencia) a cada llamada — nunca depende de un valor por defecto que ya no existe.',
        'Nivel 2 — Dry-run (automático): <code>--dry-run</code> completa sin errores en los 8 pasos (exit 0), diff detecta exactamente los cambios introducidos en definitions/, push a staging sin conflictos (única acción real de este nivel — un push a git, reversible, no una simulación), orden de deploy correcto en el plan generado. El script ejecuta estos checks y reporta PASS/FAIL por cada uno.',
        'Nivel 3 — Write real (checklist manual por ahora): recorre los 8 pasos del pipeline provocando deliberadamente los casos límite de cada uno (fallo parcial, rollback, conflicto de merge) y compara el resultado contra lo esperado. El script imprime el checklist con instrucciones para que Jero los verifique manualmente — no los automatiza.'
      ], leer: ['act/act_cx_resources_deploy.py — construido en Fase 3. Es el artefacto que validate_pipeline.py va a verificar.'], outputs: [], pasos: [] }, val: { grupos: [
      { title: "Nivel 1 — Read-only · Automático (LLM)", items: [
        { criterio: "Auth válido — sin errores 401/403: PASS", porQue: "Sin esta verificación explícita, un token expirado fallaría a mitad de las 12 llamadas LIST, dejando un inventario parcial sin que quede claro por qué." },
        { criterio: "Conectividad con CX — GET al agente responde: PASS", porQue: "Confirma que el pre-flight check (subestep 1.1 del Paso 1) realmente detecta problemas de red o de agente antes de lanzar el resto del pipeline." },
        { criterio: "LIST completa para los 12 tipos sin errores: PASS", porQue: "El Paso 3 necesita un inventario completo para calcular el diff correctamente — un tipo ausente produce operaciones incorrectas sobre recursos existentes." },
        { criterio: "JSON de inventario con estructura correcta — totals == len por tipo: PASS", porQue: "Si el conteo declarado no coincide con los elementos reales, algo se perdió silenciosamente durante la paginación de la API." },
        { criterio: "Idempotencia del diff — definitions/ sin cambios → diff vacío: PASS", porQue: "Es la prueba de que el diff realmente compara y no genera falsos positivos — sin cambios reales, no debería proponer ninguna operación." },
        { criterio: "Si cualquier LIST falla → el script aborta inmediatamente, no continúa con datos parciales: PASS", porQue: "Datos parciales dan un diff corrupto en el Paso 3: recursos existentes aparecerían como nuevos y se duplicarían." },
        { criterio: "429 (rate limit) → reintenta con backoff exponencial (máx. 3 intentos); si persiste, aborta: PASS", porQue: "Rate limit es transitorio — el backoff lo resuelve en la mayoría de casos sin intervención humana." },
        { criterio: "401 en cualquier paso del pipeline (no solo el Paso 1) → refresca el token con gcloud auth print-access-token y reintenta la misma llamada una vez antes de abortar: PASS", porQue: "Los Pasos 6-7 son gates manuales que pueden durar horas — tiempo de sobra para que expire el token obtenido al inicio. Sin este refresco, un token vencido a mitad del Paso 8 puede dejar el merge a main hecho pero el PATCH a producción fallido, desincronizando git y CX." },
        { criterio: "Ejecutar sin --project o sin --agent → el script termina con un mensaje claro, no ejecuta con ningún valor por defecto: PASS", porQue: "Es la prueba directa de que ya no existe un agente fijo — si el script arrancara igual sin estos flags, significaría que sigue habiendo una constante oculta en algún sitio." }
      ]},
      { title: "Nivel 2 — Dry-run · Automático (LLM)", items: [
        { criterio: "--dry-run completa sin errores en los 8 pasos: exit 0", porQue: "Confirma que el script arranca, parsea la configuración y construye el plan completo sin tocar CX — la base antes de confiar en cualquier ejecución real." },
        { criterio: "Diff detecta exactamente los cambios introducidos en definitions/", porQue: "Si el diff detecta de más o de menos, el Paso 4 aplicaría operaciones sobre recursos equivocados." },
        { criterio: "Diff completado para los 12 tipos de recursos (cobertura, no solo precisión)", porQue: "Un diff parcial deja recursos sin comparar — cambios en tipos no procesados no llegarían al Paso 4." },
        { criterio: "POST/PATCH/DELETE mutuamente excluyentes por recurso", porQue: "Un recurso no puede ser nuevo y modificado a la vez — si el clasificador produce los dos, el deploy ejecuta operaciones contradictorias." },
        { criterio: "Tabla del diff coherente con el inventario del Paso 1", porQue: "El inventario del Paso 1 es la foto de CX — si el diff no parte de ella, opera sobre datos que ya no representan el estado actual." },
        { criterio: "Si sin cambios → el pipeline termina limpiamente, no continúa al Paso 4", porQue: "No hay operaciones que ejecutar — continuar con una lista vacía hace el deploy en vacío y crea un snapshot innecesario." },
        { criterio: "Orden de deploy correcto en el plan generado por --dry-run", porQue: "El --dry-run debe previsualizar el mismo orden que se ejecutaría de verdad — snapshot antes de producción, QA antes del gate final." },
        { criterio: "Push a GitHub staging exitoso — sin errores de red ni de permisos", porQue: "Si el push falla, el Paso 3 compara contra código desactualizado — el diff no refleja los cambios reales." },
        { criterio: "origin/staging al día con staging local tras el push", porQue: "El Paso 3 lee de GitHub staging — si hay commits pendientes, el diff tiene desfase respecto a lo que el usuario quiere desplegar." },
        { criterio: "Si hay conflicto en el push → abortar, no continuar", porQue: "Un conflicto indica que el remoto tiene commits que el local no tiene — continuar sobrescribiría trabajo." },
        { criterio: "Si origin/staging ya está al día (0 commits pendientes) → el paso completa sin error, no bloquea el pipeline", porQue: "El pipeline puede ejecutarse sin cambios en Git cuando solo cambia algo en CX — el paso no debe ser un bloqueante en ese caso." },
        { criterio: "Exit 0 en éxito, exit 1 con mensaje específico en fallo", porQue: "El orquestador tiene que comunicar claramente si algo falló y dónde — sin esto el pipeline no puede detectar errores automáticamente." },
        { criterio: "Los 8 pasos aparecen en el orden exacto definido en act_cx_resources_deploy.html", porQue: "El orden no es opcional — snapshot antes de push a producción, QA antes del gate final. Un orden incorrecto puede desplegar sin snapshot o sin QA." },
        { criterio: "Cada paso supera sus criterios de validación individuales antes de avanzar al siguiente", porQue: "Los criterios globales no son suficientes — cada paso tiene condiciones específicas que el script debe respetar antes de continuar." }
      ]},
      { title: "Nivel 3 — Smoke test base · Manual (Jero)", items: [
        { criterio: "Antes de pasar este Nivel 3 a Jero para su verificación final, Opus ejecuta él mismo el recorrido completo de los 8 pasos con datos de prueba y documenta el resultado de cada punto.", porQue: "Jero no debería ser quien descubre por primera vez que algo falla — Opus verifica primero, Jero confirma después." },
        { criterio: "Lanza un deploy que dispare un POST /versions (Paso 5) con el campo de nombre vacío en el panel. <strong>Esperado:</strong> el LRO termina en done:true y la versión creada tiene un displayName autogenerado — nunca un error code:3.", porQue: "Bug silencioso del backend: sin displayName la API devuelve 200 OK pero la operación falla internamente con code:3 sin mensaje visible. Esta es la única forma de confirmar en persona que el workaround se activó." },
        { criterio: "Ejecuta un PATCH /environments/staging apuntando a una versión real. <strong>Esperado:</strong> el comando devuelve éxito y GET /environments/staging confirma que el entorno quedó apuntando a esa versión.", porQue: "Confirma que la promoción de versión a un entorno funciona de extremo a extremo, no solo que la API acepta la llamada." }
      ]},
      { title: "Nivel 3 · Paso 4 — Confirmar deploy · Manual (Jero)", items: [
        { criterio: "Ejecuta un deploy con todos los recursos sincronizados correctamente. <strong>Esperado:</strong> el panel muestra el banner verde de éxito y el botón 'Continuar →' se habilita.", porQue: "El pipeline solo puede avanzar al Paso 5 si todos los recursos se aplicaron — un OK parcial no es un OK." },
        { criterio: "Provoca que un recurso falle durante el deploy (por ejemplo, una referencia rota en un YAML). <strong>Esperado:</strong> el panel muestra un resumen OK/ERROR/no-intentado por recurso, y aparecen las opciones 'Reintentar fallidos' y 'Revertir draft'.", porQue: "Un fallo en un recurso deja los siguientes como 'no intentados' — el resumen diferencia lo que completó de lo que quedó sin ejecutar." },
        { criterio: "Tras un deploy parcial, pulsa 'Reintentar fallidos'. <strong>Esperado:</strong> solo se reintentan el recurso fallido y los marcados 'no intentado' — los que ya estaban OK no cambian de timestamp ni de log.", porQue: "Reintentar los que ya están en CX crea duplicados o errores — solo los pendientes necesitan reintento." },
        { criterio: "Tras un deploy parcial, pulsa 'Revertir draft' en vez de reintentar. <strong>Esperado:</strong> el draft del agente vuelve exactamente al estado que tenía antes de iniciar este deploy (verificable comparando con el inventario del Paso 1).", porQue: "Si el deploy parcial deja CX en estado inconsistente, el rollback del draft es la única salida limpia." }
      ]},
      { title: "Nivel 3 · Paso 5 — Snapshot del agente · Manual (Jero)", items: [
        { criterio: "Lanza la creación de un snapshot y observa el log mientras se ejecuta. <strong>Esperado:</strong> el panel no reporta éxito hasta que el LRO devuelve done:true — nunca marca 'completado' mientras la operation sigue en curso.", porQue: "POST /versions responde 200 OK al instante pero la versión sigue procesando. Sin polling, el Paso 6 hace QA sobre una versión incompleta." },
        { criterio: "Con el entorno en su límite de 5 versiones, lanza un snapshot nuevo. <strong>Esperado:</strong> la versión más antigua desaparece de GET /versions y el snapshot nuevo se crea sin error de límite.", porQue: "CX tiene un límite de 5 versiones por entorno — el script no debe bloquearse en ese límite, es comportamiento esperado de la API." },
        { criterio: "Tras crear un snapshot, avanza hasta el Paso 8. <strong>Esperado:</strong> el nombre del snapshot creado en el Paso 5 aparece visible y correcto en el contexto de los Pasos 6, 7 y 8 — nunca vacío ni genérico.", porQue: "Los tres pasos posteriores necesitan el nombre para mostrar contexto al usuario y para ejecutar el rollback si es necesario." }
      ]},
      { title: "Nivel 3 · Paso 6 — Validación de tests · Manual (Jero)", items: [
        { criterio: "Marca 'Tests superados' y observa la red mientras el panel avanza al Paso 7. <strong>Esperado:</strong> cero llamadas nuevas a la API de CX — este paso solo decide, no ejecuta.", porQue: "Este paso solo toma decisiones — no ejecuta operaciones CX. Cualquier llamada en este estado es un error de implementación." },
        { criterio: "Elige 'Rollback' y confírmalo. <strong>Esperado:</strong> GET /environments/staging muestra la versión inmediatamente anterior, y el draft queda igual que esa versión — no como el snapshot rechazado.", porQue: "El rollback debe revertir dos cosas a la vez: el entorno staging y el draft — si solo revierte uno, quedan desincronizados." },
        { criterio: "Abre el diálogo de rollback y cancélalo sin confirmar. <strong>Esperado:</strong> ni staging ni el draft cambian — todo queda exactamente como estaba antes de abrir el diálogo.", porQue: "Cancelar el rollback es 'pausar, no actuar' — el pipeline queda en espera sin tocar CX." },
        { criterio: "Repite las tres pruebas anteriores de este paso observando producción. <strong>Esperado:</strong> en ninguna de las tres cambia nada en producción — solo staging y draft se ven afectados.", porQue: "Este paso opera exclusivamente sobre staging y draft — producción es intocable hasta el Paso 8." }
      ]},
      { title: "Nivel 3 · Paso 7 — Gate QA staging · Manual (Jero)", items: [
        { criterio: "Marca 'Validado' y observa la red mientras el panel avanza al Paso 8. <strong>Esperado:</strong> cero llamadas nuevas a la API — la validación es una decisión humana, no una operación.", porQue: "La validación es una decisión humana, no una operación CX — el paso no debe ejecutar nada al avanzar." },
        { criterio: "Elige 'Rollback'. <strong>Esperado:</strong> GET /environments/staging confirma el PATCH a la versión anterior, y el draft queda restaurado desde esa misma versión — misma secuencia que en el Paso 6.", porQue: "Misma secuencia que el Paso 6 — staging y draft deben revertirse juntos para mantener consistencia." },
        { criterio: "Repite el rollback de este paso observando producción. <strong>Esperado:</strong> producción no cambia en absoluto.", porQue: "Producción solo cambia en el Paso 8 — cualquier PATCH a producción aquí sería un error crítico." },
        { criterio: "Tras confirmar un rollback, intenta continuar el pipeline. <strong>Esperado:</strong> no hay camino para 'continuar' — el pipeline queda cerrado, solo puedes iniciar un deploy nuevo desde cero.", porQue: "Un rollback es una decisión definitiva: el usuario decidió que el snapshot no es válido. Pausar daría una salida falsa de 'continuar'." }
      ]},
      { title: "Nivel 3 · Paso 8 — Aprobar producción · Manual (Jero)", items: [

  { id: 5, title: "server.py", subtitle: "Servidor Flask local — conecta el panel HTML con el pipeline Python", tag: "py", tagLabel: ".py", llm: { objetivo: "Crear <code>act/server.py</code> — servidor Flask que expone los 8 pasos del pipeline como endpoints HTTP. El panel HTML llama a estos endpoints en lugar de simular localmente. Importa las funciones de <code>act_cx_resources_deploy.py</code> — no reimplementa lógica.", reglas: [
      'Exponer un endpoint por paso: <code>POST /step/&lt;n&gt;</code> donde n es 1–8. El panel HTML llama a cada endpoint al pulsar el botón de ese paso. <strong>Todos los endpoints reciben <code>{project, agent}</code> en el body — obligatorios en cada llamada, porque el servidor no guarda esa selección entre peticiones (ver regla de estado más abajo). La región no viaja en el body — sigue fija en <code>europe-west1</code>, la resuelve el servidor internamente.</strong> Si falta <code>project</code> o <code>agent</code>, el endpoint responde con un error claro (400), nunca ejecuta con un valor por defecto. Excepción adicional: <code>POST /step/5</code> (Snapshot del agente) también acepta <code>name</code> opcional con el nombre de snapshot escrito por el usuario; si se omite o va vacío, el servidor genera un nombre automático.',
      'Dos endpoints nuevos de descubrimiento, sin relación con los 8 pasos: <code>GET /projects</code> — devuelve la lista de proyectos GCP visibles (llama a <code>list_gcp_projects()</code> de <code>cx_client.py</code>) — y <code>GET /projects/&lt;project&gt;/agents</code> — devuelve los agentes CX de ese proyecto en <code>europe-west1</code> (llama a <code>list_cx_agents(project)</code>). El panel los usa para rellenar los 2 selectores antes de habilitar "Iniciar inventario".',
      'Importar las funciones de <code>act_cx_resources_deploy.py</code> — no reimplementar lógica. El servidor es un adaptador HTTP, no un segundo pipeline.',
      'CORS habilitado para que el HTML servido desde <code>file://</code> pueda llamar al servidor. Usar <code>flask-cors</code> o cabeceras manuales — sin CORS, el navegador bloquea todas las llamadas.',
      'Puerto: 5000 por defecto, configurable via variable de entorno <code>PORT</code>.',
      'Los endpoints devuelven JSON con estructura <code>{status, log, data}</code> — el panel HTML espera ese formato exacto para actualizar la UI.',
      'El servidor NO gestiona estado entre pasos — cada llamada es independiente. El estado del pipeline lo mantiene el panel HTML.',
      'Arranque: <code>python act/server.py</code>. Se puede automatizar con un script <code>start.sh</code> en la raíz del repo que active el entorno virtual y arranque el servidor. No tiene coste — corre en local en el Mac.',
      'Esta fase construye el servidor de forma aislada — la conexión real del panel HTML a estos endpoints es trabajo de la Fase 7. Aquí basta con que el servidor responda correctamente a peticiones directas (curl, requests).',
      'El servidor debe rechazar una nueva petición a cualquier endpoint <code>/step/&lt;n&gt;</code> si ya hay una en curso — sea cual sea la pestaña o el navegador de origen, **y sea cual sea el proyecto/agente de esa petición: el lock es global, no por agente.** Devolver un error claro (por ejemplo, 409 "ya hay una operación en curso") en vez de procesar las dos a la vez, aunque sean sobre agentes distintos — es la opción más simple y evita bugs de escritura concurrente; no hay necesidad real de permitir dos operaciones simultáneas en este servidor local de un solo uso. Esto es distinto de gestionar el estado del pipeline (qué paso está activo, que sigue siendo trabajo del panel) — es solo un lock simple para no ejecutar dos operaciones a la vez.'
    ], leer: [
      'act/act_cx_resources_deploy.py — importar las funciones de cada paso. Entender la firma de cada función (parámetros, retorno) antes de escribir los endpoints.',

    ], outputs: [{ path: 'act/server.py', desc: 'Servidor Flask — 8 endpoints + CORS + arranque' }], pasos: [] }, val: { grupos: [

        { criterio: "Los 8 endpoints existen y delegan en una función de <code>act_cx_resources_deploy.py</code> — ninguno reimplementa lógica dentro del propio endpoint", porQue: "Es la única propiedad estructural que Fase 6 no puede verificar por fuera (necesita leer el código, no solo golpear el endpoint) — el resto de la validación funcional vive en Fase 6." },
        { criterio: "GET /projects y GET /projects/<project>/agents existen y delegan en list_gcp_projects()/list_cx_agents() de cx_client.py", porQue: "Sin esto, los 2 selectores del panel (Fase 7) no tienen nada real que llamar — quedarían con listas vacías o hardcodeadas." },
        { criterio: "Los 8 endpoints de paso devuelven 400 si falta project o agent en el body — no ejecutan con un valor por defecto", porQue: "Es la comprobación de que el servidor respeta la regla de no-estado: cada llamada tiene que traer su propio destino, o se rechaza." }
      ]}

  { id: 6, title: "validate_server", subtitle: "Smoke test del servidor Flask — valida los 8 endpoints antes de conectar el HTML", tag: "py", tagLabel: ".py", llm: { objetivo: "Crear <code>act/validate_server.py</code> — smoke test automático que arranca <code>server.py</code>, golpea los 8 endpoints con peticiones HTTP reales y verifica que cada uno responde con el formato correcto. Esta fase existe porque <code>server.py</code> es una capa nueva entre el HTML y el pipeline — puede fallar por razones que <code>validate_pipeline.py</code> (Fase 4) no cubre: puerto ocupado, CORS mal configurado, JSON mal formado, un endpoint que no llama a la función correcta.", reglas: [

      'Verificar que la cabecera <code>Access-Control-Allow-Origin</code> está presente en al menos una respuesta — si falta, el HTML en <code>file://</code> no podrá llamar al servidor y el fallo sería invisible hasta abrir el navegador.',
      'Verificar que cada endpoint llama realmente a la función correspondiente de <code>act_cx_resources_deploy.py</code> y no devuelve datos hardcodeados. Estado conocido = servidor arrancado, body con <code>{project, agent}</code> del agente Petal de referencia (obligatorios en cada llamada — ver Fase 5). Invoca la función correspondiente directamente en Python, con esos mismos valores, y compara su resultado contra el <code>data</code> que devuelve el endpoint — deben coincidir. Probar también qué pasa si falta <code>project</code> o <code>agent</code>: debe responder 400 con un mensaje claro, nunca ejecutar con un valor por defecto. Para <code>POST /step/5</code>, probar además tanto con <code>name</code> explícito como sin él, para confirmar que la autogeneración del nombre funciona. Mismo enfoque de Nivel 1 (read-only) de <code>validate_pipeline.py</code>.',
      'Verificar los 2 endpoints de descubrimiento (<code>GET /projects</code>, <code>GET /projects/&lt;project&gt;/agents</code>): código 200, JSON válido, y que el proyecto/agente de Petal aparece en la lista devuelta — confirma que llaman de verdad a <code>list_gcp_projects()</code>/<code>list_cx_agents()</code> y no a una lista hardcodeada.',
      'GET /projects responde con un error claro (no un 500 crudo) si el permiso IAM de Resource Manager falta — no hace falta simular el fallo real, basta con revisar en el código que ese caso está capturado explícitamente.',
      'Separar los checks que no requieren CX (puerto, CORS, formato JSON) de los que sí llaman a CX de verdad — misma distinción Nivel 1 vs Nivel 3 que ya usa <code>validate_pipeline.py</code>.',
      'Exit 0 si los 8 endpoints de paso y los 2 de descubrimiento pasan, exit 1 con el detalle exacto de qué endpoint falló y por qué.'
    ], leer: [
      'act/server.py — Fase 5. Entender los 8 endpoints antes de escribir los tests.',
      'act/validate_pipeline.py — Fase 4. Reutilizar el mismo patrón de niveles (estructura vs. conexión real) en lugar de inventar uno nuevo.'
    ], outputs: [{ path: 'act/validate_server.py', desc: 'Smoke test del servidor — arranca, prueba 8 endpoints, cierra' }], pasos: [] }, val: { grupos: [

        { criterio: "Si el puerto 5000 ya está ocupado al arrancar, el script falla con un mensaje claro en vez de colgarse", porQue: "Un servidor previo sin cerrar es el fallo más común en este tipo de test — el mensaje claro ahorra una depuración a ciegas." }

        { criterio: "La cabecera Access-Control-Allow-Origin está presente", porQue: "Sin CORS, el navegador bloquea la llamada desde file:// silenciosamente — el fallo solo se ve abriendo la consola del navegador, no en el log del servidor." },
        { criterio: "GET /projects y GET /projects/<project>/agents devuelven 200 y JSON válido, incluyendo el proyecto/agente de Petal en la lista", porQue: "Confirma que los 2 endpoints de descubrimiento están conectados a la API real, no a una lista vacía o de prueba." },
        { criterio: "Una petición a cualquier /step/<n> sin project o sin agent en el body devuelve 400 con un mensaje claro, nunca 200 con un resultado", porQue: "Es la prueba de que el servidor no rellena valores por defecto — si lo hiciera, un fallo de esta prueba sería indistinguible de un éxito." }

      { title: "Conexión real con el pipeline (Pasos 1-3, solo lectura) · Automático (LLM)", items: [

const KEY = 'act_playbook_v5';
function loadState() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } }
function saveState(s) { localStorage.setItem(KEY, JSON.stringify(s)); }
function getPS(s, id) { return s[id] || { status: 'pending', notes: '', checked: [], decisions: {} }; }

let currentPhaseId = null;
let state = loadState();

function computeStatus(id) {
  const ps = getPS(state, id);
  if (ps.status === 'done' || ps.status === 'continued') return 'done';
  if ((ps.checked || []).some(Boolean)) return 'active-s';
  return 'pending';
}

function updateProgress() {
  const trackable = PHASES;
  const done = trackable.filter(p => ['done','continued'].includes((state[p.id] || {}).status)).length;
  document.getElementById('progressFill').style.width = Math.round(done / trackable.length * 100) + '%';
  document.getElementById('progressLabel').textContent = `${done} / ${trackable.length} fases`;
  const bar = document.querySelector('.topbar-progress-bar');
  if (bar) { bar.setAttribute('aria-valuenow', done); bar.setAttribute('aria-valuemax', trackable.length); }
}

function renderTabs() {
  const nav = document.getElementById('phaseTabs');
  nav.innerHTML = '';
  PHASES.forEach(p => {
    const status = computeStatus(p.id);
    const isActive = p.id === currentPhaseId;
    const tab = document.createElement('button');
    tab.setAttribute('role', 'tab');
    tab.setAttribute('aria-selected', isActive ? 'true' : 'false');
    tab.setAttribute('aria-controls', 'contentInner');
    tab.className = 'phase-tab' + (isActive ? ' active' : '') + (status === 'done' ? ' done-tab' : '') + (p.discarded ? ' discarded-tab' : '');
    const isGoal = p.special === 'goal';
    const isFileTyped = p.tagLabel.startsWith('.');
    const semantic = p.title.startsWith('validate_') ? 'Validate' : 'Build';
    const primaryTagHtml = (isFileTyped && !p.discarded)
      ? `<span class="tab-tag tag-${semantic.toLowerCase()}" aria-hidden="true">${semantic}</span>`
      : `<span class="tab-tag ${p.discarded ? 'tag-discarded' : 'tag-'+p.tag}" aria-hidden="true">${p.discarded ? 'Descartada' : p.tagLabel}</span>`;
    const fileTypeBadgeHtml = (isFileTyped && !p.discarded)
      ? `<span class="tab-filetype" aria-hidden="true">${p.tagLabel}</span>` : '';
    tab.setAttribute('aria-label', p.special === 'goal' ? `Objetivo del proyecto` : `Fase ${p.id}: ${semantic} · ${p.title} — estado: ${status === 'done' ? 'completada' : status === 'active-s' ? 'en progreso' : 'pendiente'}`);
    tab.innerHTML = `
      <div class="tab-top">
        <span class="tab-num" aria-hidden="true">${p.id}</span>
        ${primaryTagHtml}
      </div>
      <div class="tab-name">${p.title}</div>
      ${fileTypeBadgeHtml}`;
    tab.addEventListener('click', () => loadPhase(p.id));
    nav.appendChild(tab);
  });
  updateProgress();
}

function toggleBlock(id) {
  const body = document.getElementById('bb-' + id);
  const hdr = document.getElementById('bh-' + id);
  if (!body) return;
  const hidden = body.classList.toggle('hidden');
  hdr.classList.toggle('collapsed', hidden);
  hdr.setAttribute('aria-expanded', hidden ? 'false' : 'true');
}

function groupCollapseWrap(idPrefix, idx, title, bodyHtml) {
  const id = idPrefix + '-g' + idx;
  const startCollapsed = !/Manual/i.test(title || '');
  return `<div class="checklist-group">
    <button class="checklist-group-header${startCollapsed ? ' collapsed' : ''}" id="bh-${id}"
            onclick="toggleBlock('${id}')" aria-expanded="${startCollapsed ? 'false' : 'true'}" aria-controls="bb-${id}">
      <span>${title}</span><span class="cg-toggle" aria-hidden="true">▾</span>
    </button>
    <div class="cg-body${startCollapsed ? ' hidden' : ''}" id="bb-${id}">${bodyHtml}</div>
  </div>`;
}

function makeBlock(type, icon, label, id, bodyHtml, startOpen) {
  return `<div class="block ${type}">
    <button class="block-header${startOpen ? '' : ' collapsed'}" id="bh-${id}"
            onclick="toggleBlock('${id}')"
            aria-expanded="${startOpen ? 'true' : 'false'}"
            aria-controls="bb-${id}">
      <span aria-hidden="true">${icon}</span><span>${label}</span>
      <span class="bh-toggle" aria-hidden="true">▾</span>
    </button>
    <div class="block-body${startOpen ? '' : ' hidden'}" id="bb-${id}" role="region" aria-labelledby="bh-${id}">${bodyHtml}</div>
  </div>`;
}

function renderList(items, ordered) {
  return `<ul class="llm-list${ordered ? ' steps' : ''}">${items.map(i => `<li>${i}</li>`).join('')}</ul>`;

                   onclick="toggleCheck(${p.id},${i},this)">
        <div class="check-box" aria-hidden="true">${checked?'✓':''}</div>
        <div class="check-text">${label}</div></div>`;
    }).join('');
    const checklistHtml = `<div class="checklist" role="group">${items}</div>`;
    return g.title
      ? groupCollapseWrap('proc'+p.id, idx, g.title, checklistHtml)
      : `<div class="checklist-group">${checklistHtml}</div>`;
  }).join('');

  const allChecked = valItems.length > 0 && valItems.every((_,i) => (ps.checked||[])[i] === true);
  const continuarDisabled = !allChecked && !isContinued ? ' disabled' : '';

  const procesoHtml = `
    <p style="font-size:13px;color:var(--text-2);margin-bottom:12px;line-height:1.6">
      <strong>Instrucción:</strong> actualiza este log mientras ejecutas — pega lo que va pasando, errores y cómo los resolviste. Cuando termines, marca los criterios de verificación.
    </p>
    <label class="notes-label" for="procesoArea-${p.id}">Log de ejecución — Opus</label>
    <textarea class="notes-area" id="procesoArea-${p.id}" placeholder="Pega aquí lo que va ocurriendo: comandos ejecutados, archivos creados, errores encontrados..." style="min-height:160px;font-family:monospace;font-size:12px">${ps.proceso||''}</textarea>
    <div style="margin-top:16px">${valChecksHtml}</div>
    <div style="margin-top:16px">
      <button class="validate-btn${isContinued?' validated':''}"${continuarDisabled} id="continuarBtn-${p.id}" onclick="continuarPhase(${p.id})"
              aria-label="${isContinued?'Fase completada':'Continuar →'}">
        <span aria-hidden="true">${isContinued?'✓':'→'}</span> ${isContinued?'Fase completada':'Continuar →'}</button>
    </div>`;

  const statusTableBlock = p.llm.leyenda
    ? makeBlock('ref','📊','Estado actual de componentes del repo','ref-status-'+p.id,
        (p.llm.targetTree ? `<div class="tree-view" style="margin-bottom:16px">${p.llm.targetTree}</div>` : '')
        + `<p style="font-size:12px;color:var(--text-2);margin-bottom:12px">${p.llm.leyenda}</p>`, true)
    : '';

  const criteriosBody = renderCriteriosTablas();
  const criteriosBlock = criteriosBody
    ? makeBlock('criterios','✅','Criterios de validación','criterios'+p.id, criteriosBody, true)
    : '';

  const procesoBlock = p.val.grupos && p.val.grupos.length
    ? makeBlock('proceso','⚙️','Proceso — ejecución y verificación','proceso'+p.id,procesoHtml,true)
    : '';

  return makeBlock('llm','🤖','Para el LLM — instrucciones de construcción','llm'+p.id,llmHtml,true)
    + statusTableBlock
    + criteriosBlock
    + makeBlock('val','✋','Gate de Jero — comprensión y plan','val'+p.id,valHtml,true)
    + procesoBlock;
}

function loadPhase(id) {
  currentPhaseId = id;
  const p = PHASES.find(x => x.id === id);
  const ps = getPS(state, id);
  const inner = document.getElementById('contentInner');

  let bodyHtml;
  if (p.special === 'goal') {
    bodyHtml = renderGoalPhase(p, ps);
  } else {
    bodyHtml = renderGenericPhase(p, ps);
  }

  const eyebrow = p.special === 'goal'
    ? `Fase ${p.id} — Objetivo`
    : `Fase ${p.id} de ${PHASES.filter(x => x.special !== 'goal').length}`;

  inner.innerHTML = `
    <div class="phase-header">
      <div class="phase-eyebrow">${eyebrow}</div>
      <div class="phase-title">${p.title}</div>
      <div class="phase-subtitle">${p.subtitle}</div>
    </div>
    ${bodyHtml}`;

  const notesEl = document.getElementById('notesArea-' + id);
  if (notesEl) {
    notesEl.addEventListener('input', e => {
      if (!state[id]) state[id] = { status:'pending', notes:'', checked:[], decisions:{} };
      state[id].notes = e.target.value;
      saveState(state);
    });
  }
  const procesoEl = document.getElementById('procesoArea-' + id);
  if (procesoEl) {
    procesoEl.addEventListener('input', e => {
      if (!state[id]) state[id] = { status:'pending', notes:'', checked:[], decisions:{} };
      state[id].proceso = e.target.value;
      saveState(state);
    });
  }
  renderTabs();
}

function toggleCheck(phaseId, index, el) {
  if (!state[phaseId]) state[phaseId] = { status:'pending', notes:'', checked:[], decisions:{} };
  const ps = state[phaseId];
  if (!ps.checked) ps.checked = [];
  ps.checked[index] = !ps.checked[index];
  saveState(state);
  el.classList.toggle('checked', ps.checked[index]);
  el.setAttribute('aria-checked', ps.checked[index] ? 'true' : 'false');
  el.querySelector('.check-box').textContent = ps.checked[index] ? '✓' : '';
  renderTabs();
}

function selectDecision(phaseId, decIdx, optIdx, el) {
  if (!state[phaseId]) state[phaseId] = { status:'pending', notes:'', checked:[], decisions:{} };
  if (!state[phaseId].decisions) state[phaseId].decisions = {};
  state[phaseId].decisions[decIdx] = optIdx;
  saveState(state);
  el.closest('.decision-opts').querySelectorAll('.decision-opt').forEach(o => {
    o.classList.remove('selected');
    o.setAttribute('aria-pressed', 'false');
  });
  el.classList.add('selected');
  el.setAttribute('aria-pressed', 'true');
}

function validatePhase(id) {
  const btn = document.getElementById('validateBtn-' + id);
  if (!btn || btn.classList.contains('validated')) return;
  if (!state[id]) state[id] = { status:'pending', notes:'', checked:[], decisions:{} };
  state[id].status = 'done';
  saveState(state);
  btn.classList.add('validated');
  const isGoal = id === 1;
  btn.innerHTML = `<span aria-hidden="true">✓</span> ${isGoal ? 'Objetivo confirmado' : 'Confirmado'}`;
  btn.setAttribute('aria-label', isGoal ? 'Objetivo ya confirmado' : 'Confirmado');
  renderTabs();
}

function continuarPhase(id) {
  const btn = document.getElementById('continuarBtn-' + id);
  if (!btn || btn.classList.contains('validated')) return;
  if (!state[id]) state[id] = { status:'pending', notes:'', checked:[], decisions:{} };
  state[id].status = 'continued';
  saveState(state);
  btn.classList.add('validated');
  btn.innerHTML = `<span aria-hidden="true">✓</span> Fase completada`;
  btn.setAttribute('aria-label', 'Fase completada');
  renderTabs();
}

function setPasoStatus(phaseId, i, newStatus) {
  if (!state[phaseId]) state[phaseId] = { status:'pending', notes:'', checked:[], decisions:{} };
  if (!state[phaseId].pasoStatus) state[phaseId].pasoStatus = [];
  state[phaseId].pasoStatus[i] = newStatus;
  saveState(state);
  loadPhase(phaseId);
}

function setValStatus(phaseId, i, newStatus) {
  if (!state[phaseId]) state[phaseId] = { status:'pending', notes:'', checked:[], decisions:{} };
  if (!state[phaseId].valStatus) state[phaseId].valStatus = [];
  state[phaseId].valStatus[i] = newStatus;
  saveState(state);
  loadPhase(phaseId);
}

function togglePasoOutput(phaseId, i) {
  const el = document.getElementById(`pasoOutput-${phaseId}-${i}`);
  if (el) el.style.display = el.style.display === 'none' ? 'block' : 'none';
}

function toggleValOutput(phaseId, i) {
  const el = document.getElementById(`valOutput-${phaseId}-${i}`);
  if (el) el.style.display = el.style.display === 'none' ? 'block' : 'none';
}

function savePasoOutput(phaseId, i, value) {
  if (!state[phaseId]) state[phaseId] = { status:'pending', notes:'', checked:[], decisions:{} };
  if (!state[phaseId].pasoOutput) state[phaseId].pasoOutput = [];
  state[phaseId].pasoOutput[i] = value;
  saveState(state);
}

function saveValOutput(phaseId, i, value) {
  if (!state[phaseId]) state[phaseId] = { status:'pending', notes:'', checked:[], decisions:{} };
  if (!state[phaseId].valOutput) state[phaseId].valOutput = [];
  state[phaseId].valOutput[i] = value;
  saveState(state);
}

function renderTreeView(text) {
  const lines = text.split('\n').map(line => {
    const esc = line.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    if (esc.includes('← NUEVO') || esc.includes('← NUEVO:') || esc.includes('NUEVO')) {
      return esc.replace(/(← NUEVO[^<]*)/g, '<span class="tree-new">$1</span>');
    }
    if (esc.includes('←')) {
      return esc.replace(/(←[^<]*)/g, '<span class="tree-comment">$1</span>');
    }
    return esc;
  }).join('\n');
  return `<div class="tree-view" role="img" aria-label="Árbol de estructura target del worktree">${lines}</div>`;
}


/* ── Teclado: Enter/Space activan role="checkbox" ── */
document.addEventListener('keydown', function(e) {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const el = document.activeElement;
  if (!el) return;
  if (el.getAttribute('role') === 'checkbox') {
    e.preventDefault();
    el.click();
  }
});

loadPhase(1);
</script>
</body>
