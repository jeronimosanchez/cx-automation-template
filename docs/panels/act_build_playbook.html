<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACT Build Playbook</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --accent-indigo: #6366f1;
    --accent-emerald: #10b981;
    --accent-amber: #f59e0b;

    --bg: #ffffff;
    --bg-2: #f6f8fa;
    --bg-3: #eaeef2;
    --border: #d0d7de;
    --text: #1f2328;
    --text-2: #57606a;
    --text-3: #5c6872;

    --nav-bg: #0d1117;
    --nav-border: #21262d;

    --llm-bg: #eff6ff;
    --llm-border: #bfdbfe;
    --llm-header: #1d4ed8;
    --val-bg: #fffbeb;
    --val-border: #fde68a;
    --val-header: #92400e;
    --ctx-bg: #f0fdf4;
    --ctx-border: #bbf7d0;
    --ctx-header: #166534;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117; --bg-2: #161b22; --bg-3: #21262d; --border: #30363d;
      --text: #e6edf3; --text-2: #8b949e; --text-3: #6e7681;
      --llm-bg: #0f172a; --llm-border: #1e3a5f; --llm-header: #93c5fd;
      --val-bg: #1c1400; --val-border: #78350f; --val-header: #fcd34d;
      --ctx-bg: #052e16; --ctx-border: #14532d; --ctx-header: #86efac;
    }
  }
  :root[data-theme="light"] {
    --bg: #ffffff; --bg-2: #f6f8fa; --bg-3: #eaeef2; --border: #d0d7de;
    --text: #1f2328; --text-2: #57606a; --text-3: #5c6872;
    --llm-bg: #eff6ff; --llm-border: #bfdbfe; --llm-header: #1d4ed8;
    --val-bg: #fffbeb; --val-border: #fde68a; --val-header: #92400e;
    --ctx-bg: #f0fdf4; --ctx-border: #bbf7d0; --ctx-header: #166534;
  }
  :root[data-theme="dark"] {
    --bg: #0d1117; --bg-2: #161b22; --bg-3: #21262d; --border: #30363d;
    --text: #e6edf3; --text-2: #8b949e; --text-3: #6e7681;
    --llm-bg: #0f172a; --llm-border: #1e3a5f; --llm-header: #93c5fd;
    --val-bg: #1c1400; --val-border: #78350f; --val-header: #fcd34d;
    --ctx-bg: #052e16; --ctx-border: #14532d; --ctx-header: #86efac;
  }

  html, body {
    height: 100%;
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  body {
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
  }

  /* ── TOP BAR ── */
  .topbar {
    background: var(--nav-bg);
    border-bottom: 1px solid var(--nav-border);
    flex-shrink: 0;
    padding: 0 20px;
    display: flex;
    flex-direction: column;
    gap: 0;
  }

  .topbar-header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 12px 0 10px;
    border-bottom: 1px solid var(--nav-border);
  }
  .topbar-title {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #e6edf3;
  }
  .topbar-sub {
    font-size: 11px;
    color: #8b949e;
  }
  .topbar-progress-wrap {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .topbar-progress-bar {
    width: 120px;
    height: 3px;
    background: #21262d;
    border-radius: 2px;
    overflow: hidden;
  }
  .topbar-progress-fill {
    height: 100%;
    background: var(--accent-emerald);
    border-radius: 2px;
    transition: width 0.4s ease;
    width: 0%;
  }
  .topbar-progress-label {
    font-size: 11px;
    color: #8b949e;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }

  /* ── PHASE TABS ── */
  .phase-tabs {
    display: flex;
    gap: 4px;
    padding: 10px 0;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .phase-tabs::-webkit-scrollbar { display: none; }

  .phase-tab {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 4px;
    padding: 8px 12px;
    border-radius: 6px;
    cursor: pointer;
    border: 1px solid transparent;
    flex-shrink: 0;
    min-width: 100px;
    max-width: 130px;
    transition: background 0.12s, border-color 0.12s;
    position: relative;
  }
  .phase-tab:hover { background: #161b22; border-color: #30363d; }
  .phase-tab.active {
    background: #1f2937;
    border-color: var(--accent-indigo);
  }
  .phase-tab.active::after {
    content: '';
    position: absolute;
    bottom: -11px;
    left: 50%;
    transform: translateX(-50%);
    width: 24px;
    height: 2px;
    background: var(--accent-indigo);
    border-radius: 1px;
  }

  .tab-top {
    display: flex;
    align-items: center;
    gap: 6px;
    width: 100%;
  }
  .tab-num {
    font-size: 13px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    color: #8b949e;   /* dark non-active: gris visible ~5:1 sobre #0d1117 */
  }
  .phase-tab.active .tab-num { color: #e6edf3; } /* dark active: blanco ~14:1 sobre #1f2937 */
  /* Pastillas sólidas — fondo + texto blanco. Ratios WCAG 2.0 AA (#fff sobre fondo):
     .tag-py  #2563eb ~5.9:1 ✓ | .tag-html #c2410c ~4.6:1 ✓ | .tag-ci #7c3aed ~4.7:1 ✓
     .tag-audit #4b5563 ~7.2:1 ✓ | .tag-goal #047857 ~5.5:1 ✓                         */
  .tab-tag {
    margin-left: auto;
    font-size: 9px; padding: 2px 6px; border-radius: 3px; font-weight: 600;
    color: #ffffff;
    letter-spacing: 0.03em;
  }
  .tag-py    { background: #2563eb; }
  .tag-html  { background: #c2410c; }
  .tag-ci    { background: #7c3aed; }
  .tag-discarded { background: #3d2b2b; color: #e57373; }
  .phase-tab.discarded-tab .tab-name { color: #7d8590; text-decoration: line-through; }
  .tag-audit { background: #4b5563; }
  .tag-goal  { background: #047857; }

  .tab-name {
    font-size: 11px;
    font-weight: 500;
    color: #8b949e;
    line-height: 1.3;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    width: 100%;
  }
  .phase-tab.active .tab-name { color: #e6edf3; }
  .phase-tab.done-tab .tab-name { color: #7d8590; } /* #7d8590 on #0d1117 ≈ 5.1:1 */

  /* ── LIGHT MODE — tab cards presencia visual + contraste ── */
  @media (prefers-color-scheme: light) {
    .tab-num { color: #4b5563; } /* light non-active: ~7.7:1 sobre #f6f8fa ✓ */
    .phase-tab { background: #f6f8fa; border-color: #d0d7de; }
    .phase-tab:hover { background: #eaeef2; border-color: #d0d7de; }
    .phase-tab.active { background: #1f2937; border-color: var(--accent-indigo); }
    .phase-tab.active .tab-num { color: #e6edf3; } /* #1f2328 on #1f2937 = 1.08:1 ✗ → #e6edf3 on #1f2937 = 12.42:1 ✓ */
    .tab-name { color: #4b5563; }          /* ~7.7:1 sobre #f6f8fa ✓ */
    .phase-tab.active .tab-name { color: #e6edf3; }
    .phase-tab.done-tab .tab-name { color: #6b7280; }
  }
  :root[data-theme="light"] .tab-num { color: #4b5563; } /* light non-active: ~7.7:1 sobre #f6f8fa ✓ */
  :root[data-theme="light"] .phase-tab { background: #f6f8fa; border-color: #d0d7de; }
  :root[data-theme="light"] .phase-tab:hover { background: #eaeef2; border-color: #d0d7de; }
  :root[data-theme="light"] .phase-tab.active { background: #1f2937; border-color: var(--accent-indigo); }
  :root[data-theme="light"] .phase-tab.active .tab-num { color: #e6edf3; } /* idem — 12.42:1 ✓ */
  :root[data-theme="light"] .tab-name { color: #4b5563; }
  :root[data-theme="light"] .phase-tab.active .tab-name { color: #e6edf3; }
  :root[data-theme="light"] .phase-tab.done-tab .tab-name { color: #6b7280; }

  /* ── CONTENT ── */
  .content {
    flex: 1;
    overflow-y: auto;
    background: var(--bg);
  }
  .content::-webkit-scrollbar { width: 6px; }
  .content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .content-inner {
    max-width: 820px;
    padding: 28px 32px;
    margin: 0 auto;
  }

  .phase-header {
    margin-bottom: 22px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--border);
  }
  .phase-eyebrow {
    font-size: 11px; font-weight: 600; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--text-3); margin-bottom: 5px;
  }
  .phase-title { font-size: 21px; font-weight: 700; color: var(--text); line-height: 1.2; }
  .phase-subtitle { font-size: 13px; color: var(--text-2); margin-top: 4px; }

  /* ── BLOCKS ── */
  .block { border-radius: 6px; border: 1px solid; overflow: hidden; margin-bottom: 14px; }
  .block-header {
    display: flex; align-items: center; gap: 8px; padding: 10px 16px;
    font-size: 11px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase;
    cursor: pointer; user-select: none;
  }
  .block-header .bh-toggle { margin-left: auto; font-size: 10px; opacity: 0.6; transition: transform 0.2s; }
  .block-header.collapsed .bh-toggle { transform: rotate(-90deg); }

  .block.ctx { border-color: var(--ctx-border); }
  .block.ctx .block-header { background: var(--ctx-bg); color: var(--ctx-header); }
  .block.llm { border-color: var(--llm-border); }
  .block.llm .block-header { background: var(--llm-bg); color: var(--llm-header); }
  .block.val { border-color: var(--val-border); }
  .block.val .block-header { background: var(--val-bg); color: var(--val-header); }
  .block.proceso { border-color: #2d4a3e; }
  .block.proceso .block-header { background: #1a3329; color: #4caf87; }
  :root[data-theme="light"] .block.proceso { border-color: #a8d5bf; }
  :root[data-theme="light"] .block.proceso .block-header { background: #eaf7f0; color: #1a6641; }
  .block.criterios { border-color: #2d3a4a; }
  .block.criterios .block-header { background: #1a2535; color: #7eb8e8; }
  :root[data-theme="light"] .block.criterios { border-color: #b8d0e8; }
  :root[data-theme="light"] .block.criterios .block-header { background: #eaf2fb; color: #1a4a6e; }

  .paso-row { display:flex; align-items:flex-start; gap:10px; margin-bottom:8px; }
  .paso-chip { flex-shrink:0; font-size:11px; font-weight:600; padding:3px 8px; border-radius:4px; cursor:pointer; border:none; }
  .paso-chip.pending { background:#333; color:#888; }
  .paso-chip.running { background:#3d2f00; color:#f0a500; }
  .paso-chip.done    { background:#1a3329; color:#4caf87; }
  .paso-chip.error   { background:#3d0000; color:#f44; }
  .paso-text { flex:1; font-size:13px; color:var(--text-1); line-height:1.5; }
  .paso-expand-btn { flex-shrink:0; font-size:11px; color:var(--text-2); background:none; border:none; cursor:pointer; padding:2px 6px; }
  .paso-output { display:none; margin-top:6px; margin-left:80px; }
  .paso-output textarea { width:100%; min-height:60px; font-size:12px; padding:8px 10px; border:1px solid var(--border); border-radius:4px; background:var(--bg); color:var(--text); font-family:inherit; resize:vertical; }
  :root[data-theme="light"] .paso-chip.pending { background:#e8e8e8; color:#666; }
  :root[data-theme="light"] .paso-chip.running { background:#fff8e0; color:#8a6000; }
  :root[data-theme="light"] .paso-chip.done    { background:#eaf7f0; color:#1a6641; }
  :root[data-theme="light"] .paso-chip.error   { background:#fff0f0; color:#c00; }
  .proceso-section-label { font-size:11px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; color:var(--text-3); margin-bottom:8px; margin-top:4px; }
  .proceso-separator { border:none; border-top:1px solid var(--border); margin:16px 0 14px; }
  .validate-btn:disabled { opacity:0.45; cursor:not-allowed; }
  .validate-btn:disabled:hover { background:var(--accent-indigo); transform:none; }

  .block-body { padding: 20px; background: var(--bg); }
  .block-body.hidden { display: none; }

  /* LLM content */
  .llm-section { margin-bottom: 18px; }
  .llm-section:last-child { margin-bottom: 0; }
  .llm-section-title {
    font-size: 11px; font-weight: 700; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--text-3); margin-bottom: 8px;
  }
  .llm-section p { font-size: 13px; color: var(--text-2); line-height: 1.6; }

  .llm-list { list-style: none; display: flex; flex-direction: column; gap: 5px; }
  .llm-list li { font-size: 13px; color: var(--text-2); padding-left: 14px; position: relative; line-height: 1.5; }
  .llm-list li::before { content: '·'; position: absolute; left: 0; color: var(--text-3); font-weight: 700; }
  .llm-list.steps { counter-reset: steps; }
  .llm-list.steps li { padding-left: 22px; }
  .llm-list.steps li::before { counter-increment: steps; content: counter(steps) '.'; font-size: 11px; font-weight: 600; color: var(--text-3); top: 1px; }

  /* Context grid */
  .ctx-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .ctx-card { background: var(--bg-2); border: 1px solid var(--border); border-radius: 5px; padding: 12px 14px; }
  .ctx-card-title { font-size: 10px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: var(--text-3); margin-bottom: 6px; }
  .ctx-card p { font-size: 12px; color: var(--text-2); line-height: 1.5; }
  .ctx-card ul { list-style: none; display: flex; flex-direction: column; gap: 3px; }
  .ctx-card ul li { font-size: 12px; color: var(--text-2); padding-left: 10px; position: relative; }
  .ctx-card ul li::before { content: '·'; position: absolute; left: 0; color: var(--text-3); }

  code { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 11.5px; background: var(--bg-3); padding: 1px 5px; border-radius: 3px; }

  .code-block {
    background: var(--bg-3); border: 1px solid var(--border); border-radius: 4px;
    padding: 10px 12px; font-family: 'SF Mono', 'Fira Code', monospace;
    font-size: 11px; color: var(--text); line-height: 1.6;
    overflow-x: auto; margin-top: 8px; white-space: pre;
  }

  .output-path {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 10px 12px; background: var(--bg-2); border: 1px solid var(--border);
    border-radius: 4px; margin-bottom: 8px;
  }
  .output-path:last-child { margin-bottom: 0; }
  .op-icon { font-size: 14px; flex-shrink: 0; margin-top: 1px; }
  .op-path { font-family: 'SF Mono', monospace; font-size: 12px; color: var(--accent-indigo); font-weight: 500; }
  .op-desc { font-size: 12px; color: var(--text-3); margin-top: 2px; }

  .template-block { background: var(--bg-2); border: 1px solid var(--border); border-radius: 4px; overflow: hidden; margin-top: 8px; }
  .template-label { padding: 6px 12px; font-size: 10px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-3); border-bottom: 1px solid var(--border); background: var(--bg-3); }

  /* Checklist */
  .checklist-group { margin-bottom: 18px; }
  .checklist-group:last-child { margin-bottom: 0; }
  .checklist-group-title {
    font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--text-3); margin-bottom: 8px; display: flex; align-items: center; gap: 6px;
  }
  .checklist-group-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  .checklist { display: flex; flex-direction: column; gap: 7px; }
  .check-item {
    display: flex; align-items: flex-start; gap: 10px; padding: 9px 12px;
    border-radius: 4px; border: 1px solid var(--border); background: var(--bg-2);
    cursor: pointer; transition: border-color 0.15s, background 0.15s;
  }
  .check-item:hover { border-color: var(--accent-amber); }
  .check-item.checked { border-color: var(--accent-emerald); background: rgba(16,185,129,0.05); }
  .check-box {
    width: 15px; height: 15px; border-radius: 3px; border: 1.5px solid var(--border);
    flex-shrink: 0; margin-top: 1px; display: flex; align-items: center; justify-content: center;
    font-size: 9px; color: transparent; transition: all 0.15s;
  }
  .check-item.checked .check-box { background: var(--accent-emerald); border-color: var(--accent-emerald); color: #fff; }
  .check-text { font-size: 13px; color: var(--text-2); line-height: 1.5; flex: 1; }
  .check-item.checked .check-text { color: var(--text-3); text-decoration: line-through; text-decoration-color: var(--accent-emerald); }

  /* Decisions */
  .decisions { display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px; }
  .decision-item { padding: 12px 14px; border-radius: 4px; border: 1px solid var(--border); background: var(--bg-2); }
  .decision-q { font-size: 13px; font-weight: 500; color: var(--text); margin-bottom: 8px; }
  .decision-opts { display: flex; gap: 6px; flex-wrap: wrap; }
  .decision-opt {
    padding: 4px 12px; border-radius: 12px; font-size: 12px; font-weight: 500;
    border: 1px solid var(--border); cursor: pointer; color: var(--text-2);
    background: var(--bg); transition: all 0.15s;
  }
  .decision-opt:hover { border-color: var(--accent-indigo); color: var(--accent-indigo); }
  .decision-opt.selected { background: var(--accent-indigo); border-color: var(--accent-indigo); color: #fff; }

  .notes-label { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-3); margin-bottom: 6px; margin-top: 18px; }
  .notes-area {
    width: 100%; min-height: 68px; padding: 10px 12px;
    border: 1px solid var(--border); border-radius: 4px;
    background: var(--bg); color: var(--text); font-family: inherit; font-size: 13px;
    line-height: 1.5; resize: vertical; margin-bottom: 14px; transition: border-color 0.15s;
  }
  .notes-area:focus { outline: 2px solid var(--accent-indigo); outline-offset: 0; border-color: var(--accent-indigo); }
  .notes-area::placeholder { color: var(--text-3); }

  .validate-btn {
    display: inline-flex; align-items: center; gap: 8px; padding: 8px 18px;
    border-radius: 5px; border: none; cursor: pointer; font-size: 13px; font-weight: 600;
    font-family: inherit; background: var(--accent-indigo); color: #fff;
    transition: background 0.15s, transform 0.1s;
  }
  .validate-btn:hover { background: #5254cc; }
  .validate-btn:active { transform: scale(0.98); }
  .validate-btn.validated { background: var(--accent-emerald); cursor: default; }
  .validate-btn.validated:hover { background: var(--accent-emerald); }

  .empty-state {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 50vh; color: var(--text-3); text-align: center;
  }
  .empty-state .es-icon { font-size: 36px; margin-bottom: 10px; opacity: 0.35; }
  .empty-state p { font-size: 14px; }

  /* ── REF BLOCKS ── */
  .block.ref { border-color: #30363d; }
  .block.ref .block-header { background: #161b22; color: #8b949e; }
  :root[data-theme="light"] .block.ref { border-color: var(--border); }
  :root[data-theme="light"] .block.ref .block-header { background: var(--bg-2); color: var(--text-2); }
  /* ── MD BLOCK ── */
  .block.md { border-color: #30363d; }
  .block.md .block-header { background: #161b22; color: #8b949e; }
  :root[data-theme="light"] .block.md { border-color: var(--border); }
  :root[data-theme="light"] .block.md .block-header { background: var(--bg-2); color: var(--text-2); }
  @media (prefers-color-scheme: light) {
    .block.md { border-color: var(--border); }
    .block.md .block-header { background: var(--bg-2); color: var(--text-2); }
  }
  .md-toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .md-toolbar-label { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-3); }
  .copy-btn {
    display: inline-flex; align-items: center; gap: 5px; padding: 5px 12px;
    border-radius: 4px; border: 1px solid var(--border); cursor: pointer;
    font-size: 11px; font-weight: 600; font-family: inherit;
    background: var(--bg-2); color: var(--text-2); transition: all 0.15s;
  }
  .copy-btn:hover { border-color: var(--accent-indigo); color: var(--accent-indigo); }
  .copy-btn.copied { background: var(--accent-emerald); border-color: var(--accent-emerald); color: #fff; }
  .md-preview {
    background: var(--bg-3); border: 1px solid var(--border); border-radius: 4px;
    padding: 14px 16px; font-family: 'SF Mono', 'Fira Code', monospace;
    font-size: 11px; color: var(--text-2); line-height: 1.7;
    overflow-x: auto; white-space: pre; max-height: 400px; overflow-y: auto;
  }

n — cada paso tiene criterios de validación específicos que el script debe respetar.', 'definitions/ — YAMLs de los 12 tipos de recursos que se despliegan a CX: playbooks/, examples/, tools/, intents/, entity_types/, webhooks/, generators/, flows/, pages/, config/ (agent config), environments/, versions/. Son la fuente de verdad local contra la que se hace el diff en el Paso 3.'], outputs: [], pasos: [] }, val: { grupos: [

const KEY = 'act_playbook_v4';
function loadState() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } }
function saveState(s) { localStorage.setItem(KEY, JSON.stringify(s)); }
function getPS(s, id) { return s[id] || { status: 'pending', notes: '', checked: [], decisions: {} }; }

let currentPhaseId = null;
let state = loadState();

function computeStatus(id) {
  const ps = getPS(state, id);
  if (ps.status === 'done' || ps.status === 'continued') return 'done';
  if ((ps.checked || []).some(Boolean)) return 'active-s';
  return 'pending';
}

function updateProgress() {
  const trackable = PHASES.filter(p => p.special !== 'goal');
  const done = trackable.filter(p => ['done','continued'].includes((state[p.id] || {}).status)).length;
  document.getElementById('progressFill').style.width = Math.round(done / trackable.length * 100) + '%';
  document.getElementById('progressLabel').textContent = `${done} / ${trackable.length} fases`;
  const bar = document.querySelector('.topbar-progress-bar');
  if (bar) { bar.setAttribute('aria-valuenow', done); bar.setAttribute('aria-valuemax', trackable.length); }
}

function renderTabs() {
  const nav = document.getElementById('phaseTabs');
  nav.innerHTML = '';
  PHASES.forEach(p => {
    const status = computeStatus(p.id);
    const isActive = p.id === currentPhaseId;
    const tab = document.createElement('button');
    tab.setAttribute('role', 'tab');
    tab.setAttribute('aria-selected', isActive ? 'true' : 'false');
    tab.setAttribute('aria-controls', 'contentInner');
    tab.setAttribute('aria-label', p.special === 'goal' ? `Objetivo del proyecto` : `Fase ${p.id}: ${p.title} — estado: ${status === 'done' ? 'completada' : status === 'active-s' ? 'en progreso' : 'pendiente'}`);
    tab.className = 'phase-tab' + (isActive ? ' active' : '') + (status === 'done' ? ' done-tab' : '') + (p.discarded ? ' discarded-tab' : '');
    const isGoal = p.special === 'goal';
    tab.innerHTML = `
      <div class="tab-top">
        <span class="tab-num" aria-hidden="true">${p.id}</span>
        <span class="tab-tag ${p.discarded ? 'tag-discarded' : 'tag-'+p.tag}" aria-hidden="true">${p.discarded ? 'Descartada' : p.tagLabel}</span>
      </div>
      <div class="tab-name">${p.title}</div>`;
    tab.addEventListener('click', () => loadPhase(p.id));
    nav.appendChild(tab);
  });
  updateProgress();
}

function toggleBlock(id) {
  const body = document.getElementById('bb-' + id);
  const hdr = document.getElementById('bh-' + id);
  if (!body) return;
  const hidden = body.classList.toggle('hidden');
  hdr.classList.toggle('collapsed', hidden);
  hdr.setAttribute('aria-expanded', hidden ? 'false' : 'true');
}

function makeBlock(type, icon, label, id, bodyHtml, startOpen) {
  return `<div class="block ${type}">
    <button class="block-header${startOpen ? '' : ' collapsed'}" id="bh-${id}"
            onclick="toggleBlock('${id}')"
            aria-expanded="${startOpen ? 'true' : 'false'}"
            aria-controls="bb-${id}">
      <span aria-hidden="true">${icon}</span><span>${label}</span>
      <span class="bh-toggle" aria-hidden="true">▾</span>
    </button>
    <div class="block-body${startOpen ? '' : ' hidden'}" id="bb-${id}" role="region" aria-labelledby="bh-${id}">${bodyHtml}</div>
  </div>`;
}

function renderList(items, ordered) {
  return `<ul class="llm-list${ordered ? ' steps' : ''}">${items.map(i => `<li>${i}</li>`).join('')}</ul>`;
}

function renderOperaciones(ops) {
  const TIPO_CFG = {
    crear:    { label: 'CREAR',    bg: 'rgba(59,130,246,.15)',  color: '#60a5fa' },
    mover:    { label: 'MOVER',    bg: 'rgba(100,116,139,.15)', color: 'var(--text-2)' },
    eliminar: { label: 'ELIMINAR', bg: 'rgba(239,68,68,.15)',   color: '#f87171' },
    verificar:{ label: 'VERIFICAR',bg: 'rgba(234,179,8,.15)',   color: '#facc15' },
    ejecutar: { label: 'EJECUTAR', bg: 'rgba(168,85,247,.15)',  color: '#c084fc' },
  };
  const makePill = (tipo, customLabel) => {
    const cfg = TIPO_CFG[tipo] || TIPO_CFG.mover;
    const label = customLabel !== undefined ? customLabel : cfg.label;
    return `<span style="display:inline-block;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:700;letter-spacing:.04em;background:${cfg.bg};color:${cfg.color}">${label}</span>`;
  };
  const rows = ops.map(op => {
    if (op.items) {
      if (op.tipo === 'crear') {
        const pill = makePill(op.tipo);
        // items are strings — header row + individual sub-rows (same structure as MOVER)
        const headerRow = `<tr style="border-top:1px solid var(--border)">
          <td style="padding:6px 10px 4px 0;white-space:nowrap">${pill}</td>
          <td style="padding:6px 10px 4px 0" colspan="2"></td>
        </tr>`;
        const subRows = op.items.map(f => `<tr>
          <td style="padding:2px 10px 2px 0"></td>
          <td style="padding:2px 10px 2px 16px"><code style="font-size:11px;color:var(--text)">${f}</code></td>
          <td style="padding:2px 0"></td>
        </tr>`).join('');
        return headerRow + subRows;
      } else {
        // items are objects {archivo, nota} — header row + indented sub-rows
        // For MOVER groups: destination goes inside the pill label
        const pillLabel = (op.tipo === 'mover' && op.destino)
          ? `MOVER a ${op.destino}`
          : TIPO_CFG[op.tipo].label;
        const pill = makePill(op.tipo, pillLabel);
        const headerRow = `<tr style="border-top:1px solid var(--border)">
          <td style="padding:6px 10px 4px 0;white-space:nowrap" colspan="3">${pill}</td>
        </tr>`;
        const subRows = op.items.map(item => {
          const nota = item.nota ? `<span style="font-size:11px;color:var(--text-3)">${item.nota}</span>` : '';
          return `<tr>
            <td style="padding:2px 10px 2px 0"></td>
            <td style="padding:2px 10px 2px 16px"><code style="font-size:11px;color:var(--text)">${item.archivo}</code></td>
            <td style="padding:2px 0">${nota}</td>
          </tr>`;
        }).join('');
        return headerRow + subRows;
      }
    } else {
      // Single operation
      // For MOVER with destino: destination goes inside the pill label
      const pillLabel = (op.tipo === 'mover' && op.destino)
        ? `MOVER a ${op.destino}`
        : undefined;
      const pill = makePill(op.tipo, pillLabel);
      const archivo = `<code style="font-size:11px;color:var(--text)">${op.archivo}</code>`;
      const nota = op.nota ? `<span style="font-size:11px;color:var(--text-3)">${op.nota}</span>` : '';
      return `<tr><td style="padding:5px 10px 5px 0;white-space:nowrap">${pill}</td><td style="padding:5px 10px 5px 0">${archivo}</td><td style="padding:5px 0">${nota}</td></tr>`;
    }
  }).join('');
  return `<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums">
    <thead><tr style="border-bottom:1px solid var(--border)">
      <th style="text-align:left;padding:4px 10px 8px 0;font-size:11px;color:var(--text-3);font-weight:600">Tipo</th>
      <th style="text-align:left;padding:4px 10px 8px 0;font-size:11px;color:var(--text-3);font-weight:600">Archivo</th>
      <th style="text-align:left;padding:4px 0 8px;font-size:11px;color:var(--text-3);font-weight:600">Nota</th>
    </tr></thead>
    <tbody>${rows}</tbody>
  </table></div>`;
}

function renderGenericPhase(p, ps) {
  const contextoHtml = p.llm.contexto && p.llm.contexto.length
    ? `<div class="ctx-grid" style="margin-bottom:16px">${p.llm.contexto.map(c=>`<div class="ctx-card" style="grid-column:1/-1"><div class="ctx-card-title">${c.title}</div><p>${c.body}</p></div>`).join('')}</div>` : '';
  const porQueHtml = p.llm.porQue
    ? `<div class="llm-section"><div class="llm-section-title">Por qué</div><p>${p.llm.porQue}</p></div>` : '';
  const reglasHtml = p.llm.reglas && p.llm.reglas.length
    ? `<div class="llm-section"><div class="llm-section-title">Reglas de construcción obligatorias</div>${renderList(p.llm.reglas, false)}</div>` : '';
  const leerHtml = p.llm.leer && p.llm.leer.length
    ? `<div class="llm-section"><div class="llm-section-title">Qué leer antes de empezar</div>${renderList(p.llm.leer, false)}</div>` : '';
  const pasosHtml = p.llm.pasos && p.llm.pasos.length
    ? `<div class="llm-section"><div class="llm-section-title">Pasos de ejecución</div>${renderList(p.llm.pasos, true)}</div>` : '';
  const opHtml = p.llm.operaciones && p.llm.operaciones.length
    ? `<div class="llm-section"><div class="llm-section-title">Operaciones</div>${renderOperaciones(p.llm.operaciones)}</div>` : '';
  const outputsHtml = p.llm.outputs && p.llm.outputs.length
    ? `<div class="llm-section"><div class="llm-section-title">Outputs</div>${p.llm.outputs.map(o=>`<div class="output-path"><div class="op-icon" aria-hidden="true">📄</div><div><div class="op-path">${o.path||o}</div>${o.desc?`<div class="op-desc">${o.desc}</div>`:''}</div></div>`).join('')}</div>` : '';
  const renderCriteriosTablas = () => p.val && p.val.grupos && p.val.grupos.length
    ? `<p style="font-size:12px;color:var(--text-2);margin-bottom:14px;line-height:1.5">La fase no está completa hasta que estos criterios se cumplen. Verifícalos tú mismo antes de marcar la fase como hecha.</p>
      ${p.val.grupos.map(g => {
        const hasObj = g.items.length && typeof g.items[0] === 'object';
        const tableRows = hasObj
          ? g.items.map(it => `<tr><td style="padding:7px 10px;border-bottom:1px solid var(--border);font-size:12px;font-family:monospace;color:var(--text-1);vertical-align:top">${it.criterio}</td><td style="padding:7px 10px;border-bottom:1px solid var(--border);font-size:12px;color:var(--text-2);vertical-align:top">${it.porQue}</td></tr>`).join('')
          : g.items.map(it => `<tr><td colspan="2" style="padding:7px 10px;border-bottom:1px solid var(--border);font-size:12px;color:var(--text-1)">${typeof it==='object'?it.criterio:it}</td></tr>`).join('');
        return `<div style="margin-bottom:16px">
          ${g.title ? `<div style="font-size:11px;font-weight:600;color:var(--text-2);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px">${g.title}</div>` : ''}
          <table style="width:100%;border-collapse:collapse;border:1px solid var(--border);border-radius:6px;overflow:hidden;table-layout:fixed"><colgroup><col style="width:45%"><col style="width:55%"></colgroup>
            ${hasObj ? `<thead><tr><th style="padding:6px 10px;background:var(--bg-2);font-size:11px;font-weight:600;color:var(--text-2);text-align:left;border-bottom:1px solid var(--border)">Criterio</th><th style="padding:6px 10px;background:var(--bg-2);font-size:11px;font-weight:600;color:var(--text-2);text-align:left;border-bottom:1px solid var(--border)">Por qué es necesario</th></tr></thead>` : ''}
            <tbody>${tableRows}</tbody>
          </table>
        </div>`;
      }).join('')}`
    : '';
  const valCriteriosHtml = null;
  const hasContent = porQueHtml || reglasHtml || leerHtml || pasosHtml || opHtml || outputsHtml;
  const llmHtml = contextoHtml
    + `<div class="llm-section"><div class="llm-section-title">Objetivo</div><p>${p.llm.objetivo}</p></div>`
    + porQueHtml + reglasHtml + leerHtml + opHtml + pasosHtml + outputsHtml
    + (!hasContent ? `<p style="font-size:12px;color:var(--text-3);font-style:italic;margin-top:12px">Contenido en construcción — se completa fase por fase en conversación.</p>` : '');

  let checkIdx = 0;
  const gruposHtml = p.val.grupos.map(g => {
    const items = g.items.map(item => {
      const i = checkIdx++;
      const checked = (ps.checked||[])[i] === true;
      return `<div class="check-item${checked?' checked':''}"
                   role="checkbox"
                   aria-checked="${checked}"
                   tabindex="0"
                   onclick="toggleCheck(${p.id},${i},this)">
        <div class="check-box" aria-hidden="true">${checked?'✓':''}</div><div class="check-text">${item}</div></div>`;
    }).join('');
    return `<div class="checklist-group"><div class="checklist-group-title">${g.title}</div><div class="checklist" role="group" aria-label="${g.title}">${items}</div></div>`;
  }).join('');

  const isDone = ps.status === 'done';
  const isContinued = ps.status === 'continued';

  const valHtml = `
    <p style="font-size:13px;color:var(--text-2);margin-bottom:12px;line-height:1.6">
      <strong>Instrucción:</strong> antes de ejecutar, escribe qué has entendido de esta fase y qué vas a hacer exactamente.
    </p>
    <label class="notes-label" for="notesArea-${p.id}">Comprensión y plan — Opus</label>
    <textarea class="notes-area" id="notesArea-${p.id}" placeholder="Escribe qué vas a hacer, qué archivos vas a crear y cómo lo vas a verificar..." style="min-height:120px">${ps.notes||''}</textarea>
    <button class="validate-btn${isDone||isContinued?' validated':''}" id="validateBtn-${p.id}" onclick="validatePhase(${p.id})"
            aria-label="${isDone||isContinued?'Confirmado':'Confirmar — Jero'}">
      <span aria-hidden="true">✓</span> ${isDone||isContinued?'Confirmado':'Confirmar — Jero'}</button>`;

  let checkIdx2 = 0;
  const valItems = p.val.grupos.flatMap(g => g.items);
  const valChecksHtml = p.val.grupos.map(g => {
    const items = g.items.map(item => {
      const i = checkIdx2++;
      const checked = (ps.checked||[])[i] === true;
      const label = typeof item === 'object' ? item.criterio : item;
      return `<div class="check-item${checked?' checked':''}"
                   role="checkbox" aria-checked="${checked}" tabindex="0"
                   onclick="toggleCheck(${p.id},${i},this)">
        <div class="check-box" aria-hidden="true">${checked?'✓':''}</div>
        <div class="check-text">${label}</div></div>`;
    }).join('');
    return `<div class="checklist-group">${g.title?`<div class="checklist-group-title">${g.title}</div>`:''}<div class="checklist" role="group">${items}</div></div>`;
  }).join('');

  const allChecked = valItems.length > 0 && valItems.every((_,i) => (ps.checked||[])[i] === true);
  const continuarDisabled = !allChecked && !isContinued ? ' disabled' : '';

  const procesoHtml = `
    <p style="font-size:13px;color:var(--text-2);margin-bottom:12px;line-height:1.6">
      <strong>Instrucción:</strong> actualiza este log mientras ejecutas — pega lo que va pasando, errores y cómo los resolviste. Cuando termines, marca los criterios de verificación.
    </p>
    <label class="notes-label" for="procesoArea-${p.id}">Log de ejecución — Opus</label>
    <textarea class="notes-area" id="procesoArea-${p.id}" placeholder="Pega aquí lo que va ocurriendo: comandos ejecutados, archivos creados, errores encontrados..." style="min-height:160px;font-family:monospace;font-size:12px">${ps.proceso||''}</textarea>
    <div style="margin-top:16px">${valChecksHtml}</div>
    <div style="margin-top:16px">
      <button class="validate-btn${isContinued?' validated':''}"${continuarDisabled} id="continuarBtn-${p.id}" onclick="continuarPhase(${p.id})"
              aria-label="${isContinued?'Fase completada':'Continuar →'}">
        <span aria-hidden="true">${isContinued?'✓':'→'}</span> ${isContinued?'Fase completada':'Continuar →'}</button>
    </div>`;

  const statusTableBlock = p.llm.leyenda
    ? makeBlock('ref','📊','Estado actual de componentes del repo','ref-status-'+p.id,
        (p.llm.targetTree ? `<div class="tree-view" style="margin-bottom:16px">${p.llm.targetTree}</div>` : '')
        + `<p style="font-size:12px;color:var(--text-2);margin-bottom:12px">${p.llm.leyenda}</p>`
        + renderStatusTable(), true)
    : '';

  const criteriosBody = renderCriteriosTablas();
  const criteriosBlock = criteriosBody
    ? makeBlock('criterios','✅','Criterios de validación','criterios'+p.id, criteriosBody, true)
    : '';

  const procesoBlock = p.val.grupos && p.val.grupos.length
    ? makeBlock('proceso','⚙️','Proceso — ejecución y verificación','proceso'+p.id,procesoHtml,true)
    : '';

  return makeBlock('llm','🤖','Para el LLM — instrucciones de construcción','llm'+p.id,llmHtml,true)
    + statusTableBlock
    + criteriosBlock
    + makeBlock('val','✋','Gate de Jero — comprensión y plan','val'+p.id,valHtml,true)
    + procesoBlock;
}

function loadPhase(id) {
  currentPhaseId = id;
  const p = PHASES.find(x => x.id === id);
  const ps = getPS(state, id);
  const inner = document.getElementById('contentInner');

  let bodyHtml;
  if (p.special === 'goal') {
    bodyHtml = renderGoalPhase(p, ps);
  } else {
    bodyHtml = renderGenericPhase(p, ps);
  }

  const eyebrow = p.special === 'goal'
    ? `Fase ${p.id} — Objetivo`
    : `Fase ${p.id} de ${PHASES.filter(x => x.special !== 'goal').length}`;

  inner.innerHTML = `
    <div class="phase-header">
      <div class="phase-eyebrow">${eyebrow}</div>
      <div class="phase-title">${p.title}</div>
      <div class="phase-subtitle">${p.subtitle}</div>
    </div>
    ${bodyHtml}`;

  const notesEl = document.getElementById('notesArea-' + id);
  if (notesEl) {
    notesEl.addEventListener('input', e => {
      if (!state[id]) state[id] = { status:'pending', notes:'', checked:[], decisions:{} };
      state[id].notes = e.target.value;
      saveState(state);
    });
  }
  const procesoEl = document.getElementById('procesoArea-' + id);
  if (procesoEl) {
    procesoEl.addEventListener('input', e => {
      if (!state[id]) state[id] = { status:'pending', notes:'', checked:[], decisions:{} };
      state[id].proceso = e.target.value;
      saveState(state);
    });
  }
  renderTabs();
}

function toggleCheck(phaseId, index, el) {
  if (!state[phaseId]) state[phaseId] = { status:'pending', notes:'', checked:[], decisions:{} };
  const ps = state[phaseId];
  if (!ps.checked) ps.checked = [];
  ps.checked[index] = !ps.checked[index];
  saveState(state);
  el.classList.toggle('checked', ps.checked[index]);
  el.setAttribute('aria-checked', ps.checked[index] ? 'true' : 'false');
  el.querySelector('.check-box').textContent = ps.checked[index] ? '✓' : '';
  renderTabs();
}

function selectDecision(phaseId, decIdx, optIdx, el) {
  if (!state[phaseId]) state[phaseId] = { status:'pending', notes:'', checked:[], decisions:{} };
  if (!state[phaseId].decisions) state[phaseId].decisions = {};
  state[phaseId].decisions[decIdx] = optIdx;
  saveState(state);
  el.closest('.decision-opts').querySelectorAll('.decision-opt').forEach(o => {
    o.classList.remove('selected');
    o.setAttribute('aria-pressed', 'false');
  });
  el.classList.add('selected');
  el.setAttribute('aria-pressed', 'true');
}

function validatePhase(id) {
  const btn = document.getElementById('validateBtn-' + id);
  if (!btn || btn.classList.contains('validated')) return;
  if (!state[id]) state[id] = { status:'pending', notes:'', checked:[], decisions:{} };
  state[id].status = 'done';
  saveState(state);
  btn.classList.add('validated');
  const isGoal = id === 1;
  btn.innerHTML = `<span aria-hidden="true">✓</span> ${isGoal ? 'Objetivo confirmado' : 'Confirmado'}`;
  btn.setAttribute('aria-label', isGoal ? 'Objetivo ya confirmado' : 'Confirmado');
  renderTabs();
}

function continuarPhase(id) {
  const btn = document.getElementById('continuarBtn-' + id);
  if (!btn || btn.classList.contains('validated')) return;
  if (!state[id]) state[id] = { status:'pending', notes:'', checked:[], decisions:{} };
  state[id].status = 'continued';
  saveState(state);
  btn.classList.add('validated');
  btn.innerHTML = `<span aria-hidden="true">✓</span> Fase completada`;
  btn.setAttribute('aria-label', 'Fase completada');
  renderTabs();
}

function setPasoStatus(phaseId, i, newStatus) {
  if (!state[phaseId]) state[phaseId] = { status:'pending', notes:'', checked:[], decisions:{} };
  if (!state[phaseId].pasoStatus) state[phaseId].pasoStatus = [];
  state[phaseId].pasoStatus[i] = newStatus;
  saveState(state);
  loadPhase(phaseId);
}

function setValStatus(phaseId, i, newStatus) {
  if (!state[phaseId]) state[phaseId] = { status:'pending', notes:'', checked:[], decisions:{} };
  if (!state[phaseId].valStatus) state[phaseId].valStatus = [];
  state[phaseId].valStatus[i] = newStatus;
  saveState(state);
  loadPhase(phaseId);
}

function togglePasoOutput(phaseId, i) {
  const el = document.getElementById(`pasoOutput-${phaseId}-${i}`);
  if (el) el.style.display = el.style.display === 'none' ? 'block' : 'none';
}

function toggleValOutput(phaseId, i) {
  const el = document.getElementById(`valOutput-${phaseId}-${i}`);
  if (el) el.style.display = el.style.display === 'none' ? 'block' : 'none';
}

function savePasoOutput(phaseId, i, value) {
  if (!state[phaseId]) state[phaseId] = { status:'pending', notes:'', checked:[], decisions:{} };
  if (!state[phaseId].pasoOutput) state[phaseId].pasoOutput = [];
  state[phaseId].pasoOutput[i] = value;
  saveState(state);
}

function saveValOutput(phaseId, i, value) {
  if (!state[phaseId]) state[phaseId] = { status:'pending', notes:'', checked:[], decisions:{} };
  if (!state[phaseId].valOutput) state[phaseId].valOutput = [];
  state[phaseId].valOutput[i] = value;
  saveState(state);
}

const BADGE = { ok: ['badge-ok','✓ funciona'], warn: ['badge-warn','⚠ reemplazar'], del: ['badge-del','✗ eliminar'], new: ['badge-new','◯ nuevo'] };

function renderStatusTable() {
  const rows = REPO_COMPONENTS.map(c => {
    const [cls, label] = BADGE[c.estado];
    const fileHtml = c.file.replace(/\//g, '/<wbr>');
    return `<tr>
      <td><code>${fileHtml}</code></td>
      <td>${c.tipo}</td>
      <td>${c.funcion}</td>
      <td style="font-size:11px">${c.descripcion||''}</td>
      <td style="font-size:11px;color:var(--text-3);font-family:monospace">${c.mecanismo||''}</td>
      <td><span class="badge ${cls}">${label}</span></td>
      <td style="color:var(--text-3);font-size:11px">${c.nota}</td>
    </tr>`;
  }).join('');
  return `<div style="overflow-x:auto">
    <table class="st-table" aria-label="Tabla de estado de componentes del repo">
      <thead><tr>
        <th style="min-width:160px;max-width:220px">Archivo</th><th style="min-width:80px">Tipo</th><th style="min-width:140px">Función</th><th style="min-width:160px">Descripción</th><th style="min-width:160px">Mecanismo</th><th style="min-width:90px">Estado</th><th style="min-width:120px">Observación</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

function renderTreeView(text) {
  const lines = text.split('\n').map(line => {
    const esc = line.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    if (esc.includes('← NUEVO') || esc.includes('← NUEVO:') || esc.includes('NUEVO')) {
      return esc.replace(/(← NUEVO[^<]*)/g, '<span class="tree-new">$1</span>');
    }
    if (esc.includes('←')) {
      return esc.replace(/(←[^<]*)/g, '<span class="tree-comment">$1</span>');
    }
    return esc;
  }).join('\n');
  return `<div class="tree-view" role="img" aria-label="Árbol de estructura target del worktree">${lines}</div>`;
}


/* ── Teclado: Enter/Space activan role="checkbox" ── */
document.addEventListener('keydown', function(e) {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const el = document.activeElement;
  if (!el) return;
  if (el.getAttribute('role') === 'checkbox') {
    e.preventDefault();
    el.click();
  }
});
