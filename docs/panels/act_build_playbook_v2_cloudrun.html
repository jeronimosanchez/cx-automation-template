<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACT Build Playbook v2 — intento 2</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --accent-indigo: #6366f1;
    --accent-emerald: #10b981;
    --accent-amber: #f59e0b;

    --bg: #ffffff;
    --bg-2: #f6f8fa;
    --bg-3: #eaeef2;
    --border: #d0d7de;
    --text: #1f2328;
    --text-2: #57606a;
    --text-3: #5c6872;

    --nav-bg: #0d1117;
    --nav-border: #21262d;

    --llm-bg: #eff6ff;
    --llm-border: #bfdbfe;
    --llm-header: #1d4ed8;
    --val-bg: #fffbeb;
    --val-border: #fde68a;
    --val-header: #92400e;
    --ctx-bg: #f0fdf4;
    --ctx-border: #bbf7d0;
    --ctx-header: #166534;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117; --bg-2: #161b22; --bg-3: #21262d; --border: #30363d;
      --text: #e6edf3; --text-2: #ffffff; --text-3: #ffffff;
      --llm-bg: #0f172a; --llm-border: #1e3a5f; --llm-header: #93c5fd;
      --val-bg: #1c1400; --val-border: #78350f; --val-header: #fcd34d;
      --ctx-bg: #052e16; --ctx-border: #14532d; --ctx-header: #86efac;
    }
  }
  :root[data-theme="light"] {
    --bg: #ffffff; --bg-2: #f6f8fa; --bg-3: #eaeef2; --border: #d0d7de;
    --text: #1f2328; --text-2: #57606a; --text-3: #5c6872;
    --llm-bg: #eff6ff; --llm-border: #bfdbfe; --llm-header: #1d4ed8;
    --val-bg: #fffbeb; --val-border: #fde68a; --val-header: #92400e;
    --ctx-bg: #f0fdf4; --ctx-border: #bbf7d0; --ctx-header: #166534;
  }
  :root[data-theme="dark"] {
    --bg: #0d1117; --bg-2: #161b22; --bg-3: #21262d; --border: #30363d;
    --text: #e6edf3; --text-2: #ffffff; --text-3: #ffffff;
    --llm-bg: #0f172a; --llm-border: #1e3a5f; --llm-header: #93c5fd;
    --val-bg: #1c1400; --val-border: #78350f; --val-header: #fcd34d;
    --ctx-bg: #052e16; --ctx-border: #14532d; --ctx-header: #86efac;
  }

  html, body {
    height: 100%;
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  body {
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
  }

  /* ── TOP BAR ── */
  .topbar {
    background: var(--nav-bg);
    border-bottom: 1px solid var(--nav-border);
    flex-shrink: 0;
    padding: 0 20px;
    display: flex;
    flex-direction: column;
    gap: 0;
  }

  .topbar-header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 12px 0 10px;
    border-bottom: 1px solid var(--nav-border);
  }
  .topbar-title {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #e6edf3;
  }
  .topbar-sub {
    font-size: 11px;
    color: #8b949e;
  }
  .topbar-progress-wrap {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .topbar-progress-bar {
    width: 120px;
    height: 3px;
    background: #21262d;
    border-radius: 2px;
    overflow: hidden;
  }
  .topbar-progress-fill {
    height: 100%;
    background: var(--accent-emerald);
    border-radius: 2px;
    transition: width 0.4s ease;
    width: 0%;
  }
  .topbar-progress-label {
    font-size: 11px;
    color: #8b949e;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }

  /* ── PHASE TABS ── */
  .phase-tabs {
    display: flex;
    gap: 4px;
    padding: 10px 0;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .phase-tabs::-webkit-scrollbar { display: none; }

  .phase-tab {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 4px;
    padding: 8px 12px;
    border-radius: 6px;
    cursor: pointer;
    border: 1px solid transparent;
    flex-shrink: 0;
    min-width: 100px;
    max-width: 130px;
    transition: background 0.12s, border-color 0.12s;
    position: relative;
  }
  .phase-tab:hover { background: #161b22; border-color: #30363d; }
  .phase-tab.active {
    background: #1f2937;
    border-color: var(--accent-indigo);
  }
  .phase-tab.active::after {
    content: '';
    position: absolute;
    bottom: -11px;
    left: 50%;
    transform: translateX(-50%);
    width: 24px;
    height: 2px;
    background: var(--accent-indigo);
    border-radius: 1px;
  }

  .tab-top {
    display: flex;
    align-items: center;
    gap: 6px;
    width: 100%;
  }
  .tab-num {
    font-size: 13px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    color: #8b949e;   /* dark non-active: gris visible ~5:1 sobre #0d1117 */
  }
  .phase-tab.active .tab-num { color: #e6edf3; } /* dark active: blanco ~14:1 sobre #1f2937 */
  /* Pastillas sólidas — fondo + texto blanco. Ratios WCAG 2.0 AA (#fff sobre fondo):
     .tag-py  #2563eb ~5.9:1 ✓ | .tag-html #c2410c ~4.6:1 ✓ | .tag-ci #7c3aed ~4.7:1 ✓
     .tag-audit #4b5563 ~7.2:1 ✓ | .tag-goal #047857 ~5.5:1 ✓                         */
  .tab-tag {
    margin-left: auto;
    font-size: 9px; padding: 2px 6px; border-radius: 3px; font-weight: 600;
    color: #ffffff;
    letter-spacing: 0.03em;
  }
  .tag-py    { background: #2563eb; }
  .tag-html  { background: #c2410c; }
  .tag-ci    { background: #7c3aed; }
  .tag-discarded { background: #3d2b2b; color: #e57373; }
  .phase-tab.discarded-tab .tab-name { color: #7d8590; text-decoration: line-through; }
  .tag-audit { background: #4b5563; }
  .tag-goal  { background: #047857; }
  /* .tag-build #4f46e5 ~5.4:1 ✓ | .tag-validate #0f766e ~5.6:1 ✓ — etiqueta semántica del patrón Build→Validate del pipeline */
  .tag-build    { background: #4f46e5; }
  .tag-validate { background: #0f766e; }
  .tab-filetype {
    font-size: 8px; font-weight: 700; color: #6b7280; letter-spacing: 0.05em;
    text-transform: uppercase; margin-top: 1px;
  }

  .tab-name {
    font-size: 11px;
    font-weight: 500;
    color: #8b949e;
    line-height: 1.3;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    width: 100%;
  }
  .phase-tab.active .tab-name { color: #e6edf3; }
  .phase-tab.done-tab .tab-name { color: #7d8590; } /* #7d8590 on #0d1117 ≈ 5.1:1 */

  /* ── LIGHT MODE — tab cards presencia visual + contraste ── */
  @media (prefers-color-scheme: light) {
    .tab-num { color: #4b5563; } /* light non-active: ~7.7:1 sobre #f6f8fa ✓ */
    .phase-tab { background: #f6f8fa; border-color: #d0d7de; }
    .phase-tab:hover { background: #eaeef2; border-color: #d0d7de; }
    .phase-tab.active { background: #1f2937; border-color: var(--accent-indigo); }
    .phase-tab.active .tab-num { color: #e6edf3; } /* #1f2328 on #1f2937 = 1.08:1 ✗ → #e6edf3 on #1f2937 = 12.42:1 ✓ */
    .tab-name { color: #4b5563; }          /* ~7.7:1 sobre #f6f8fa ✓ */
    .phase-tab.active .tab-name { color: #e6edf3; }
    .phase-tab.done-tab .tab-name { color: #6b7280; }
  }
  :root[data-theme="light"] .tab-num { color: #4b5563; } /* light non-active: ~7.7:1 sobre #f6f8fa ✓ */
  :root[data-theme="light"] .phase-tab { background: #f6f8fa; border-color: #d0d7de; }
  :root[data-theme="light"] .phase-tab:hover { background: #eaeef2; border-color: #d0d7de; }
  :root[data-theme="light"] .phase-tab.active { background: #1f2937; border-color: var(--accent-indigo); }
  :root[data-theme="light"] .phase-tab.active .tab-num { color: #e6edf3; } /* idem — 12.42:1 ✓ */
  :root[data-theme="light"] .tab-name { color: #4b5563; }
  :root[data-theme="light"] .phase-tab.active .tab-name { color: #e6edf3; }
  :root[data-theme="light"] .phase-tab.done-tab .tab-name { color: #6b7280; }

  /* ── CONTENT ── */
  .content {
    flex: 1;
    overflow-y: auto;
    background: var(--bg);
  }
  .content::-webkit-scrollbar { width: 6px; }
  .content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .content-inner {
    max-width: 820px;
    padding: 28px 32px;
    margin: 0 auto;
  }

  .phase-header {
    margin-bottom: 22px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--border);
  }
  .phase-eyebrow {
    font-size: 11px; font-weight: 600; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--text-3); margin-bottom: 5px;
  }
  .phase-title { font-size: 21px; font-weight: 700; color: var(--text); line-height: 1.2; }
  .phase-subtitle { font-size: 13px; color: var(--text-2); margin-top: 4px; }

  /* ── BLOCKS ── */
  .block { border-radius: 6px; border: 1px solid; overflow: hidden; margin-bottom: 14px; }
  .block-header {
    display: flex; align-items: center; gap: 8px; padding: 10px 16px;
    font-size: 11px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase;
    cursor: pointer; user-select: none;
  }
  .block-header .bh-toggle { margin-left: auto; font-size: 10px; opacity: 0.6; transition: transform 0.2s; }
  .block-header.collapsed .bh-toggle { transform: rotate(-90deg); }

  .block.ctx { border-color: var(--ctx-border); }
  .block.ctx .block-header { background: var(--ctx-bg); color: var(--ctx-header); }
  .block.llm { border-color: var(--llm-border); }
  .block.llm .block-header { background: var(--llm-bg); color: var(--llm-header); }
  .block.val { border-color: var(--val-border); }
  .block.val .block-header { background: var(--val-bg); color: var(--val-header); }
  .block.proceso { border-color: #2d4a3e; }
  .block.proceso .block-header { background: #1a3329; color: #4caf87; }
  :root[data-theme="light"] .block.proceso { border-color: #a8d5bf; }
  :root[data-theme="light"] .block.proceso .block-header { background: #eaf7f0; color: #1a6641; }
  .block.criterios { border-color: #2d3a4a; }
  .block.criterios .block-header { background: #1a2535; color: #7eb8e8; }
  :root[data-theme="light"] .block.criterios { border-color: #b8d0e8; }
  :root[data-theme="light"] .block.criterios .block-header { background: #eaf2fb; color: #1a4a6e; }

  .paso-row { display:flex; align-items:flex-start; gap:10px; margin-bottom:8px; }
  .paso-chip { flex-shrink:0; font-size:11px; font-weight:600; padding:3px 8px; border-radius:4px; cursor:pointer; border:none; }
  .paso-chip.pending { background:#333; color:#888; }
  .paso-chip.running { background:#3d2f00; color:#f0a500; }
  .paso-chip.done    { background:#1a3329; color:#4caf87; }
  .paso-chip.error   { background:#3d0000; color:#f44; }
  .paso-text { flex:1; font-size:13px; color:var(--text-1); line-height:1.5; }
  .paso-expand-btn { flex-shrink:0; font-size:11px; color:var(--text-2); background:none; border:none; cursor:pointer; padding:2px 6px; }
  .paso-output { display:none; margin-top:6px; margin-left:80px; }
  .paso-output textarea { width:100%; min-height:60px; font-size:12px; padding:8px 10px; border:1px solid var(--border); border-radius:4px; background:var(--bg); color:var(--text); font-family:inherit; resize:vertical; }
  :root[data-theme="light"] .paso-chip.pending { background:#e8e8e8; color:#666; }
  :root[data-theme="light"] .paso-chip.running { background:#fff8e0; color:#8a6000; }
  :root[data-theme="light"] .paso-chip.done    { background:#eaf7f0; color:#1a6641; }
  :root[data-theme="light"] .paso-chip.error   { background:#fff0f0; color:#c00; }
  .proceso-section-label { font-size:11px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; color:var(--text-3); margin-bottom:8px; margin-top:4px; }
  .proceso-separator { border:none; border-top:1px solid var(--border); margin:16px 0 14px; }
  .validate-btn:disabled { opacity:0.45; cursor:not-allowed; }
  .validate-btn:disabled:hover { background:var(--accent-indigo); transform:none; }

  .block-body { padding: 20px; background: var(--bg); }
  .block-body.hidden { display: none; }

  /* LLM content */
  .llm-section { margin-bottom: 18px; }
  .llm-section:last-child { margin-bottom: 0; }
  .llm-section-title {
    font-size: 11px; font-weight: 700; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--text-3); margin-bottom: 8px;
  }
  .llm-section p { font-size: 13px; color: var(--text-2); line-height: 1.6; }

  .llm-list { list-style: none; display: flex; flex-direction: column; gap: 5px; }
  .llm-list li { font-size: 13px; color: var(--text-2); padding-left: 14px; position: relative; line-height: 1.5; }
  .llm-list li::before { content: '·'; position: absolute; left: 0; color: var(--text-3); font-weight: 700; }
  .llm-list.steps { counter-reset: steps; }
  .llm-list.steps li { padding-left: 22px; }
  .llm-list.steps li::before { counter-increment: steps; content: counter(steps) '.'; font-size: 11px; font-weight: 600; color: var(--text-3); top: 1px; }

  /* Context grid */
  .ctx-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .ctx-card { background: var(--bg-2); border: 1px solid var(--border); border-radius: 5px; padding: 12px 14px; }
  .ctx-card-title { font-size: 10px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: var(--text-3); margin-bottom: 6px; }
  .ctx-card p { font-size: 12px; color: var(--text-2); line-height: 1.5; }
  .ctx-card ul { list-style: none; display: flex; flex-direction: column; gap: 3px; }
  .ctx-card ul li { font-size: 12px; color: var(--text-2); padding-left: 10px; position: relative; }
  .ctx-card ul li::before { content: '·'; position: absolute; left: 0; color: var(--text-3); }

  code { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 11.5px; background: var(--bg-3); padding: 1px 5px; border-radius: 3px; }

  .code-block {
    background: var(--bg-3); border: 1px solid var(--border); border-radius: 4px;
    padding: 10px 12px; font-family: 'SF Mono', 'Fira Code', monospace;
    font-size: 11px; color: var(--text); line-height: 1.6;
    overflow-x: auto; margin-top: 8px; white-space: pre;
  }

  .output-path {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 10px 12px; background: var(--bg-2); border: 1px solid var(--border);
    border-radius: 4px; margin-bottom: 8px;
  }
  .output-path:last-child { margin-bottom: 0; }
  .op-icon { font-size: 14px; flex-shrink: 0; margin-top: 1px; }
  .op-path { font-family: 'SF Mono', monospace; font-size: 12px; color: var(--accent-indigo); font-weight: 500; }
  .op-desc { font-size: 12px; color: var(--text-3); margin-top: 2px; }

  .template-block { background: var(--bg-2); border: 1px solid var(--border); border-radius: 4px; overflow: hidden; margin-top: 8px; }
  .template-label { padding: 6px 12px; font-size: 10px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-3); border-bottom: 1px solid var(--border); background: var(--bg-3); }

  /* Checklist */
  .checklist-group { margin-bottom: 18px; }
  .checklist-group:last-child { margin-bottom: 0; }
  .checklist-group-title {
    font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--text-3); margin-bottom: 8px; display: flex; align-items: center; gap: 6px;
  }
  .checklist-group-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  .checklist-group-header {
    background: none; border: none; padding: 0; margin: 0 0 8px; text-align: left; font-family: inherit;
    cursor: pointer; width: 100%; display: flex; align-items: center; gap: 6px;
    font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-3);
  }
  .checklist-group-header::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  .checklist-group-header:hover { color: var(--text-2); }
  .checklist-group-header .cg-toggle { font-size: 16px; opacity: 0.85; transition: transform 0.2s; flex-shrink: 0; line-height: 1; }
  .checklist-group-header.collapsed .cg-toggle { transform: rotate(-90deg); }
  .cg-body.hidden { display: none; }

  .checklist { display: flex; flex-direction: column; gap: 7px; }
  .check-item {
    display: flex; align-items: flex-start; gap: 10px; padding: 9px 12px;
    border-radius: 4px; border: 1px solid var(--border); background: var(--bg-2);
    cursor: pointer; transition: border-color 0.15s, background 0.15s;
  }
  .check-item:hover { border-color: var(--accent-amber); }
  .check-item.checked { border-color: var(--accent-emerald); background: rgba(16,185,129,0.05); }
  .check-box {
    width: 15px; height: 15px; border-radius: 3px; border: 1.5px solid var(--border);
    flex-shrink: 0; margin-top: 1px; display: flex; align-items: center; justify-content: center;
    font-size: 9px; color: transparent; transition: all 0.15s;
  }
  .check-item.checked .check-box { background: var(--accent-emerald); border-color: var(--accent-emerald); color: #fff; }
  .check-text { font-size: 13px; color: var(--text-2); line-height: 1.5; flex: 1; }
  .check-item.checked .check-text { color: var(--text-3); text-decoration: line-through; text-decoration-color: var(--accent-emerald); }

  /* Decisions */
  .decisions { display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px; }
  .decision-item { padding: 12px 14px; border-radius: 4px; border: 1px solid var(--border); background: var(--bg-2); }
  .decision-q { font-size: 13px; font-weight: 500; color: var(--text); margin-bottom: 8px; }
  .decision-opts { display: flex; gap: 6px; flex-wrap: wrap; }
  .decision-opt {
    padding: 4px 12px; border-radius: 12px; font-size: 12px; font-weight: 500;
    border: 1px solid var(--border); cursor: pointer; color: var(--text-2);
    background: var(--bg); transition: all 0.15s;
  }
  .decision-opt:hover { border-color: var(--accent-indigo); color: var(--accent-indigo); }
  .decision-opt.selected { background: var(--accent-indigo); border-color: var(--accent-indigo); color: #fff; }

  .notes-label { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-3); margin-bottom: 6px; margin-top: 18px; }
  .notes-area {
    width: 100%; min-height: 68px; padding: 10px 12px;
    border: 1px solid var(--border); border-radius: 4px;
    background: var(--bg); color: var(--text); font-family: inherit; font-size: 13px;
    line-height: 1.5; resize: vertical; margin-bottom: 14px; transition: border-color 0.15s;
  }
  .notes-area:focus { outline: 2px solid var(--accent-indigo); outline-offset: 0; border-color: var(--accent-indigo); }
  .notes-area::placeholder { color: var(--text-3); }

  .validate-btn {
    display: inline-flex; align-items: center; gap: 8px; padding: 8px 18px;
    border-radius: 5px; border: none; cursor: pointer; font-size: 13px; font-weight: 600;
    font-family: inherit; background: var(--accent-indigo); color: #fff;
    transition: background 0.15s, transform 0.1s;
  }
  .validate-btn:hover { background: #5254cc; }
  .validate-btn:active { transform: scale(0.98); }
  .validate-btn.validated { background: var(--accent-emerald); cursor: default; }
  .validate-btn.validated:hover { background: var(--accent-emerald); }

  .empty-state {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 50vh; color: var(--text-3); text-align: center;
  }
  .empty-state .es-icon { font-size: 36px; margin-bottom: 10px; opacity: 0.35; }
  .empty-state p { font-size: 14px; }

  /* ── REF BLOCKS ── */
  .block.ref { border-color: #30363d; }
  .block.ref .block-header { background: #161b22; color: #8b949e; }
  :root[data-theme="light"] .block.ref { border-color: var(--border); }
  :root[data-theme="light"] .block.ref .block-header { background: var(--bg-2); color: var(--text-2); }
  /* ── MD BLOCK ── */
  .block.md { border-color: #30363d; }
  .block.md .block-header { background: #161b22; color: #8b949e; }
  :root[data-theme="light"] .block.md { border-color: var(--border); }
  :root[data-theme="light"] .block.md .block-header { background: var(--bg-2); color: var(--text-2); }
  @media (prefers-color-scheme: light) {
    .block.md { border-color: var(--border); }
    .block.md .block-header { background: var(--bg-2); color: var(--text-2); }
  }

    ] }], decisions: [] } },
  { id: 3, title: "act_cx_resources_deploy_cloudrun.py", subtitle: "Construye el backend del pipeline — los 5 pasos y las capacidades sueltas que el panel solo simula, hechos realidad", tag: "py", tagLabel: ".py", llm: { objetivo: "Esta fase construye <code>act_cx_resources_deploy_cloudrun.py</code>, el script que va a ejecutar de verdad los 5 pasos que hoy <code>act_cx_resources_deploy_v2.html</code> simula con datos de mentira — y también las 4 capacidades que no pertenecen a ningún paso numerado (Descubrimiento, Vincular agente y repositorio, Versiones existentes, desplegar un resource suelto), porque la Fase 5 va a exigir que el servidor delegue en funciones de este módulo para las 9, no solo para los 5 pasos. Antes de escribir una línea, lee ese panel entero — su parte visual y su pestaña Specs — porque ahí está descrito con detalle qué hace cada paso, qué produce, y qué escribe y dónde. El panel es la especificación; esta fase la hace real.", reglas: [
        '<strong>0. No son solo 5 funciones — son 9.</strong> Además de una función por paso, esta fase construye una función para cada una de las 4 capacidades sueltas: Descubrimiento (lista proyectos y agentes), Vincular agente y repositorio (S22 — crea la estructura, registra el mapeo en Firestore, detecta la región, hace el pull inicial), Versiones existentes (lista y borra), y desplegar un resource suelto (S20). Sin esto, la Fase 5 se encuentra con 4 endpoints que no tienen dónde delegar, y su propio criterio de "no reimplementar lógica en el endpoint" queda imposible de cumplir tal cual.',
        '<strong>1. La especificación completa está en el panel — léelo entero antes de escribir código.</strong> act_cx_resources_deploy_v2.html, su parte visual y su pestaña Specs, describe paso a paso qué hace cada uno, qué produce, qué escribe y dónde, cómo se recalcula el diff al entrar a un paso, cómo se comporta un fallo a medias, cómo se detecta la región la primera vez que se vincula un agente, y el orden estricto de las tres acciones del Paso 5. Constrúyelo tal como está descrito ahí — es la especificación, no una guía aproximada. No repitas aquí lo que ya está dicho con detalle en el panel. Si encuentras una contradicción entre la parte visual/interacción/estados y la pestaña Specs, para — no decidas tú cuál de las dos tiene prioridad. Propón una resolución sencilla, en lenguaje natural, con su justificación, y espera confirmación antes de construir sobre ella.',
        '<strong>2. El registro de cada paso se emite en vivo, no de golpe al terminar.</strong> Esto no está escrito como requisito técnico en el panel — se deduce de que el registro se ve llenar una caja de tamaño fijo mientras el paso corre. Tradúcelo a un backend que va mandando lo que hace según lo hace, no uno que devuelve un resultado final único.',
        '<strong>3. Mientras un paso que escribe está corriendo, hace falta un candado real de concurrencia.</strong> Tampoco está como requisito técnico explícito — se deduce de que el panel bloquea el resto de la interfaz mientras se escribe. Sin un candado de verdad en el backend, dos escrituras podrían solaparse aunque el panel visualmente lo impida.',
        '<strong>4. Ningún archivo de esta fase tiene una constante de módulo para proyecto, agente o región — los tres se reciben siempre como parámetro.</strong> El panel no habla de esto, es una regla de arquitectura del código.',
        '<strong>5. 13 tipos de recurso, no 12.</strong> La lista completa incluye Transition Route Groups — el panel tampoco enumera esto, viene de la verificación contra la API real.',
        '<strong>6. Nomenclatura y clonado, según Constraints.</strong> Todo lo que se cree en esta fase lleva el sufijo cloudrun, y lo que se reutilice del pipeline local se clona, nunca se importa directo. No es del panel — ya está firmado en Constraints, aquí es donde se aplica por primera vez.'
      ], leer: ['act_cx_resources_deploy_v2.html — completo, visual y Specs. Es la fuente de todo lo de arriba.', 'docs/cloudrun_diseno_servidor.md — las decisiones S1 a S23 que estas reglas dan por hechas.', 'act/utils/cx_client.py y act/utils/cx_payloads.py — como referencia para clonar su lógica, no para importarlos.', 'CLAUDE.md §3 — los constraints de headers y Full Update siguen vigentes; el de autenticación local (gcloud auth print-access-token) no aplica aquí, se usa ADC.'], outputs: [{ path: 'act/act_cx_resources_deploy_cloudrun.py', desc: 'El backend de los 5 pasos y las 4 capacidades sueltas' }, { path: 'act/utils/cx_client_cloudrun.py', desc: 'Clon de la capa de conexión' }, { path: 'act/utils/cx_payloads_cloudrun.py', desc: 'Clon de la capa de adaptación' }, { path: 'act/tests/test_cx_payloads_cloudrun.py', desc: 'Tests sin red del clon de payloads' }], pasos: [] }, val: { grupos: [
      { title: "Construcción · Automático (LLM)", items: [
        { criterio: "El script se importa sin errores (python -c 'import act_cx_resources_deploy_cloudrun')", porQue: "Confirma que la sintaxis y los imports son correctos antes de pasar a la Fase 4." },
        { criterio: "Existen 9 funciones con la firma esperada: una por cada uno de los 5 pasos, más Descubrimiento, Vincular agente y repositorio, Versiones existentes, y desplegar un resource suelto", porQue: "La Fase 5 (server_cloudrun.py) exige que sus 9 endpoints deleguen en una función de este módulo, sin excepción — si faltan las 4 sueltas, la Fase 5 se queda sin dónde delegarlas." },
        { criterio: "La función de desplegar un resource suelto no tiene, en ningún camino de código, forma de construir una URL que contenga /environments/ — solo sabe llamar al borrador", porQue: "Es la garantía de seguridad de esa capacidad (S20): no puede alcanzar producción aunque se le pida, porque el código nunca aprendió a escribir esa URL." },
        { criterio: "Ningún archivo tiene una constante de módulo para proyecto, agente o región — los tres llegan siempre por parámetro", porQue: "Es la propiedad que hace posible el multi-proyecto/multi-agente/multi-región — si sobrevive una constante fija, todo lo demás (selectores, descubrimiento, autodetección) queda operando sobre un destino que en realidad no cambia." },
        { criterio: "python -m pytest act/tests/test_cx_payloads_cloudrun.py pasa en verde sin conexión a red", porQue: "Es la comprobación directa del estándar 'pruebas aisladas por pieza' de la Fase 1 — si necesita red para pasar, no está probando la función pura, está probando la API." },
        { criterio: "Dos llamadas seguidas al Paso 3, contra el agente desechable, con datos distintos en CX, devuelven diffs distintos", porQue: "Confirma que el diff se recalcula fresco en cada llamada y no se reutiliza nada guardado de una ejecución anterior (Regla 1)." }
      ]}
    ], decisions: [] } },
  { id: 4, title: "validate_pipeline_cloudrun.py", subtitle: "Smoke test del pipeline en 6 niveles, de estático a Cloud Run real — todo sin necesitar el panel conectado", tag: "py", tagLabel: ".py", llm: { objetivo: "Esta fase construye act/validate_pipeline_cloudrun.py — el script que verifica que act_cx_resources_deploy_cloudrun.py (Fase 3) funciona de verdad, en niveles de riesgo creciente, contra un agente y un repositorio desechables — nunca contra Petal. Nada de esto requiere un panel conectado: eso no existe hasta la Fase 7, así que cada verificación se ejecuta por CLI o llamando directamente a las funciones del pipeline, nunca haciendo clic en algo. La validación de extremo a extremo a través del panel real queda para la Fase 8.", reglas: [
        'Nivel 0 — Estático, sin red ni credenciales reales. Atrapa violaciones de arquitectura antes de gastar una sola llamada API — si esto falla, ningún nivel posterior es de fiar.',
        'Nivel 1 — Solo lectura, contra CX y el repositorio reales, usando el agente desechable. Cero riesgo, se puede correr con la frecuencia que se quiera.',
        'Nivel 2 — Simulación (dry-run). No escribe nada real en CX ni en el repositorio salvo, como mucho, una escritura de prueba reversible para validar que el plan simulado coincide con la ejecución real.',
        'Nivel 3 — Escritura real automatizada, contra un agente y repositorio desechables. Cubre los 4 pasos que escriben, incluida la publicación en producción — automatizada por CLI, sin ningún panel de por medio.',
        'Nivel 4 — Fallo inyectado y concurrencia (caos). El nivel que existe específicamente para encontrar lo que no se nota: residuos, candados colgados, fugas de datos entre agentes.',
        'Nivel 5 — Cloud Run real, en staging. Todos los niveles anteriores corren en la máquina de Jero o en el mismo proceso — nunca contra un servicio de Cloud Run desplegado de verdad. Este nivel repite una parte de los Niveles 3 y 4 contra un servicio real de staging (nunca producción), con la identidad del Service Account de runtime real y sus roles reales, para atrapar lo que solo puede fallar ahí: IAM insuficiente que el gcloud personal de Jero no tiene, variables de entorno ausentes, y sobre todo instancias físicamente distintas — no simuladas en el mismo proceso — escribiendo en paralelo.'
      ], leer: ['act/act_cx_resources_deploy_cloudrun.py — construido en Fase 3, es lo que este script verifica.', 'act_cx_resources_deploy_v2.html — para conocer el comportamiento esperado de cada paso.'], outputs: [{ path: 'act/validate_pipeline_cloudrun.py', desc: 'Smoke test en 6 niveles del backend de la Fase 3, del análisis estático a Cloud Run real' }], pasos: [] }, val: { grupos: [
      { title: "Nivel 0 — Estático · Automático (script)", items: [
        { criterio: "Ningún literal de proyecto, agente o región real aparece hardcodeado fuera de tests/fixtures", porQue: "Es la regresión más fácil de reintroducir sin darse cuenta al portar lógica desde el pipeline local, que sí estaba atado a Petal." },
        { criterio: "Invocar cualquier función de entrada sin project/agent/region explícitos falla con error claro, nunca cae a un valor por defecto real", porQue: "Un default silencioso convierte un test de otro agente en una escritura real sobre Petal." },
        { criterio: "El documento de Firestore del candado, del mapeo agente→repositorio y de la región tiene un esquema con campos obligatorios — un documento incompleto hace fallar el arranque", porQue: "Continuar con un campo faltante como None implícito es exactamente el tipo de fallo que no se nota hasta que ya causó daño." },
        { criterio: "Ningún archivo temporal usa una ruta fija o predecible solo por nombre de agente — cada invocación usa un identificador único", porQue: "Dos peticiones concurrentes para el mismo agente en el mismo contenedor reutilizado colisionarían si comparten ruta." },
        { criterio: "Ningún log interpola el token de acceso completo ni el token de GitHub", porQue: "Los logs de Cloud Run se comparten entre invocaciones del mismo servicio — una fuga de token en logs es un problema de seguridad, no solo de higiene." },
        { criterio: "Se confirma explícitamente si gcloud auth print-access-token funciona dentro de un contenedor Cloud Run sin sesión interactiva, o si hace falta ADC puro — no se asume la respuesta", porQue: "El CLAUDE.md fija esa regla para ejecución local; en Cloud Run puede no haber gcloud instalado ni una identidad interactiva. Es una asunción sin verificar, exactamente el tipo que se rompe en silencio la primera vez que falta." }
      ]},
      { title: "Nivel 1 — Solo lectura · Automático (script)", items: [
        { criterio: "Auth válido, conectividad con CX, LIST completa para los 13 tipos sin errores", porQue: "Base mínima antes de confiar en cualquier resultado de niveles posteriores." },
        { criterio: "Un recurso con displayName cambiado pero mismo cx_id sigue emparejando con su entrada existente en el repositorio", porQue: "Si el emparejamiento cae a nombre como fallback silencioso, un rename en CX produce un duplicado fantasma en el repositorio." },
        { criterio: "Dos recursos con nombres colisionantes (mismo displayName, distinto cx_id) no se confunden entre sí", porQue: "Es el caso adversarial directo del emparejamiento por tipo + cx_id — si falla, falla justo donde más importa." },
        { criterio: "Un recurso presente en el repositorio pero ausente en CX se reporta como categoría propia, no se ignora ni se confunde con 'nuevo en CX'", porQue: "Puede significar que alguien lo borró directamente desde la consola de CX — tratarlo como 'nuevo' generaría un intento de creación duplicada." },
        { criterio: "Correr el Paso 1 contra dos pares proyecto+agente distintos en el mismo proceso no contamina el inventario de uno con el del otro", porQue: "Es la prueba directa de que no sobrevive ninguna variable de estado compartida entre invocaciones." },
        { criterio: "La región se lee de Firestore y no se vuelve a sondear en una segunda ejecución sobre el mismo agente — verificado contando las llamadas de sondeo", porQue: "El sondeo de región prueba las 17 regiones reales — repetirlo en cada ejecución sería lento y ruidoso sin necesidad." },
        { criterio: "Un valor de región inválido en Firestore falla con un error claro de región inconsistente, no con un 404 críptico de la API", porQue: "Un error sin contexto deja a quien lo depura sin pistas de por dónde empezar." },
        { criterio: "Cero llamadas de escritura durante todo el paso, verificado por instrumentación del cliente HTTP, no por inspección del código", porQue: "Inspeccionar el código para confirmar 'solo lectura' es fiarse de que nadie añadió una llamada de escritura sin darse cuenta — instrumentar lo prueba de verdad." },
        { criterio: "Ejecutar sin --project o sin --agent termina con un mensaje claro, nunca con un valor por defecto", porQue: "Es la prueba de que no sobrevive ninguna constante oculta de un agente fijo." }
      ]},
      { title: "Nivel 2 — Dry-run · Automático (script)", items: [
        { criterio: "El plan de dry-run y la ejecución real producen exactamente el mismo diff sobre el mismo estado de entrada", porQue: "Un dry-run que miente sobre lo que va a pasar no sirve de nada como previsualización." },
        { criterio: "El modo dry-run nunca invoca al cliente HTTP real — reutiliza el inventario ya leído en el Paso 1", porQue: "Si dry-run vuelve a leer con permisos de escritura activados por accidente, deja de ser seguro ejecutarlo sin cuidado." },
        { criterio: "Un recurso modificado a la vez en CX (fuera del pipeline) y en el repositorio se señala como conflicto explícito, nunca se resuelve arbitrariamente a favor de un lado", porQue: "Resolver un conflicto en silencio puede perder un cambio hecho a propósito por otra vía." },
        { criterio: "El plan respeta Full Update sin updateMask para Playbooks y updateMask obligatorio para Environments — forzar el camino equivocado falla el dry-run antes de llegar a la API real", porQue: "Detectarlo en dry-run es gratis; detectarlo en el Paso 3 real ya cuesta una escritura fallida." },
        { criterio: "Marcar un borrado durante el dry-run no borra nada — el recurso sigue intacto en CX al terminar", porQue: "Dry-run significa que nada se toca de verdad, sin excepciones." },
        { criterio: "Si no hay cambios, el pipeline lo dice claramente y no continúa como si hubiera algo que aplicar", porQue: "Continuar con una lista vacía desperdicia el paso siguiente sin ningún propósito." }
      ]},
      { title: "Nivel 3 — Escritura real automatizada, en el agente desechable · Automático (script)", items: [
        { criterio: "Traer al repositorio deja un único commit por operación, usando la API de Git Data (árbol/commit) y no N llamadas de la Contents API", porQue: "La Contents API por archivo no es atómica — puede dejar un commit a medias si el proceso muere entre un archivo y el siguiente." },
        { criterio: "Repetir la misma operación de traer al repositorio sin cambios intermedios no produce un segundo commit", porQue: "Confirma que el paso es idempotente, no solo que funciona la primera vez." },
        { criterio: "Una operación conocida por fallar en silencio (versión sin displayName) se detecta por polling real a GET /operations/{id}, nunca se da por buena solo por el 200 inicial", porQue: "Es la comprobación directa del workaround del bug de code:3 silencioso — sin esto, el bug puede reaparecer sin que nada lo note." },
        { criterio: "Full Update en un Playbook con event handlers implícitos no borra esos handlers — verificado con un diff del objeto en CX antes y después", porQue: "Es la reproducción exacta del bug ya documentado (borrar sys.no-match-default) — si el mecanismo GET completo → modificar → PUT completo no está bien implementado, este test lo demuestra con evidencia concreta." },
        { criterio: "Un PATCH de Environment sin updateMask falla limpio y se captura como error esperado, no como fallo inexplicable", porQue: "Es la confirmación positiva del comportamiento inverso al de Playbooks — Environments exige la máscara." },
        { criterio: "Repetir los dos checks anteriores (Full Update en Playbooks, updateMask obligatorio en Environments) contra un agente desechable en una región distinta de europe-west1 — confirmar si el comportamiento se reproduce igual, es distinto, o no existe", porQue: "El bug de Full Update solo está verificado en europe-west1. Con la región autodetectada, el pipeline puede terminar operando de verdad contra un agente en otra región — sin esta prueba, ese día sería la primera vez que se descubre el comportamiento real." },
        { criterio: "Antes y después de aplicar cambios en el Paso 3, el puntero de producción del agente desechable no cambia", porQue: "El Paso 3 escribe solo en el borrador — cualquier cambio en producción aquí sería un error grave." },
        { criterio: "Un cambio en Agent Config o Generator se refleja de inmediato en el entorno de producción del agente desechable, y el pipeline lo expone como advertencia explícita antes de aplicar", porQue: "Estos tipos no admiten versión — el usuario tiene que saberlo antes de confirmar, no descubrirlo después." },
        { criterio: "Aplicar el mismo diff dos veces seguidas produce el mismo estado final en CX, sin duplicar recursos ni reenviar un create ya aplicado", porQue: "Es la idempotencia del CLAUDE.md llevada a un caso end-to-end, no solo unitario." },
        { criterio: "Publicar en producción, llamando directamente a la función del Paso 5 contra el agente desechable sin ningún panel de por medio: las tres acciones (fusión, versión, apuntar entorno) ocurren en ese orden exacto, verificado por código", porQue: "Es la automatización explícita de lo que antes se pensaba como verificación manual — no hace falta un panel para confirmar el orden de tres llamadas." },
        { criterio: "Publicar dos veces seguidas sobre el mismo commit ya publicado es no-op seguro — no crea una segunda versión ni falla de forma confusa", porQue: "Un reintento accidental del Paso 5 no debería tener ningún efecto visible si ya se completó." },
        { criterio: "Cada uno de los 13 tipos de recurso se prueba con al menos un create, un update y un delete reales contra el agente desechable — no solo los 4 que ya se sabe que tienen comportamiento especial (Playbooks, Environments, Agent Config, Generators)", porQue: "Los tipos menos comunes podrían tener su propio comportamiento peculiar que nunca se descubre si solo se prueban los ya conocidos." }
      ]},
      { title: "Nivel 4 — Fallo inyectado y concurrencia (caos) · Automático (script)", items: [
        { criterio: "Matar el proceso con SIGKILL (no una excepción capturable) a mitad de una escritura del Paso 3 — el candado de Firestore se libera solo por expiración de un TTL/heartbeat, nunca porque el código alcanzó a ejecutar un bloque de liberación", porQue: "Un contenedor de Cloud Run terminado abruptamente (autoscaling, nueva revisión) no ejecuta ningún finally. Sin TTL, el agente queda bloqueado para siempre — el residuo más grave posible." },
        { criterio: "Forzar un fallo a partir del recurso 3 de un lote de 5 en el Paso 3 — el reintento solo reenvía llamadas HTTP para los recursos 3, 4 y 5, confirmado por instrumentación", porQue: "Confirmarlo solo por el resultado final puede ocultar que también se reenviaron 1 y 2 sin efecto observable porque son idempotentes — eso esconde un bug real de tracking." },
        { criterio: "El progreso por-recurso de un lote vive en Firestore, nunca en memoria del proceso ni en disco local — simular un contenedor nuevo recuperando el reintento y confirmar que recupera el estado correcto", porQue: "Un contenedor de Cloud Run reiniciado no conserva memoria ni disco — el estado tiene que sobrevivir en un sitio externo." },
        { criterio: "Dos invocaciones concurrentes sobre el mismo agente — exactamente una procede, la otra se rechaza o se encola explícitamente, y ninguna de las dos deja el candado tomado al terminar", porQue: "Es la prueba directa de que el candado de concurrencia (S13/S13b) cumple su función bajo contención real, no solo en el caso feliz de una sola petición." },
        { criterio: "Ejecutar el Agente A completo y luego el Agente B en el mismo proceso — ningún archivo temporal, token o cabecera x-goog-user-project de A se filtra a B", porQue: "Es el riesgo específico de Cloud Run: un contenedor reutilizado entre peticiones de agentes distintos. Un valor cacheado a nivel de módulo en vez de por-petición es el tipo de bug que solo aparece con dos agentes reales." },
        { criterio: "Forzar fallo entre crear versión y apuntar el entorno en el Paso 5 — la versión huérfana no se interpreta como estado activo en ningún cálculo posterior, y el reintento apunta el entorno a la versión ya creada en vez de crear una nueva", porQue: "Sin esto, un fallo a mitad del Paso 5 puede dejar CX en un estado ambiguo que ningún reintento sabe resolver limpio." },
        { criterio: "El gate del Paso 4 queda atado al commit/draft exacto que se aprobó — si algo cambia después de aprobar y antes de publicar, el Paso 5 lo detecta y aborta", porQue: "Sin esto, aprobar el commit X y luego publicar Y (porque cambió algo entre medias sin pasar por el pipeline) publicaría algo que nadie validó realmente." }
      ]},
      { title: "Nivel 5 — Cloud Run real, en staging · Automático (script)", items: [
        { criterio: "Desplegar el contenedor a un servicio de Cloud Run de staging real (nunca producción) y repetir el Paso 3 (aplicar) contra el agente desechable — con el Service Account de runtime real, no la sesión gcloud personal de Jero", porQue: "El Service Account de runtime puede tener permisos distintos a la sesión personal usada en local — es la única forma de descubrir un problema de IAM antes de que ocurra en el primer despliegue real." },
        { criterio: "Confirmar que todas las variables de entorno que el servidor espera (PORT, ALLOWED_ORIGIN, credenciales) llegan inyectadas por la plataforma, no por un .env local que no existe en Cloud Run", porQue: "Un valor que solo funciona porque local tiene un .env de conveniencia es un fallo que aparece la primera vez en producción, no en ningún test anterior." },
        { criterio: "Lanzar dos peticiones de escritura concurrentes sobre el mismo agente desde dos revisiones o instancias físicamente distintas del servicio de staging — no dos llamadas en el mismo proceso", porQue: "El Nivel 4 ya probó la concurrencia dentro de un mismo proceso — este nivel prueba que el candado de Firestore sigue funcionando igual entre instancias que ni siquiera comparten memoria." }
      ]},
      { title: "Scope · Automático (script)", items: [
        { criterio: "git diff HEAD sobre act/utils/cx_client.py, act/utils/cx_payloads.py, act/act_cx_resources_deploy.py y act/server.py no devuelve ninguna diferencia", porQue: "Son archivos del pipeline local — esta fase no debía tocarlos en ningún momento, solo clonarlos." }
      ]}
    ], decisions: [] } },
  { id: 5, title: "server_cloudrun.py", subtitle: "Servidor Flask para Cloud Run — reemplaza server.py local, corre en la nube", tag: "py", tagLabel: ".py", llm: { objetivo: "Esta fase construye act/server_cloudrun.py, el servidor Flask que expone por HTTP el pipeline construido en la Fase 3, pensado para correr en Cloud Run. Tres diferencias clave respecto a un servidor local: autenticación hacia CX vía ADC en vez de sesión personal de gcloud, acceso al repositorio vía la GitHub App en vez de disco local, y empaquetado como contenedor Docker. La lógica del pipeline no cambia — importa las funciones de act_cx_resources_deploy_cloudrun.py, nunca las reimplementa.", reglas: [
      '<strong>1. Los endpoints que expone, y solo esos.</strong> Cinco numerados, uno por paso — <code>POST /step/1</code> a <code>/step/5</code> — más tres que no pertenecen a ningún paso: Descubrimiento (rellena los desplegables de proyecto y agente), Vincular agente y repositorio (el onboarding, S22) y Versiones existentes (listar y borrar). Además, el de desplegar un resource suelto (S20), <code>POST /deploy-resource</code>. Los que escriben reciben <code>{project, agent}</code> obligatorios en cada llamada — si falta alguno, 400 con mensaje claro, nunca un valor por defecto. El servidor no guarda estado entre peticiones: Cloud Run puede matar y rearrancar la instancia en cualquier momento.',
      '<strong>2. Auth hacia CX: ADC, no gcloud auth print-access-token.</strong> En Cloud Run no hay sesión humana interactiva. Usar google.auth.default() con scope cloud-platform — verificado a nivel de API que funciona igual que gcloud auth print-access-token (200 OK) siempre que se mande la cabecera x-goog-user-project; sin ella, 403. Lo que todavía no está verificado es que esto funcione igual dentro de un contenedor Cloud Run real, sin sesión interactiva — confírmalo en el Nivel 5 de la Fase 4 antes de darlo por cerrado. Es la excepción documentada a la regla de CLAUDE.md que prohíbe google.auth.default() — aplica solo a este servidor, nunca al local.',
      '<strong>3. Auth hacia GitHub: GitHub App, tokens de corta duración.</strong> Crear act/utils/github_app_client_cloudrun.py con una función que en cada llamada lee la clave privada del secreto en Secret Manager, genera un JWT firmado con el App ID de la GitHub App ya creada, pide un installation token, y lo devuelve. Nunca se almacena entre peticiones — se genera en el momento. El token dura aproximadamente una hora; si la operación tarda más, se regenera.',
      '<strong>4. Puerto 8080.</strong> Cloud Run inyecta la variable PORT — el servidor escucha en esa variable, con 8080 como valor por defecto si no está presente. Nunca un puerto fijo distinto, como el 5000 del servidor local.',
      '<strong>5. CORS: URL de Cloud Run, nunca hardcodeada.</strong> El origen permitido se lee de una variable de entorno.',
      '<strong>6. El candado de concurrencia vive en Firestore — nunca se asume por la infraestructura de Cloud Run.</strong> Verificado contra la documentación real: una sola instancia de Cloud Run NO reproduce un candado global — encola las peticiones, no las rechaza. Sin un candado explícito, dos peticiones concurrentes sobre el mismo agente se procesarían una detrás de otra en vez de que la segunda se rechace — el efecto es distinto, y puede dejar corriendo un deploy que Jero cree cancelado. Todos los endpoints que escriben pasan por este candado, sin excepción — es el mismo mecanismo S13/S13b que valida la Fase 4.',
      '<strong>7. El descubrimiento de proyecto incluye el repositorio asignado.</strong> El endpoint de Descubrimiento devuelve, para cada agente, el repositorio que le corresponde según el mapeo en Firestore (S4) — si un agente no tiene repositorio vinculado, se incluye igual en la lista pero sin repositorio, nunca se omite en silencio.',
      '<strong>8. Dockerfile obligatorio, con su nombre literal.</strong> Es el único archivo de esta fase que no lleva el sufijo cloudrun — Docker exige ese nombre exacto por convención. Base python:3.11-slim, instala requirements.txt, copia act/, expone el puerto 8080, entrypoint python act/server_cloudrun.py. Sin credenciales en la imagen — las gestiona Cloud Run en tiempo de ejecución.',
      '<strong>9. Los endpoints devuelven JSON con estructura {status, log, data}.</strong> El mismo sobre de respuesta para todos los endpoints, sin excepción — el panel espera ese formato exacto.',
      '<strong>10. La región no es una constante — se resuelve por agente vía Firestore, igual que en la Fase 3.</strong> El servidor nunca asume europe-west1 como fija; la consulta para el agente y proyecto de cada petición.',
      '<strong>11. Esta fase construye el servidor de forma aislada.</strong> La conexión real del panel HTML es trabajo de la Fase 7 — aquí basta con que el servidor responda correctamente a peticiones directas (curl) con Docker corriendo en local.'
    ], leer: [
      'docs/cloudrun_diseno_servidor.md — completo. Es la fuente de verdad de toda esta fase, incluida la infraestructura ya creada (§14).',
      'act/server.py — como referencia para clonar su lógica de endpoints, nunca para importarlo.',
      'act/act_cx_resources_deploy_cloudrun.py — funciones que importa el servidor. Entender la firma de cada una antes de escribir los endpoints.',
      'act_cx_resources_deploy_v2.html — qué datos espera cada pantalla en la respuesta del servidor, para construir el campo data de cada endpoint acorde.'

        { criterio: "Los endpoints existen y delegan en una función de act_cx_resources_deploy_cloudrun.py — ninguno reimplementa lógica dentro del propio endpoint", porQue: "server_cloudrun.py es un adaptador HTTP, no un segundo pipeline. Si reimplementa lógica, hay dos fuentes de verdad que pueden divergir." },
        { criterio: "El módulo de la GitHub App lee el secreto de Secret Manager, genera el JWT y devuelve un token — nunca lo almacena en una variable de módulo", porQue: "Un token almacenado caduca en silencio. Regenerarlo en cada llamada garantiza que siempre es válido." },

  { id: 6, title: "validate_server_cloudrun.py", subtitle: "Smoke test del servidor Flask — valida los endpoints antes de conectar el HTML, sin dejar residuo", tag: "py", tagLabel: ".py", llm: { objetivo: "Esta fase construye act/validate_server_cloudrun.py — smoke test automático que arranca server_cloudrun.py, golpea cada endpoint con peticiones HTTP reales y verifica que responde con el formato correcto. Existe porque el servidor es una capa nueva entre el HTML y el pipeline — puede fallar por razones que validate_pipeline_cloudrun.py (Fase 4) no cubre: puerto mal configurado, CORS roto, JSON mal formado, un endpoint que no llama a la función correcta. Todo se ejecuta por script, sin ningún paso manual, contra un agente y repositorio desechables — nunca contra Petal, ni siquiera para las pruebas de solo lectura — y ninguna corrida puede dejar residuo.", reglas: [
      '<strong>1. Arrancar el servidor como subproceso y cerrarlo siempre, incluso si se cuelga.</strong> No basta con matarlo cuando el proceso muere por su cuenta — si arranca pero no responde a tiempo, también hay que matarlo antes de fallar el test. Un arranque colgado que no se limpia deja un proceso huérfano ocupando el puerto para la siguiente corrida.',
      '<strong>2. Para cada endpoint (los 5 numerados, los 3 sin numerar, y el de resource suelto): 200, JSON válido, con status, log y data.</strong>',
      '<strong>3. JSON mal formado en el body responde 400 con mensaje claro, nunca un 500 crudo.</strong> Es uno de los motivos declarados de esta fase — hay que probarlo de verdad, no darlo por hecho.',
      '<strong>4. CORS se verifica en la respuesta real y en el preflight OPTIONS.</strong> Un panel en otro origen dispara primero un OPTIONS antes de la petición real — si el servidor no lo maneja, el navegador bloquea la llamada aunque la respuesta POST llevara la cabecera correcta.',
      '<strong>5. dry_run se verifica comparando el estado antes y después, no solo confiando en lo que el servidor dice que hizo.</strong> Que el servidor devuelva éxito no prueba que no escribió nada — hay que comprobarlo leyendo el resultado.',
      '<strong>6. Conexión real: para todos los endpoints, sin excepción, invocar la función del pipeline directamente y comparar su resultado contra lo que devuelve el endpoint.</strong> Esto va contra el agente y repositorio desechables, nunca contra Petal — ni siquiera los endpoints de solo lectura, porque comparar contra un agente real que puede cambiar entre las dos llamadas produce falsos fallos por condición de carrera, además de ser justo lo que la restricción de seguridad prohíbe.',
      '<strong>7. Cero residuo: nombre predecible con ID de corrida.</strong> Todo recurso que el test crea (versión, commit) lleva un prefijo fijo más un identificador de la corrida — permite saber qué borrar y de qué ejecución es, incluso si dos corridas se solapan.',
      '<strong>8. Cero residuo: barrido al empezar, no solo al terminar.</strong> Antes de crear nada, el script busca y borra cualquier recurso con el prefijo de corridas anteriores. Un finally no protege contra un SIGKILL real — el residuo de una corrida que murió a medias se limpia en la siguiente, no se acumula para siempre.',
      '<strong>9. Cero residuo: el bloque de escritura corre dentro de un try/finally que limpia de verdad.</strong> Al terminar (o al fallar), borra el recurso creado en CX y verifica el borrado leyendo el resultado — nunca fiándose del código HTTP. Revierte el repositorio desechable a su estado previo. Libera el candado de Firestore explícitamente, sin depender solo del TTL.',
      '<strong>10. Un test dedicado mata el servidor con SIGKILL a mitad de una escritura.</strong> Esperado: el candado de Firestore se libera por TTL, no queda ninguna versión a medio crear, y la siguiente corrida del smoke test arranca limpia. Es el mismo criterio que ya se exigió para el pipeline en la Fase 4, aplicado ahora a la capa HTTP.',
      '<strong>11. Ninguna operación asíncrona queda huérfana si el cliente de test hace timeout.</strong> Si el test deja de esperar una respuesta mientras el servidor sigue poleando una operación larga, hay que comprobar si esa operación remota sigue viva antes de dar la prueba por cerrada — puede terminar creando la versión igualmente, después de que el test ya haya reportado fallo.',
      '<strong>12. El check de permisos prueba comportamiento real, nunca un grep del código fuente.</strong> Buscar una cadena de texto en server_cloudrun.py pasa aunque el código sea inalcanzable o esté mal manejado — hay que forzar el caso y observar la respuesta real.',
      '<strong>13. La provisión del agente y repositorio desechables es un paso de infraestructura de una sola vez, separado del test.</strong> El smoke test asume que ya existen y usa su identificador — documentar cómo se crean, igual que el proyecto ya documenta el comando IAM manual de onboarding (S11), no improvisarlo dentro del propio test.'
    ], leer: [
      'act/server_cloudrun.py — Fase 5. Entender los endpoints antes de escribir los tests.',
      'act/validate_pipeline_cloudrun.py — Fase 4. Reutilizar el mismo patrón de niveles y el mismo criterio de cero residuo, no inventar uno nuevo.',
      'docs/cloudrun_diseno_servidor.md — S13/S13b (candado de concurrencia) y el hallazgo H4 sobre el límite de versiones por playbook, relevante para no agotar la cuota del agente desechable en corridas repetidas.'
    ], outputs: [{ path: 'act/validate_server_cloudrun.py', desc: 'Smoke test del servidor, en corridas automáticas sin residuo' }], pasos: [] }, val: { grupos: [
      { title: "Arranque y cierre · Automático (script)", items: [
        { criterio: "El servidor arranca como subproceso y el script lo cierra siempre al terminar, incluso si un test falla", porQue: "Sin cierre garantizado, un test fallido deja el puerto ocupado y bloquea la siguiente corrida." },
        { criterio: "Si el arranque se cuelga sin responder antes del timeout, el subproceso se mata igual, no solo cuando muere por su cuenta", porQue: "Un arranque colgado sin limpiar es un proceso huérfano — el mismo problema que un cierre mal hecho, con otra causa." }
      ]},
      { title: "Estructura de los endpoints · Automático (script)", items: [
        { criterio: "Todos los endpoints devuelven 200 y JSON válido con status, log y data", porQue: "El panel depende de ese formato exacto para actualizar la UI." },
        { criterio: "Un body con JSON mal formado responde 400 con mensaje claro, nunca 500 crudo", porQue: "Es uno de los motivos declarados de esta fase — sin este test, queda sin probar." },
        { criterio: "La cabecera CORS está presente tanto en la respuesta real como en el preflight OPTIONS", porQue: "Sin manejar el preflight, el navegador bloquea la llamada real aunque el POST llevara la cabecera correcta — el fallo solo se ve abriendo la consola del navegador." },
        { criterio: "Una petición de escritura sin project o sin agent en el body devuelve 400, nunca 200", porQue: "Confirma que el servidor no rellena valores por defecto." }
      ]},
      { title: "Conexión real, agente desechable · Automático (script)", items: [
        { criterio: "Para cada endpoint, invocar la función del pipeline directamente y comparar su resultado contra lo que devuelve el endpoint — coinciden", porQue: "Un endpoint que devuelve datos de ejemplo pasaría los checks de estructura sin estar conectado de verdad al pipeline." },
        { criterio: "Todas estas pruebas corren contra el agente y repositorio desechables — nunca contra Petal, tampoco las de solo lectura", porQue: "Es la restricción de seguridad no negociable del proyecto, sin excepción para lectura." },
        { criterio: "dry_run: el estado del agente desechable antes y después de la llamada es idéntico", porQue: "Confirma que dry_run no escribe de verdad, no solo que el servidor dice que no escribió." },
        { criterio: "La respuesta del endpoint del Paso 1 (Inventario) trae exactamente los 3 nombres de grupo que el panel espera pintar: emparejados, solo en CX, solo en el repositorio", porQue: "Es el campo más estructural y complejo de toda la respuesta — el que más se presta a que alguien invente su propia forma en vez de seguir la del panel. No se verifica el resto de campos aquí (ver la Fase 3, que remite al panel completo como especificación), solo este punto de mayor riesgo." }
      ]},
      { title: "Cero residuo · Automático (script)", items: [
        { criterio: "Todo recurso creado durante el test lleva un prefijo fijo más el ID de la corrida", porQue: "Permite identificar y borrar exactamente lo que creó cada ejecución, incluso si dos corridas se solapan." },
        { criterio: "Al empezar, el script busca y borra cualquier recurso con ese prefijo que haya quedado de una corrida anterior", porQue: "Un finally no protege contra un SIGKILL real — el residuo de una corrida abortada se limpia en la siguiente, no se acumula." },
        { criterio: "Al terminar (con éxito o con fallo), el recurso creado en CX se borra y el borrado se verifica leyendo el resultado", porQue: "Fiarse del código HTTP de la petición de borrado no confirma que el borrado ocurrió de verdad." },
        { criterio: "El repositorio desechable vuelve a su estado previo al test", porQue: "Un commit de prueba sin revertir es residuo permanente en el historial." },
        { criterio: "Matar el servidor con SIGKILL a mitad de una escritura — el candado de Firestore se libera por TTL, no queda ninguna versión a medio crear, y la siguiente corrida arranca limpia", porQue: "Es la comprobación de que la capa HTTP hereda la misma garantía de cero residuo que ya se exigió para el pipeline." },
        { criterio: "Si el cliente de test hace timeout mientras el servidor sigue poleando una operación larga, el test comprueba si la operación remota sigue viva antes de darse por cerrado", porQue: "Una operación que sigue corriendo del lado de Google puede crear la versión igualmente, después de que el test ya reportó fallo — dejando un recurso sin cuenta en la limpieza." }
      ]},
      { title: "Permisos · Automático (script)", items: [
        { criterio: "Forzar la falta del permiso IAM de Resource Manager y comprobar que el endpoint de Descubrimiento responde con un error claro, no un 500 crudo", porQue: "Un grep del código fuente pasa aunque el manejo esté roto o sea inalcanzable — solo forzar el caso real lo prueba." }
      ]},
      { title: "Onboarding, proyecto nunca vinculado · Automático (script)", items: [
        { criterio: "Contra un tercer proyecto GCP desechable sin ningún documento previo en Firestore, llamar al endpoint real de Vincular agente y repositorio y confirmar que se crea el documento con el esquema correcto", porQue: "Todas las demás pruebas de esta fase asumen que el vínculo agente↔repositorio ya existe — la lógica que lo crea por primera vez nunca se ejecuta de verdad en ningún otro sitio." },
        { criterio: "La región se detecta correctamente la primera vez, contra ese mismo proyecto sin historial", porQue: "Es la única llamada real al sondeo de las regiones que no parte de un mapeo ya resuelto en Firestore." },
        { criterio: "Provocar un fallo de IAM en ese proyecto nuevo (por ejemplo, sin el rol dialogflow.admin) — el endpoint lo reporta con un error claro y no deja un documento a medias en Firestore", porQue: "Un documento de Firestore a medio crear por un fallo de IAM sería residuo silencioso que ningún otro check de esta fase detecta." }
      ]}

const KEY = 'act_playbook_v5';
function loadState() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } }
function saveState(s) { localStorage.setItem(KEY, JSON.stringify(s)); }
function getPS(s, id) { return s[id] || { status: 'pending', notes: '', checked: [], decisions: {} }; }

let currentPhaseId = null;
let state = loadState();

function computeStatus(id) {
  const ps = getPS(state, id);
  if (ps.status === 'done' || ps.status === 'continued') return 'done';
  if ((ps.checked || []).some(Boolean)) return 'active-s';
  return 'pending';
}

function updateProgress() {
  const trackable = PHASES;
  const done = trackable.filter(p => ['done','continued'].includes((state[p.id] || {}).status)).length;
  document.getElementById('progressFill').style.width = Math.round(done / trackable.length * 100) + '%';
  document.getElementById('progressLabel').textContent = `${done} / ${trackable.length} fases`;
  const bar = document.querySelector('.topbar-progress-bar');
  if (bar) { bar.setAttribute('aria-valuenow', done); bar.setAttribute('aria-valuemax', trackable.length); }
}

function renderTabs() {
  const nav = document.getElementById('phaseTabs');
  nav.innerHTML = '';
  PHASES.forEach(p => {
    const status = computeStatus(p.id);
    const isActive = p.id === currentPhaseId;
    const tab = document.createElement('button');
    tab.setAttribute('role', 'tab');
    tab.setAttribute('aria-selected', isActive ? 'true' : 'false');
    tab.setAttribute('aria-controls', 'contentInner');
    tab.className = 'phase-tab' + (isActive ? ' active' : '') + (status === 'done' ? ' done-tab' : '') + (p.discarded ? ' discarded-tab' : '');
    const isGoal = p.special === 'goal';
    const isFileTyped = p.tagLabel.startsWith('.');
    const semantic = p.title.startsWith('validate_') ? 'Validate' : 'Build';
    const primaryTagHtml = (isFileTyped && !p.discarded)
      ? `<span class="tab-tag tag-${semantic.toLowerCase()}" aria-hidden="true">${semantic}</span>`
      : `<span class="tab-tag ${p.discarded ? 'tag-discarded' : 'tag-'+p.tag}" aria-hidden="true">${p.discarded ? 'Descartada' : p.tagLabel}</span>`;
    const fileTypeBadgeHtml = (isFileTyped && !p.discarded)
      ? `<span class="tab-filetype" aria-hidden="true">${p.tagLabel}</span>` : '';
    tab.setAttribute('aria-label', p.special === 'goal' ? `Objetivo del proyecto` : `Fase ${p.id}: ${semantic} · ${p.title} — estado: ${status === 'done' ? 'completada' : status === 'active-s' ? 'en progreso' : 'pendiente'}`);
    tab.innerHTML = `
      <div class="tab-top">
        <span class="tab-num" aria-hidden="true">${p.id}</span>
        ${primaryTagHtml}
      </div>
      <div class="tab-name">${p.title}</div>
      ${fileTypeBadgeHtml}`;
    tab.addEventListener('click', () => loadPhase(p.id));
    nav.appendChild(tab);
  });
  updateProgress();
}

function toggleBlock(id) {
  const body = document.getElementById('bb-' + id);
  const hdr = document.getElementById('bh-' + id);
  if (!body) return;
  const hidden = body.classList.toggle('hidden');
  hdr.classList.toggle('collapsed', hidden);
  hdr.setAttribute('aria-expanded', hidden ? 'false' : 'true');
}

function groupCollapseWrap(idPrefix, idx, title, bodyHtml) {
  const id = idPrefix + '-g' + idx;
  const startCollapsed = !/Manual/i.test(title || '');
  return `<div class="checklist-group">
    <button class="checklist-group-header${startCollapsed ? ' collapsed' : ''}" id="bh-${id}"
            onclick="toggleBlock('${id}')" aria-expanded="${startCollapsed ? 'false' : 'true'}" aria-controls="bb-${id}">
      <span>${title}</span><span class="cg-toggle" aria-hidden="true">▾</span>
    </button>
    <div class="cg-body${startCollapsed ? ' hidden' : ''}" id="bb-${id}">${bodyHtml}</div>
  </div>`;
}

function makeBlock(type, icon, label, id, bodyHtml, startOpen) {
  return `<div class="block ${type}">
    <button class="block-header${startOpen ? '' : ' collapsed'}" id="bh-${id}"
            onclick="toggleBlock('${id}')"
            aria-expanded="${startOpen ? 'true' : 'false'}"
            aria-controls="bb-${id}">
      <span aria-hidden="true">${icon}</span><span>${label}</span>
      <span class="bh-toggle" aria-hidden="true">▾</span>
    </button>
    <div class="block-body${startOpen ? '' : ' hidden'}" id="bb-${id}" role="region" aria-labelledby="bh-${id}">${bodyHtml}</div>
  </div>`;
}

function renderList(items, ordered) {
  return `<ul class="llm-list${ordered ? ' steps' : ''}">${items.map(i => `<li>${i}</li>`).join('')}</ul>`;
}
