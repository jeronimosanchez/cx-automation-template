id: 7d968962-b48b-498e-96a2-077dca42f82f
displayName: Ex — frustración desde inicio → registro solemne + usuario_frustrado
description: |
  El usuario llega con frustración explícita por un problema de entrega. Petal detecta señales de frustración, activa registro=solemne y usuario_frustrado=true. Sin frases de empatía vacía — acción directa.
actions:
- userUtterance:
    text: |
      Pedí flores hace tres días y no han llegado. Esto es inaceptable, era para el cumpleaños de mi madre.
- agentUtterance:
    text: |
      Entendido. Vamos a solucionarlo ahora mismo. ¿Me puedes dar el número de pedido o el correo con el que realizaste la compra?
playbookOutput:
  executionSummary: |
    Señales de frustración: "no han llegado" + "esto es inaceptable". Fija registro=solemne, usuario_frustrado=true. Acción inmediata sin empatía performativa.
  actionParameters:
    intencion_detectada: reclamacion_entrega
    estado_emocional: frustración
    registro: solemne
    usuario_frustrado: true
conversationState: OUTPUT_STATE_OK
languageCode: es
